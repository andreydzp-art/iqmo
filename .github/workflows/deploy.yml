name: Deploy to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  test:
    name: PHPUnit (Unit) gate
    # Gate: deploy is blocked if the JWT crypto invariants drift. Pure-PHP
    # test, no .env / Laravel boot needed; ~1 minute total.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      # Deliberately no actions/cache here — see test.yml for rationale.
      - name: Use upstream Packagist
        run: composer config -g repos.packagist composer https://repo.packagist.org

      - name: Install dependencies (with dev)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify phpunit binary
        run: |
          if [ ! -x vendor/bin/phpunit ]; then
            echo "vendor/bin/phpunit missing after composer install"
            ls -la vendor/bin/ || true
            exit 1
          fi
          vendor/bin/phpunit --version

      - name: Run Unit tests
        run: vendor/bin/phpunit --testsuite=Unit --no-coverage

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Статикой управляет `node scripts/sync-site.mjs`. На VPS Node часто
      # не в PATH у non-interactive SSH (nvm и т.д.) — гоняем sync на runner'е
      # и копируем `laravel/public/site/` через rsync (см. docs/DEPLOY.md).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build static (sync-site)
        run: node scripts/sync-site.mjs

      - name: SSH — git to origin/main
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -Eeuxo pipefail
            APP_DIR="/var/www/iqmoschool_r_usr/data/www/iqmoschool.ru/app"
            test -d "$APP_DIR/.git" || { echo "ERROR: $APP_DIR is not a git repo on server"; exit 1; }
            echo "=== DEPLOY: git fetch + reset to origin/main ==="
            cd "$APP_DIR"
            git fetch --all --prune
            git reset --hard origin/main
            echo "=== DEPLOY: git OK ==="

      - name: Rsync public/site → VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER_IN: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_IN: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          # Секреты GitHub нередко содержат \r / пробел в конце / перевод строки — ssh тогда
          # падает с: hostname contains invalid characters.
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          DEPLOY_USER=$(trim "${DEPLOY_USER_IN:-}")
          DEPLOY_HOST=$(trim "${DEPLOY_HOST_IN:-}")
          if [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_USER или DEPLOY_HOST пустые после trim — проверьте Secrets (без лишних переносов в конце поля)."
            exit 1
          fi
          DEST="/var/www/iqmoschool_r_usr/data/www/iqmoschool.ru/app/laravel/public/site/"
          install -d -m 700 ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/iqmo_deploy
          chmod 600 ~/.ssh/iqmo_deploy
          echo "=== DEPLOY: rsync → host (len=${#DEPLOY_HOST}) path=.../laravel/public/site/ (user via ssh -l) ==="
          # user задаём -l, в dest остаётся только host:path (меньше шансов сломать разбор при лишних символах)
          rsync -az --delete \
            -e "ssh -i ${HOME}/.ssh/iqmo_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -l \"$DEPLOY_USER\"" \
            "laravel/public/site/" \
            "${DEPLOY_HOST}:${DEST}"
          echo "=== DEPLOY: rsync OK ==="

      - name: SSH — Laravel (composer, migrate, cleanup, fpm)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -Eeuxo pipefail
            APP_DIR="/var/www/iqmoschool_r_usr/data/www/iqmoschool.ru/app"
            LARAVEL_DIR="${APP_DIR}/laravel"
            # К этому моменту static-слой уже зеркален к origin/main; при сбое composer
            # `laravel/public/site/` остаётся с актуальной статикой.
            echo "=== DEPLOY: remove stray public admin + root static (nginx must not beat public/site) ==="
            # Nginx ищет статику в `public/` ДО того, как уйти в `public/site/` через
            # Laravel. Любой stale `chem-progress.js` / `iqmo-base.css` / `subject-*.html`
            # в корне `public/`, оставшийся от старых деплоев, перекрывает свежую копию
            # из `public/site/` (Last-Modified не двигается, статика «зависает на 25 апр»).
            # Поэтому подметаем все распространённые статичные расширения на верхнем
            # уровне `public/` — `index.php` и `.htaccess` остаются, потому что они
            # с другими расширениями.
            find "$LARAVEL_DIR/public" -maxdepth 1 -type f \( \
              -name '*.html' -o -name '*.js' -o -name '*.css' \
              -o -name '*.svg' -o -name '*.png' -o -name '*.jpg' \
              -o -name '*.jpeg' -o -name '*.gif' -o -name '*.webp' \
              -o -name '*.ico' -o -name '*.map' \
            \) -print -delete || true
            rm -rf "$LARAVEL_DIR/public/admin" || true
            echo "=== DEPLOY: composer install (Laravel) ==="
            cd "$LARAVEL_DIR"
            composer install --no-dev --optimize-autoloader --no-interaction
            echo "=== DEPLOY: php artisan migrate + optimize:clear ==="
            php artisan migrate --force
            php artisan optimize:clear
            echo "=== DEPLOY: opcache touch + optional php-fpm reload (non-fatal) ==="
            find "$LARAVEL_DIR/app" "$LARAVEL_DIR/bootstrap" "$LARAVEL_DIR/routes" \
              -name '*.php' -exec touch {} + 2>&1 || echo "WARN: touch step failed (non-fatal)"
            sudo -n systemctl reload php8.3-fpm 2>&1 \
              && echo "php8.3-fpm reloaded" \
              || echo "WARN: php8.3-fpm reload skipped (need NOPASSWD sudo on the server)"
            # `touch` + optimize:clear не помогают, если opcache настроен с
            # `validate_timestamps=0` — bytecode `routes/iqmo_api.php` живёт
            # до явного сброса. Дёргаем internal-роут с loopback (см. routes/web.php),
            # секрет не нужен — REMOTE_ADDR=127.0.0.1.
            echo "=== DEPLOY: opcache_reset() via loopback request ==="
            # Файл `public/_opcache_reset.php` намеренно standalone (не Laravel-роут):
            # сам routes/web.php лежит в opcache, поэтому новые роуты в нём не видны
            # до сброса. Standalone PHP-файл, которого раньше не было, opcache
            # подхватывает сразу. Нгинкс резолвится через --resolve на 127.0.0.1.
            curl -fsS -k -m 10 -X POST \
              --resolve www.iqmoschool.ru:443:127.0.0.1 \
              "https://www.iqmoschool.ru/_opcache_reset.php" \
              && echo "" \
              || echo "WARN: opcache reset request failed (file missing or nginx denied access)"
            echo "=== DEPLOY: Laravel layer OK ==="

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: HTTP smoke (homepage, subject page, API, nav script)
        env:
          DEPLOY_SMOKE_URL: ${{ secrets.DEPLOY_SMOKE_URL }}
        run: |
          set -euo pipefail
          BASE="${DEPLOY_SMOKE_URL:-https://www.iqmoschool.ru}"
          BASE="${BASE%/}"

          echo "Smoke base: $BASE"

          code_home=$(curl -sS -o /tmp/smoke-home.html -w "%{http_code}" "$BASE/" || true)
          if [ "$code_home" != "200" ]; then
            echo "GET / expected 200, got $code_home"
            exit 1
          fi
          if ! grep -q "IQMO" /tmp/smoke-home.html; then
            echo "Homepage body missing expected marker (IQMO)"
            head -c 400 /tmp/smoke-home.html | cat -v
            exit 1
          fi

          # /index.html — legacy URL для главной. Сейчас 301 на /, чтобы не было
          # двух URL с идентичным контентом (SEO-дубль). Если кто-то добавит
          # отдельный handler для /index.html, отдающий 200 — этот guard упадёт.
          code_legacy_index=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/index.html" || true)
          if [ "$code_legacy_index" != "301" ]; then
            echo "Legacy /index.html expected 301 (SEO redirect to /), got $code_legacy_index"
            exit 1
          fi
          loc_legacy_index=$(curl -sSI "$BASE/index.html" | grep -i '^location:' | tr -d '\r' | awk '{print $2}')
          loc_legacy_index_path=$(echo "$loc_legacy_index" | sed -E 's|^https?://[^/]+||' | sed 's|/*$||')
          # Пустой path = `/` после нормализации. Допускаем «/» или «» (если
          # Laravel вернул только корень).
          if [ "$loc_legacy_index_path" != "" ] && [ "$loc_legacy_index_path" != "/" ]; then
            echo "Legacy /index.html should redirect to /, got Location: $loc_legacy_index"
            exit 1
          fi

          # Subject pages: caнoничeский URL — clean-URL без .html
          # (/subject-chemistry/, /subject-biology/), а /subject-{name}.html
          # должен 301-редиректить на новый URL для сохранения SEO.
          code_subj=$(curl -sS -o /tmp/smoke-subj.html -w "%{http_code}" "$BASE/subject-chemistry/" || true)
          if [ "$code_subj" != "200" ]; then
            echo "GET /subject-chemistry/ expected 200, got $code_subj"
            exit 1
          fi
          if ! grep -qi "хими" /tmp/smoke-subj.html; then
            echo "Subject page body missing chemistry context"
            head -c 500 /tmp/smoke-subj.html | cat -v
            exit 1
          fi
          # Регрессия: stale-копии в laravel/public/*.html nginx-ом отдавались без Метрики
          # (counter id 108770166). Источник правды — public/site/subject-chemistry/index.html.
          if ! grep -q "108770166" /tmp/smoke-subj.html; then
            echo "Subject page missing Yandex Metrika counter (108770166) — likely a stale page bypassing Laravel"
            exit 1
          fi
          # Старый URL должен 301-редиректить на новый (Laravel может
          # канонизировать URL без trailing slash и/или превратить в абсолютный
          # — поэтому сравниваем нормализованный path-сегмент, а не точную строку).
          code_legacy=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/subject-chemistry.html" || true)
          if [ "$code_legacy" != "301" ]; then
            echo "Legacy /subject-chemistry.html expected 301 (SEO redirect), got $code_legacy"
            exit 1
          fi
          loc_legacy=$(curl -sSI "$BASE/subject-chemistry.html" | grep -i '^location:' | tr -d '\r' | awk '{print $2}')
          # Нормализуем: убираем https://host префикс и trailing-слеш в конце.
          loc_path=$(echo "$loc_legacy" | sed -E 's|^https?://[^/]+||' | sed 's|/*$||')
          if [ "$loc_path" != "/subject-chemistry" ]; then
            echo "Legacy redirect should land on /subject-chemistry[/], got: $loc_legacy"
            exit 1
          fi
          # Цепочка с -L должна отдать 200 — конечная страница доступна.
          final_code=$(curl -sSL -o /dev/null -w "%{http_code}" "$BASE/subject-chemistry.html" || true)
          if [ "$final_code" != "200" ]; then
            echo "Following legacy redirect gave HTTP $final_code (expected 200)"
            exit 1
          fi

          # Полный пробный вариант — clean URL и 301 со старого .html, идентично
          # /subject-<slug>/. Файлы в public/site/full-test-<slug>/index.html
          # синхронизируются sync-site.mjs.
          for ft in chemistry biology; do
            code_ft=$(curl -sS -o /tmp/smoke-ft.html -w "%{http_code}" "$BASE/full-test-$ft/" || true)
            if [ "$code_ft" != "200" ]; then
              echo "GET /full-test-$ft/ expected 200, got $code_ft"
              exit 1
            fi
            if ! grep -q "108770166" /tmp/smoke-ft.html; then
              echo "/full-test-$ft/ missing Yandex Metrika counter — possibly stale public/$ft.html bypassing Laravel"
              exit 1
            fi
            code_ft_legacy=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/full-test-$ft.html" || true)
            if [ "$code_ft_legacy" != "301" ]; then
              echo "Legacy /full-test-$ft.html expected 301, got $code_ft_legacy"
              exit 1
            fi
            ft_final=$(curl -sSL -o /dev/null -w "%{http_code}" "$BASE/full-test-$ft.html" || true)
            if [ "$ft_final" != "200" ]; then
              echo "Following /full-test-$ft.html redirect gave HTTP $ft_final (expected 200)"
              exit 1
            fi
          done

          # /profile/ — clean URL кабинета (см. routes/web.php). Старый
          # /profile.html обязан 301-редиректить на /profile/ — это часть
          # SEO-канонизации (как у subject/full-test).
          code_prof=$(curl -sS -o /tmp/smoke-prof.html -w "%{http_code}" "$BASE/profile/" || true)
          if [ "$code_prof" != "200" ]; then
            echo "GET /profile/ expected 200, got $code_prof"
            exit 1
          fi
          if ! grep -q "108770166" /tmp/smoke-prof.html; then
            echo "/profile/ missing Yandex Metrika counter — likely stale public/profile.html bypassing Laravel"
            exit 1
          fi
          code_prof_legacy=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/profile.html" || true)
          if [ "$code_prof_legacy" != "301" ]; then
            echo "Legacy /profile.html expected 301, got $code_prof_legacy"
            exit 1
          fi
          loc_prof=$(curl -sSI "$BASE/profile.html" | grep -i '^location:' | tr -d '\r' | awk '{print $2}')
          loc_prof_path=$(echo "$loc_prof" | sed -E 's|^https?://[^/]+||' | sed 's|/*$||')
          if [ "$loc_prof_path" != "/profile" ]; then
            echo "Legacy /profile.html should land on /profile[/], got: $loc_prof"
            exit 1
          fi

          # Проверка меню «Биология» намеренно не в smoke: сразу после deploy edge/CDN
          # может кратковременно отдавать старую HTML — ложные падения. Статика
          # гарантируется `sync-site` из `extracted/` на APP_DIR (см. docs/DEPLOY.md).

          curl -fsS -o /tmp/smoke-nav.js "$BASE/iqmo-nav.js"
          if ! grep -q "__iqmoAuthReady" /tmp/smoke-nav.js; then
            echo "iqmo-nav.js missing expected bootstrap"
            exit 1
          fi

          code_me=$(curl -sS -o /tmp/smoke-me.json -w "%{http_code}" \
            -H "Accept: application/json" \
            "$BASE/api/me" || true)
          if [ "$code_me" != "401" ]; then
            echo "GET /api/me (guest) expected 401, got $code_me"
            cat /tmp/smoke-me.json || true
            exit 1
          fi
          if ! grep -q "unauthorized" /tmp/smoke-me.json; then
            echo "Expected JSON error unauthorized, got:"
            cat /tmp/smoke-me.json
            exit 1
          fi

          # Каноничный URL админки — /admin/. Гость не должен видеть содержимое
          # ни на /admin/, ни на legacy /admin/index.html: middleware iqmo.portal_admin
          # вступает раньше handler-а с 301-редиректом, поэтому оба URL обязаны
          # отвечать 302 (на /login.html) / 403 / 503, но не 200 и не 301.
          for admin_url in "$BASE/admin/" "$BASE/admin/index.html"; do
            code_admin=$(curl -sS -o /tmp/smoke-admin.html -w "%{http_code}" "$admin_url" || true)
            if [ "$code_admin" = "200" ]; then
              echo "GET $admin_url must not return 200 for anonymous (got 200 — check Nginx static bypass / public/admin)"
              head -c 300 /tmp/smoke-admin.html | cat -v
              exit 1
            fi
            if [ "$code_admin" = "301" ]; then
              echo "GET $admin_url returned 301 — guests must hit middleware before any redirect"
              exit 1
            fi
            if [ "$code_admin" != "302" ] && [ "$code_admin" != "403" ] && [ "$code_admin" != "503" ]; then
              echo "GET $admin_url expected 302, 403 or 503 for guest, got $code_admin"
              head -c 300 /tmp/smoke-admin.html | cat -v
              exit 1
            fi
          done

          # Regression guard: POST /api/auth/login must reach Laravel (any 4xx/2xx is fine,
          # but a 404 means routes/iqmo_api.php was not loaded — see bootstrap/app.php).
          code_login=$(curl -sS -o /tmp/smoke-login.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$BASE/api/auth/login" || true)
          if [ "$code_login" = "404" ]; then
            echo "POST /api/auth/login returned 404 — IQMO API routes are not registered. Check laravel/bootstrap/app.php"
            cat /tmp/smoke-login.json || true
            exit 1
          fi
          echo "Login endpoint reachable (HTTP $code_login)"

          # Regression guard: /uploads/login.html must be served (now via Laravel route from public/site/uploads).
          code_uplogin=$(curl -sS -o /tmp/smoke-uplogin.html -w "%{http_code}" "$BASE/uploads/login.html" || true)
          if [ "$code_uplogin" != "200" ]; then
            echo "GET /uploads/login.html expected 200, got $code_uplogin (the legacy public/uploads/ folder is gone — Laravel route should serve from public/site/uploads/)"
            head -c 300 /tmp/smoke-uplogin.html | cat -v
            exit 1
          fi

          # Security headers smoke: SecurityHeaders middleware must fire on the public site.
          # X-Content-Type-Options is the cheapest invariant — present on every web response.
          # If nginx is serving the homepage statically and bypassing PHP, this header
          # is the canary that tells us so.
          headers_home=$(curl -sSI "$BASE/" || true)
          if ! echo "$headers_home" | grep -qi "^x-content-type-options:"; then
            echo "Homepage missing X-Content-Type-Options — SecurityHeaders middleware did not run (nginx static bypass?)"
            echo "$headers_home"
            exit 1
          fi
          if ! echo "$headers_home" | grep -qi "^referrer-policy:"; then
            echo "Homepage missing Referrer-Policy"
            echo "$headers_home"
            exit 1
          fi

          # /admin must enforce stricter policy: X-Frame-Options + CSP, even on the
          # 302/403/503 the middleware sees before auth fires. Используем clean URL —
          # это новый канон, и именно его браузеры будут открывать.
          headers_admin=$(curl -sSI "$BASE/admin/" || true)
          if ! echo "$headers_admin" | grep -qi "^x-frame-options:.*DENY"; then
            echo "/admin missing X-Frame-Options: DENY"
            echo "$headers_admin"
            exit 1
          fi
          if ! echo "$headers_admin" | grep -qi "^content-security-policy:.*frame-ancestors"; then
            echo "/admin missing Content-Security-Policy with frame-ancestors"
            echo "$headers_admin"
            exit 1
          fi

          # Static asset Content-Type guard: PHP finfo is unreliable for short text files
          # and historically returned `text/x-asm` for .min.css, `text/html` for short .js.
          # Combined with `X-Content-Type-Options: nosniff`, browsers refuse such files —
          # the public login form rendered "naked" because main.min.css was rejected.
          # We force the right MIME by extension in routes/web.php; this guard catches a regression.
          assert_ct() {
            local url="$1"
            local expect="$2"
            local got
            got=$(curl -sS -o /dev/null -w "%{content_type}" "$url" || true)
            if ! echo "$got" | grep -qi "$expect"; then
              echo "Content-Type smoke FAIL: $url -> '$got' (expected to contain '$expect')"
              exit 1
            fi
          }
          assert_ct "$BASE/uploads/css/main.min.css" "text/css"
          assert_ct "$BASE/iqmo-nav.js" "application/javascript"

          echo "Smoke OK"

