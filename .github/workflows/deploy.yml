name: Deploy to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  test:
    name: PHPUnit (Unit) gate
    # Gate: deploy is blocked if the JWT crypto invariants drift. Pure-PHP
    # test, no .env / Laravel boot needed; ~1 minute total.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      # Deliberately no actions/cache here — see test.yml for rationale.

      - name: Install dependencies (with dev)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify phpunit binary
        run: |
          if [ ! -x vendor/bin/phpunit ]; then
            echo "vendor/bin/phpunit missing after composer install"
            ls -la vendor/bin/ || true
            exit 1
          fi
          vendor/bin/phpunit --version

      - name: Run Unit tests
        run: vendor/bin/phpunit --testsuite=Unit --no-coverage

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # script_stop is intentionally false: we run our own `set -e`, and the
          # external one masked the actual failure line in the runner log.
          script_stop: false
          script: |
            # `-x` keeps the actual failure line visible in the runner log
            # (the previous `script_stop: true` swallowed it).
            set -Eeuxo pipefail

            APP_DIR="/var/www/iqmoschool_r_usr/data/www/iqmoschool.ru/app"
            LARAVEL_DIR="${APP_DIR}/laravel"

            test -d "$APP_DIR/.git" || { echo "ERROR: $APP_DIR is not a git repo on server"; exit 1; }

            cd "$APP_DIR"
            git fetch --all --prune
            git reset --hard origin/main

            cd "$LARAVEL_DIR"
            composer install --no-dev --optimize-autoloader --no-interaction

            php artisan migrate --force
            php artisan optimize:clear

            # Nginx делает `try_files $uri ... /index.php`. Любая залежавшаяся .html-копия в
            # `laravel/public/` обходит Laravel-роуты, и пользователь видит версию от прошлого
            # деплоя (без Метрики, со старой вёрсткой и т.п.). Источник правды — `public/site/*.html`,
            # а в `laravel/public/` корневых .html в git нет вовсе. Поэтому смело сносим всё, что там есть.
            find "$LARAVEL_DIR/public" -maxdepth 1 -type f -name '*.html' -print -delete || true

            # Старая копия админки в public/ обходила Laravel (Nginx отдавал файл напрямую).
            rm -rf "$LARAVEL_DIR/public/admin"

            # No file copying needed: root-level `*.js`/`*.css` are served from `public/site/` via routes.

            # OPcache invalidation. Two strategies, both wrapped in `|| true` so
            # the deploy never fails just because we couldn't bump bytecode:
            #
            #   1) touch *.php — works whenever `opcache.validate_timestamps=1`
            #      (the typical default on bitrix/fastpanel hosts). USR2-free.
            #   2) sudo -n systemctl reload php8.3-fpm — graceful FPM reload,
            #      requires NOPASSWD sudo for this exact command (see docs/DEPLOY.md).
            #      If NOPASSWD isn't configured, sudo exits 1 and we just log it.
            #
            # The reload step used to be a structured `if sudo ...; then ... else ...; fi`
            # block, but combined with `script_stop: true` that block was killing
            # the *whole* SSH script in some environments before the deploy could
            # even reach `git fetch`. We now keep them separate, both `|| true`.
            find "$LARAVEL_DIR/app" "$LARAVEL_DIR/bootstrap" "$LARAVEL_DIR/routes" \
              -name '*.php' -exec touch {} + 2>&1 || echo "WARN: touch step failed (non-fatal)"

            sudo -n systemctl reload php8.3-fpm 2>&1 \
              && echo "php8.3-fpm reloaded" \
              || echo "WARN: php8.3-fpm reload skipped (need NOPASSWD sudo on the server)"

            echo "DEPLOY OK"

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: HTTP smoke (homepage, subject page, API, nav script)
        env:
          DEPLOY_SMOKE_URL: ${{ secrets.DEPLOY_SMOKE_URL }}
        run: |
          set -euo pipefail
          BASE="${DEPLOY_SMOKE_URL:-https://www.iqmoschool.ru}"
          BASE="${BASE%/}"

          echo "Smoke base: $BASE"

          code_home=$(curl -sS -o /tmp/smoke-home.html -w "%{http_code}" "$BASE/" || true)
          if [ "$code_home" != "200" ]; then
            echo "GET / expected 200, got $code_home"
            exit 1
          fi
          if ! grep -q "IQMO" /tmp/smoke-home.html; then
            echo "Homepage body missing expected marker (IQMO)"
            head -c 400 /tmp/smoke-home.html | cat -v
            exit 1
          fi

          code_subj=$(curl -sS -o /tmp/smoke-subj.html -w "%{http_code}" "$BASE/subject-chemistry.html" || true)
          if [ "$code_subj" != "200" ]; then
            echo "GET /subject-chemistry.html expected 200, got $code_subj"
            exit 1
          fi
          if ! grep -qi "хими" /tmp/smoke-subj.html; then
            echo "Subject page body missing chemistry context"
            head -c 500 /tmp/smoke-subj.html | cat -v
            exit 1
          fi
          # Регрессия: stale-копии в laravel/public/*.html nginx-ом отдавались без Метрики
          # (counter id 108770166). Источник правды — public/site/*.html через Laravel-роуты.
          if ! grep -q "108770166" /tmp/smoke-subj.html; then
            echo "Subject page missing Yandex Metrika counter (108770166) — likely a stale laravel/public/subject-chemistry.html bypassing Laravel"
            exit 1
          fi

          curl -fsS -o /tmp/smoke-nav.js "$BASE/iqmo-nav.js"
          if ! grep -q "__iqmoAuthReady" /tmp/smoke-nav.js; then
            echo "iqmo-nav.js missing expected bootstrap"
            exit 1
          fi

          code_me=$(curl -sS -o /tmp/smoke-me.json -w "%{http_code}" \
            -H "Accept: application/json" \
            "$BASE/api/me" || true)
          if [ "$code_me" != "401" ]; then
            echo "GET /api/me (guest) expected 401, got $code_me"
            cat /tmp/smoke-me.json || true
            exit 1
          fi
          if ! grep -q "unauthorized" /tmp/smoke-me.json; then
            echo "Expected JSON error unauthorized, got:"
            cat /tmp/smoke-me.json
            exit 1
          fi

          code_admin=$(curl -sS -o /tmp/smoke-admin.html -w "%{http_code}" "$BASE/admin/index.html" || true)
          if [ "$code_admin" = "200" ]; then
            echo "GET /admin/index.html must not return 200 for anonymous (got 200 — check Nginx static bypass / public/admin)"
            head -c 300 /tmp/smoke-admin.html | cat -v
            exit 1
          fi
          if [ "$code_admin" != "302" ] && [ "$code_admin" != "403" ] && [ "$code_admin" != "503" ]; then
            echo "GET /admin/index.html expected 302, 403 or 503 for guest, got $code_admin"
            head -c 300 /tmp/smoke-admin.html | cat -v
            exit 1
          fi

          # Regression guard: POST /api/auth/login must reach Laravel (any 4xx/2xx is fine,
          # but a 404 means routes/iqmo_api.php was not loaded — see bootstrap/app.php).
          code_login=$(curl -sS -o /tmp/smoke-login.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$BASE/api/auth/login" || true)
          if [ "$code_login" = "404" ]; then
            echo "POST /api/auth/login returned 404 — IQMO API routes are not registered. Check laravel/bootstrap/app.php"
            cat /tmp/smoke-login.json || true
            exit 1
          fi
          echo "Login endpoint reachable (HTTP $code_login)"

          # Regression guard: /uploads/login.html must be served (now via Laravel route from public/site/uploads).
          code_uplogin=$(curl -sS -o /tmp/smoke-uplogin.html -w "%{http_code}" "$BASE/uploads/login.html" || true)
          if [ "$code_uplogin" != "200" ]; then
            echo "GET /uploads/login.html expected 200, got $code_uplogin (the legacy public/uploads/ folder is gone — Laravel route should serve from public/site/uploads/)"
            head -c 300 /tmp/smoke-uplogin.html | cat -v
            exit 1
          fi

          # Security headers smoke: SecurityHeaders middleware must fire on the public site.
          # X-Content-Type-Options is the cheapest invariant — present on every web response.
          # If nginx is serving the homepage statically and bypassing PHP, this header
          # is the canary that tells us so.
          headers_home=$(curl -sSI "$BASE/" || true)
          if ! echo "$headers_home" | grep -qi "^x-content-type-options:"; then
            echo "Homepage missing X-Content-Type-Options — SecurityHeaders middleware did not run (nginx static bypass?)"
            echo "$headers_home"
            exit 1
          fi
          if ! echo "$headers_home" | grep -qi "^referrer-policy:"; then
            echo "Homepage missing Referrer-Policy"
            echo "$headers_home"
            exit 1
          fi

          # /admin must enforce stricter policy: X-Frame-Options + CSP, even on the
          # 302/403/503 the middleware sees before auth fires.
          headers_admin=$(curl -sSI "$BASE/admin/index.html" || true)
          if ! echo "$headers_admin" | grep -qi "^x-frame-options:.*DENY"; then
            echo "/admin missing X-Frame-Options: DENY"
            echo "$headers_admin"
            exit 1
          fi
          if ! echo "$headers_admin" | grep -qi "^content-security-policy:.*frame-ancestors"; then
            echo "/admin missing Content-Security-Policy with frame-ancestors"
            echo "$headers_admin"
            exit 1
          fi

          # Static asset Content-Type guard: PHP finfo is unreliable for short text files
          # and historically returned `text/x-asm` for .min.css, `text/html` for short .js.
          # Combined with `X-Content-Type-Options: nosniff`, browsers refuse such files —
          # the public login form rendered "naked" because main.min.css was rejected.
          # We force the right MIME by extension in routes/web.php; this guard catches a regression.
          assert_ct() {
            local url="$1"
            local expect="$2"
            local got
            got=$(curl -sS -o /dev/null -w "%{content_type}" "$url" || true)
            if ! echo "$got" | grep -qi "$expect"; then
              echo "Content-Type smoke FAIL: $url -> '$got' (expected to contain '$expect')"
              exit 1
            fi
          }
          assert_ct "$BASE/uploads/css/main.min.css" "text/css"
          assert_ct "$BASE/iqmo-nav.js" "application/javascript"

          echo "Smoke OK"

