name: Deploy to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  test:
    name: PHPUnit (Unit) gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: laravel/vendor
          key: composer-${{ runner.os }}-php83-${{ hashFiles('laravel/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php83-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Unit tests
        # Gate: deploy is blocked if the JWT crypto invariants drift.
        # IqmoJwtTest is pure PHP — no Laravel boot, no .env needed. The autoloader
        # from composer install is enough to resolve App\Services\IqmoJwt.
        run: vendor/bin/phpunit --testsuite=Unit --no-coverage

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/var/www/iqmoschool_r_usr/data/www/iqmoschool.ru/app"
            LARAVEL_DIR="${APP_DIR}/laravel"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: $APP_DIR is not a git repo on server"
              exit 1
            fi

            cd "$APP_DIR"
            git fetch --all --prune
            git reset --hard origin/main

            cd "$LARAVEL_DIR"
            composer install --no-dev --optimize-autoloader --no-interaction

            php artisan migrate --force
            php artisan optimize:clear

            # Nginx often does `try_files $uri ... /index.php`. Stale HTML copies here bypass Laravel
            # routes — old /index.html (меню) и /login.html (редирект-петля). Источник правды: public/site/*.html
            rm -f \
              "$LARAVEL_DIR/public/index.html" \
              "$LARAVEL_DIR/public/login.html" \
              "$LARAVEL_DIR/public/profile.html"

            # Старая копия админки в public/ обходила Laravel (Nginx отдавал файл напрямую).
            rm -rf "$LARAVEL_DIR/public/admin"

            # No file copying needed: root-level `*.js`/`*.css` are served from `public/site/` via routes.

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: HTTP smoke (homepage, subject page, API, nav script)
        env:
          DEPLOY_SMOKE_URL: ${{ secrets.DEPLOY_SMOKE_URL }}
        run: |
          set -euo pipefail
          BASE="${DEPLOY_SMOKE_URL:-https://www.iqmoschool.ru}"
          BASE="${BASE%/}"

          echo "Smoke base: $BASE"

          code_home=$(curl -sS -o /tmp/smoke-home.html -w "%{http_code}" "$BASE/" || true)
          if [ "$code_home" != "200" ]; then
            echo "GET / expected 200, got $code_home"
            exit 1
          fi
          if ! grep -q "IQMO" /tmp/smoke-home.html; then
            echo "Homepage body missing expected marker (IQMO)"
            head -c 400 /tmp/smoke-home.html | cat -v
            exit 1
          fi

          code_subj=$(curl -sS -o /tmp/smoke-subj.html -w "%{http_code}" "$BASE/subject-chemistry.html" || true)
          if [ "$code_subj" != "200" ]; then
            echo "GET /subject-chemistry.html expected 200, got $code_subj"
            exit 1
          fi
          if ! grep -qi "хими" /tmp/smoke-subj.html; then
            echo "Subject page body missing chemistry context"
            head -c 500 /tmp/smoke-subj.html | cat -v
            exit 1
          fi

          curl -fsS -o /tmp/smoke-nav.js "$BASE/iqmo-nav.js"
          if ! grep -q "__iqmoAuthReady" /tmp/smoke-nav.js; then
            echo "iqmo-nav.js missing expected bootstrap"
            exit 1
          fi

          code_me=$(curl -sS -o /tmp/smoke-me.json -w "%{http_code}" \
            -H "Accept: application/json" \
            "$BASE/api/me" || true)
          if [ "$code_me" != "401" ]; then
            echo "GET /api/me (guest) expected 401, got $code_me"
            cat /tmp/smoke-me.json || true
            exit 1
          fi
          if ! grep -q "unauthorized" /tmp/smoke-me.json; then
            echo "Expected JSON error unauthorized, got:"
            cat /tmp/smoke-me.json
            exit 1
          fi

          code_admin=$(curl -sS -o /tmp/smoke-admin.html -w "%{http_code}" "$BASE/admin/index.html" || true)
          if [ "$code_admin" = "200" ]; then
            echo "GET /admin/index.html must not return 200 for anonymous (got 200 — check Nginx static bypass / public/admin)"
            head -c 300 /tmp/smoke-admin.html | cat -v
            exit 1
          fi
          if [ "$code_admin" != "302" ] && [ "$code_admin" != "403" ] && [ "$code_admin" != "503" ]; then
            echo "GET /admin/index.html expected 302, 403 or 503 for guest, got $code_admin"
            head -c 300 /tmp/smoke-admin.html | cat -v
            exit 1
          fi

          # Regression guard: POST /api/auth/login must reach Laravel (any 4xx/2xx is fine,
          # but a 404 means routes/iqmo_api.php was not loaded — see bootstrap/app.php).
          code_login=$(curl -sS -o /tmp/smoke-login.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$BASE/api/auth/login" || true)
          if [ "$code_login" = "404" ]; then
            echo "POST /api/auth/login returned 404 — IQMO API routes are not registered. Check laravel/bootstrap/app.php"
            cat /tmp/smoke-login.json || true
            exit 1
          fi
          echo "Login endpoint reachable (HTTP $code_login)"

          # Regression guard: /uploads/login.html must be served (now via Laravel route from public/site/uploads).
          code_uplogin=$(curl -sS -o /tmp/smoke-uplogin.html -w "%{http_code}" "$BASE/uploads/login.html" || true)
          if [ "$code_uplogin" != "200" ]; then
            echo "GET /uploads/login.html expected 200, got $code_uplogin (the legacy public/uploads/ folder is gone — Laravel route should serve from public/site/uploads/)"
            head -c 300 /tmp/smoke-uplogin.html | cat -v
            exit 1
          fi

          # Security headers smoke: SecurityHeaders middleware must fire on the public site.
          # X-Content-Type-Options is the cheapest invariant — present on every web response.
          # If nginx is serving the homepage statically and bypassing PHP, this header
          # is the canary that tells us so.
          headers_home=$(curl -sSI "$BASE/" || true)
          if ! echo "$headers_home" | grep -qi "^x-content-type-options:"; then
            echo "Homepage missing X-Content-Type-Options — SecurityHeaders middleware did not run (nginx static bypass?)"
            echo "$headers_home"
            exit 1
          fi
          if ! echo "$headers_home" | grep -qi "^referrer-policy:"; then
            echo "Homepage missing Referrer-Policy"
            echo "$headers_home"
            exit 1
          fi

          # /admin must enforce stricter policy: X-Frame-Options + CSP, even on the
          # 302/403/503 the middleware sees before auth fires.
          headers_admin=$(curl -sSI "$BASE/admin/index.html" || true)
          if ! echo "$headers_admin" | grep -qi "^x-frame-options:.*DENY"; then
            echo "/admin missing X-Frame-Options: DENY"
            echo "$headers_admin"
            exit 1
          fi
          if ! echo "$headers_admin" | grep -qi "^content-security-policy:.*frame-ancestors"; then
            echo "/admin missing Content-Security-Policy with frame-ancestors"
            echo "$headers_admin"
            exit 1
          fi

          echo "Smoke OK"

