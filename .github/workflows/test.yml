name: Tests

# Cheap pre-deploy gate: PHPUnit Unit suite only — Feature tests need a real
# MySQL connection (the iqmo schema uses JSON / JSON_EXTRACT and is wired to a
# named `iqmo` connection), so they live elsewhere until we add a service
# container here. Unit tests cover the JWT crypto invariants we share with
# the Node API and would otherwise drift silently.

on:
  # Push to main is already gated by deploy.yml's `test` job — running the
  # same suite here twice is wasted CI minutes. Pull requests need their
  # own trigger because deploy.yml only runs on push.
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit-unit:
    name: PHPUnit (Unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: laravel/vendor
          key: composer-${{ runner.os }}-php83-${{ hashFiles('laravel/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php83-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate APP_KEY
        run: php artisan key:generate

      - name: Run Unit tests
        run: vendor/bin/phpunit --testsuite=Unit --no-coverage
