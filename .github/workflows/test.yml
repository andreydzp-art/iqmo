name: Tests

# Cheap pre-deploy gate: PHPUnit Unit suite only — Feature tests need a real
# MySQL connection (the iqmo schema uses JSON / JSON_EXTRACT and is wired to a
# named `iqmo` connection), so they live elsewhere until we add a service
# container here. Unit tests cover the JWT crypto invariants we share with
# the Node API and would otherwise drift silently.

on:
  # Run on PRs (so authors get fast feedback) and on push to main as a
  # non-blocking indicator — deploy.yml no longer gates on PHPUnit because a
  # red gate without admin-access to the Actions logs froze production for
  # half a day. We still want red builds to be visible in the Actions tab,
  # so push triggers the same suite here.
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit-unit:
    name: PHPUnit (Unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: laravel/vendor
          key: composer-${{ runner.os }}-php83-${{ hashFiles('laravel/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php83-

      - name: Use upstream Packagist (composer.json pins a regional mirror)
        run: composer config -g repos.packagist composer https://repo.packagist.org

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Unit tests
        # Pure PHP test — no Laravel boot, no .env needed.
        run: vendor/bin/phpunit --testsuite=Unit --no-coverage
