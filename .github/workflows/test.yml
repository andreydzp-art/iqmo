name: Tests

# Cheap pre-deploy gate: PHPUnit Unit suite + a curated subset of Feature tests
# that don't require a real MySQL connection. Most Feature tests use Breeze's
# RefreshDatabase + run our `analytics_events` migration which is pinned to the
# `iqmo` connection (config/database.php) — that connection points at a real
# MySQL host that we don't have in CI. Until we add a MySQL service container,
# we only run Feature tests that don't go through the full migrate-fresh:
#   - LoginRedirectTest: pure HTTP-level redirect contract, no DB writes.
#   - AnalyticsIngestTest: swaps `iqmo` → in-memory sqlite in setUp() and
#     creates only the analytics_events table by hand, so it exercises our
#     ingest controller end-to-end without touching MySQL.
# Unit tests cover the JWT crypto invariants we share with the Node API.

on:
  # Run on PRs (so authors get fast feedback) and on push to main as a
  # non-blocking indicator — deploy.yml no longer gates on PHPUnit because a
  # red gate without admin-access to the Actions logs froze production for
  # half a day. We still want red builds to be visible in the Actions tab,
  # so push triggers the same suite here.
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit-unit:
    name: PHPUnit (Unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      # NB: deliberately no actions/cache here. A stale vendor/ from a
      # previous run (e.g. one that ran `composer install --no-dev`) made
      # composer install a no-op, leaving vendor/bin/phpunit missing
      # → exit 127 "phpunit: not found". Reinstalling from scratch every
      # run takes ~30s and removes that whole class of failure.

      - name: Use upstream Packagist (composer.json pins a regional mirror)
        run: composer config -g repos.packagist composer https://repo.packagist.org

      - name: Install dependencies (with dev)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify phpunit is present
        # Defence-in-depth: fail fast with a clear message if --no-dev ever
        # sneaks back in (e.g. via COMPOSER_NO_DEV env in a hosted runner).
        run: |
          if [ ! -x vendor/bin/phpunit ]; then
            echo "vendor/bin/phpunit missing after composer install — dev deps not installed"
            ls -la vendor/bin/ || true
            exit 1
          fi
          vendor/bin/phpunit --version

      - name: Run Unit tests
        # Pure PHP test — no Laravel boot, no .env needed.
        run: vendor/bin/phpunit --testsuite=Unit --no-coverage

      - name: Run Feature tests (sqlite-only subset)
        # AnalyticsIngestTest swaps the `iqmo` connection to in-memory sqlite,
        # LoginRedirectTest doesn't touch the DB at all. Both run without any
        # external service. shivammathur/setup-php@v2 ships pdo_sqlite by
        # default, so no extra extension wiring is needed.
        run: vendor/bin/phpunit --filter='AnalyticsIngestTest|LoginRedirectTest' --no-coverage
