		<script src="/exam-config.js"></script>
		<script src="/biology-bank.js?v=27"></script>
		<script src="/biology-variants.js?v=4"></script>
		<script src="/iqmo-sync.js"></script>
		<script src="/iqmo-nav.js"></script>
		<script src="/mistakes-store.js"></script>
		<script src="/chem-progress.js?v=3"></script>
		<script>
			// ============================================================
			// QUESTION BANK (loaded from biology-bank.js)
			// Structure per question:
			//   id: task number (1..23)
			//   type: 'single' | 'multi' | 'input' | 'match' | 'open'
			//   title: short title for header
			//   body: HTML string (the task statement)
			//   options: [{id, label}]          — for single/multi
			//   correct: string | string[]      — expected answer (for auto-check)
			//     - single: "2"
			//     - multi:  ["1","5"]           (order-independent)
			//     - input:  "24" | "7"          (string compare)
			//     - match:  ["1","2","3"] in order A,Б,В
			//   matchLeft, matchRight: for 'match' type
			//   hint: optional string
			// ============================================================
			const BANK = window.BIOLOGY_QUESTIONS || [];
			const VARIANTS = window.BIOLOGY_VARIANTS || [];

			// ============================================================
			// ROUTING: variant picker vs. test
			// ============================================================
			const urlParams = new URLSearchParams(window.location.search);
			const variantParam = urlParams.get('v');

			// ---- DEV flag (hoisted to top of script) ----
			var DEV_UNLOCK_ALL = false;
			var PASS_THRESHOLD = 0.5;
			var COOLDOWN_MS = 60 * 60 * 1000;
			// При первом рендере карты уровней localStorage может быть ещё
			// пустым: iqmo-sync.js подтягивает iqmo-chem-streak / результаты
			// вариантов с сервера асинхронно. Без этого подписчика юзер
			// видел бы «0 дней подряд» и уже пройденные варианты как
			// заблокированные, пока не обновит страницу. Перерисовываем
			// карту уровней, как только iqmo-sync обновил localStorage.
			(function bindSyncRerender() {
				if (variantParam) return; // только для экрана выбора вариантов
				let scheduled = false;
				function rerender() {
					if (scheduled) return;
					scheduled = true;
					requestAnimationFrame(function () {
						scheduled = false;
						try { renderVariantPicker(); } catch (e) {}
					});
				}
				window.addEventListener('iqmo-sync', rerender);
				window.addEventListener('iqmo-sync-ready', rerender);
			})();

			(function runApp() {
			if (!variantParam) {
				renderVariantPicker();
				return; // stop here, picker only
			}

			// Resolve variant
			let activeVariant = null;
			let QUESTIONS = [];
			{
				const vid = Number(variantParam);
				activeVariant = VARIANTS.find(v => v.id === vid);
				if (!activeVariant || activeVariant.status !== 'ready' || !activeVariant.qids.length) {
					// Fallback: show picker
					renderVariantPicker();
					return;
				}
				QUESTIONS = activeVariant.qids.map(qid => BANK.find(b => b.id === qid)).filter(Boolean);
			}

			// Update subject label with variant
			try {
				const subj = document.querySelector('.breadcrumbs') || document.querySelector('.topbar__subject');
				if (subj) subj.innerHTML = `Биология · ОГЭ 2026 — <b>${activeVariant.title}</b>`;
			} catch(e) {}

			// ============================================================
			// STATE
			// ============================================================
			const LS_KEY = 'iqmo-bio-v-' + activeVariant.id;
			const EXAM_SUBJECT = (document.body && document.body.dataset.examSubject) || 'biology';
			const FULL_MIN = window.getExamTimerMinutes ? getExamTimerMinutes(EXAM_SUBJECT, 'full') : 180;
			const TEST_SECONDS = FULL_MIN * 60;
			const state = loadState();

			function loadState() {
				try {
					const raw = localStorage.getItem(LS_KEY);
					if (raw) {
						const s = JSON.parse(raw);
						if (s && typeof s === 'object') {
							if (!s.attemptId) {
								s.attemptId =
									(typeof crypto !== 'undefined' && crypto.randomUUID && crypto.randomUUID()) ||
									'at-' + Date.now().toString(36);
							}
							if (s.startEventSent == null) s.startEventSent = false;
							return s;
						}
					}
				} catch(e) {}
				return {
					current: 0,
					answers: {},   // { 1: '2', 2: ['1','5'], ... }
					flagged: {},   // { 1: true }
					selfScores: {}, // { 20: {c1:true, c2:false, __reviewed:true}, ... }
					startedAt: Date.now(),
					finished: false,
					attemptId:
						(typeof crypto !== 'undefined' && crypto.randomUUID && crypto.randomUUID()) ||
						'at-' + Date.now().toString(36),
					startEventSent: false
				};
			}
			function saveState() {
				try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
			}

			(function fullAnalyticsStart() {
				if (state.finished || state.startEventSent || !QUESTIONS.length) return;
				try {
					if (window.ChemProgress && typeof ChemProgress.beginAttempt === 'function') {
						ChemProgress.beginAttempt({
							mode: 'full',
							subject: EXAM_SUBJECT,
							label: 'Полный вариант · ' + ((activeVariant && activeVariant.title) || ''),
							variantId: activeVariant && activeVariant.id != null ? activeVariant.id : null,
							variantTitle: (activeVariant && activeVariant.title) || '',
							totalQuestions: QUESTIONS.length,
							attemptId: state.attemptId
						});
					}
					state.startEventSent = true;
					saveState();
				} catch (eA) {}
			})();

			// ============================================================
			// COMPANION (Sputnik) — нейтральный наставник по прогрессу.
			// В тесте мы не показываем «верно/неверно» (симуляция ОГЭ),
			// поэтому реплики только мотивирующие, привязаны к позиции в тесте.
			// ============================================================
			const GM_COMPANION_LINES = {
				// Реплика для стартового экрана с картой уровней — не привязана к
				// позиции в тесте, а здоровается и объясняет, что происходит. Без
				// неё спутник появляется только после клика «Начать вариант» и
				// пользователь успевает решить, что персонаж пропал.
				hub:      { e: '🧑‍🚀', t: 'Привет! Я твой <b>спутник</b>. Выбери вариант — буду рядом во время теста и подскажу, на каком ты сейчас вопросе.' },
				start:    { e: '🧑‍🚀', t: 'Поехали! Просто отвечай как считаешь, а в конце вместе разберём ошибки.' },
				q5:       { e: '🚀',   t: 'Отлично, разогрелись! Дальше будет интереснее.' },
				half:     { e: '🌗',   t: 'Половина пути. Если устал — можно вернуться к флагнутым позже.' },
				q15:      { e: '🔬',   t: 'Третья четверть. Самые «жирные» баллы как раз здесь.' },
				lastFew:  { e: '⏳',   t: 'Остались последние задания. Ты молодец, что добрался досюда.' },
				lastOne:  { e: '🎯',   t: 'Последний вопрос! Ещё чуть-чуть.' },
				flag:     { e: '🏷',   t: 'Ок, отметил. Вернёшься к нему позже — у тебя ещё есть время.' },
				timer20:  { e: '⏰',   t: 'Осталось ~20 минут. Если есть пропущенные — пора их добить.' },
				timer5:   { e: '🔥',   t: 'Финиш близко (5 мин). Завершай по тому, что уже знаешь.' }
			};
			const _gmCompShown = {};
			function gmCompanionEnsure() {
				if (document.getElementById('gm-companion')) return;
				const wrap = document.createElement('div');
				wrap.className = 'gm-companion';
				wrap.id = 'gm-companion';
				wrap.innerHTML = `
					<div class="gm-companion__bubble" id="gm-companion-bubble">
						<button type="button" class="gm-companion__close" aria-label="Скрыть">×</button>
						<div id="gm-companion-text"></div>
					</div>
					<div class="gm-companion__avatar" id="gm-companion-avatar" title="Подсказка">🧑‍🚀</div>
				`;
				document.body.appendChild(wrap);
				wrap.querySelector('.gm-companion__close').addEventListener('click', () => gmCompanionHide(true));
				wrap.querySelector('#gm-companion-avatar').addEventListener('click', () => {
					const b = document.getElementById('gm-companion-bubble');
					if (b && b.classList.contains('is--shown')) gmCompanionHide(false);
					else gmCompanionSay('start', { force: true, sticky: true });
				});
			}
			function gmCompanionSay(key, opts) {
				opts = opts || {};
				if (!opts.force && _gmCompShown[key]) return;
				_gmCompShown[key] = true;
				gmCompanionEnsure();
				const line = GM_COMPANION_LINES[key];
				if (!line) return;
				const bubble = document.getElementById('gm-companion-bubble');
				const text = document.getElementById('gm-companion-text');
				const avatar = document.getElementById('gm-companion-avatar');
				if (avatar) avatar.textContent = line.e;
				if (text) text.innerHTML = line.t;
				if (bubble) {
					bubble.classList.add('is--shown');
					if (!opts.sticky) {
						clearTimeout(gmCompanionSay._t);
						gmCompanionSay._t = setTimeout(() => gmCompanionHide(false), 5500);
					}
				}
			}
			function gmCompanionHide(permanent) {
				const wrap = document.getElementById('gm-companion');
				if (!wrap) return;
				if (permanent) { wrap.remove(); return; }
				const b = document.getElementById('gm-companion-bubble');
				if (b) b.classList.remove('is--shown');
			}
			// Привязки по позиции в тесте — вызываем из renderQuestion()
			function gmCompanionPing(idx, total) {
				gmCompanionEnsure();
				if (idx === 0) gmCompanionSay('start');
				else if (idx === 4) gmCompanionSay('q5');
				else if (idx === Math.floor(total / 2)) gmCompanionSay('half');
				else if (idx === Math.floor(total * 0.75)) gmCompanionSay('q15');
				else if (idx === total - 3) gmCompanionSay('lastFew');
				else if (idx === total - 1) gmCompanionSay('lastOne');
			}

			// ============================================================
			// RENDER
			// ============================================================
			const elCard = document.getElementById('q-card');
			const elNavGrid = document.getElementById('nav-grid');
			const elPb = document.getElementById('pb-fill');
			const elAnsweredCount = document.getElementById('answered-count');
			const elTotalCount = document.getElementById('total-count');
			elTotalCount.textContent = String(QUESTIONS.length);

			// Сколько из QUESTIONS — письменные (часть 2)
			const QCOUNT = QUESTIONS.length;
			const WRITTEN_IDS = new Set(QUESTIONS.filter(q => q.type === 'written').map(q => q.id));

			function isAnswered(id) {
				const a = state.answers[id];
				if (Array.isArray(a)) return a.length > 0;
				return a !== undefined && a !== '';
			}

			function renderNav() {
				elNavGrid.innerHTML = '';
				const total = QCOUNT;
				for (let i = 0; i < total; i++) {
					const q = QUESTIONS[i];
					const btn = document.createElement('button');
					btn.className = 'nav-task';
					btn.textContent = i + 1;
					if (i === state.current) btn.classList.add('is--current');
					if (q && isAnswered(q.id)) btn.classList.add('is--answered');
					if (q && state.flagged[q.id]) btn.classList.add('is--flagged');
					if (q && q.type === 'written') btn.classList.add('is--written');
					if (!q) { btn.disabled = true; btn.style.opacity = '.35'; btn.style.cursor = 'not-allowed'; btn.title = 'Задание будет добавлено'; }
					btn.addEventListener('click', () => {
						if (!q) return;
						state.current = i;
						saveState();
						renderAll();
					});
					elNavGrid.appendChild(btn);
				}
				const answered = QUESTIONS.filter(q => isAnswered(q.id)).length;
				elAnsweredCount.textContent = answered;
				elPb.style.width = (answered / total * 100) + '%';
			}

			function renderQuestion() {
				try { gmCompanionPing(state.current, QCOUNT); } catch(e) {}
				const q = QUESTIONS[state.current];
				if (!q) {
					elCard.innerHTML = `
						<div class="q-head">
							<div class="q-head__left">
								<div class="q-tag">Задание ${state.current + 1} / ${QCOUNT}</div>
								<h1 class="q-title">Задание ещё не добавлено</h1>
							</div>
						</div>
						<div class="open-answer">Пришлите условие этого задания, и оно появится здесь.</div>
					`;
					return;
				}

				const flagged = !!state.flagged[q.id];
				let inputHtml = '';

				if (q.type === 'single' || q.type === 'multi') {
					const picked = state.answers[q.id];
					const pickedSet = new Set(Array.isArray(picked) ? picked : (picked ? [picked] : []));
					// Раньше при повторах шаффлили варианты (anti-cheat по позиции), но цифры
					// слева — это исходные id (1..6 из банка), и шаффл выдавал «5,1,4,2,3»,
					// что путает: и подсказки вида «верны 2 и 3» ссылаются именно на эти id.
					// Возвращаем фиксированный порядок: ОГЭ-задания так и устроены.
					const opts = q.options;
					inputHtml = `<div class="options" data-role="options" data-multi="${q.type === 'multi' ? '1' : '0'}">
						${opts.map(o => `
							<label class="option ${pickedSet.has(o.id) ? 'is--checked' : ''}" data-id="${o.id}">
								<span class="option__marker">${o.id}</span>
								<span class="option__label">${o.label}</span>
							</label>
						`).join('')}
					</div>`;
					// подсказка (q.hint) скрыта во время теста и будет показана на странице результатов
				}
				else if (q.type === 'input') {
					const v = state.answers[q.id] || '';
					// inputmode подбирается по форме корректного ответа: для дробных
					// чисел (134,6 / 134.6) — decimal (на мобилке клавиатура с точкой/
					// запятой), для целочисленных — numeric, для слов и буквенных
					// последовательностей — text (обычная клавиатура).
					const sample = Array.isArray(q.correct) ? (q.correct[0] || '') : String(q.correct || '');
					const inputMode = /^\d+[.,]\d+$/.test(sample)
						? 'decimal'
						: /^\d+$/.test(sample)
						? 'numeric'
						: 'text';
					inputHtml = `<div class="answer-input" data-role="input">
						<label for="ans-input">Ответ:</label>
						<input id="ans-input" type="text" inputmode="${inputMode}" autocomplete="off" value="${escapeAttr(v)}" placeholder="${q.placeholder || 'введите число'}" />
					</div>`;
					// подсказка (q.hint) скрыта во время теста и будет показана на странице результатов
				}
				else if (q.type === 'match') {
					const picked = Array.isArray(state.answers[q.id]) ? state.answers[q.id] : [];
					inputHtml = `<div class="match" data-role="match">
						${q.matchLeft.map((l, i) => `
							<div class="match__left"><b>${l.letter})</b> ${l.label}</div>
							<select class="match__select" data-idx="${i}">
								<option value="">—</option>
								${q.matchRight.map(r => `<option value="${r.id}" ${picked[i]===r.id?'selected':''}>${r.id}) ${r.label}</option>`).join('')}
							</select>
						`).join('')}
					</div>`;
				}
				else if (q.type === 'open') {
					inputHtml = `<div class="open-answer"><b>Развёрнутый ответ.</b> Решение проверяется вручную — запишите его на бумаге. После завершения теста экран предложит ввести, считаете ли вы задачу решённой.</div>`;
				}
				else if (q.type === 'written') {
					const v = state.answers[q.id] || '';
					inputHtml = `
						<div class="written-area">
							<label for="ans-written" style="font-size:13px; color:var(--muted); font-weight:600;">Ваше решение (черновик):</label>
							<textarea id="ans-written" placeholder="Запишите здесь уравнения, расчёты, наблюдения — свободной формой. Этот текст увидите только вы.">${v.replace(/</g,'&lt;')}</textarea>
							<div class="written-note">
								<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:2px;"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
								<div><b>Это задание части 2.</b> Решение проверяется вручную. После завершения теста вы увидите эталон и поставите себе баллы по критериям. Максимум — <b>${q.maxPoints || 3} балла</b>.</div>
							</div>
						</div>
					`;
				}

				elCard.innerHTML = `
					<div class="q-head">
						<div class="q-head__left">
							<div class="q-tag">${q.type === 'written' ? '<span class="part-banner">Часть 2</span>' : ''}Задание <b>${state.current + 1}</b> / ${QCOUNT} · ${taskTypeLabel(q)}</div>
							<h1 class="q-title">${q.title}</h1>
						</div>
						<button type="button" class="q-flag ${flagged?'is--on':''}" id="btn-flag">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="${flagged?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
							${flagged ? 'Отмечено' : 'Вернуться позже'}
						</button>
					</div>
					<div class="q-body">${q.body}</div>
					${inputHtml}
					<div class="q-foot">
						<div class="q-foot__left">
							${state.current > 0 ? `<button type="button" class="btn btn--ghost" id="btn-prev" title="Перейти к предыдущему заданию">← Назад</button>` : ''}
						</div>
						<div class="q-foot__right">
							<button type="button" class="btn btn--ghost" id="btn-clear">Очистить</button>
							<button type="button" class="btn btn--blue" id="btn-next">${state.current===QCOUNT-1?'К завершению →':'Следующее →'}</button>
						</div>
					</div>
				`;
				wireQuestion(q);
			}

			function taskTypeLabel(q) {
				switch(q.type) {
					case 'single': return 'один ответ';
					case 'multi': return q.pickCount ? `выбор ${q.pickCount}-х` : 'несколько ответов';
					case 'input': return 'число';
					case 'match': return 'соответствие';
					case 'open': return 'развёрнутый ответ';
					case 'written': return `развёрнутый ответ · до ${q.maxPoints || 3} баллов`;
				}
				return '';
			}

			function wireQuestion(q) {
				// flag
				document.getElementById('btn-flag').addEventListener('click', () => {
					const wasFlagged = !!state.flagged[q.id];
					state.flagged[q.id] = !wasFlagged;
					saveState();
					if (!wasFlagged) { try { gmCompanionSay('flag', { force: true }); } catch(e) {} }
					renderAll();
				});
				// prev / next
				const btnPrev = document.getElementById('btn-prev');
				if (btnPrev) {
					btnPrev.addEventListener('click', () => {
						if (state.current > 0) { state.current--; saveState(); renderAll(); }
					});
				}
				document.getElementById('btn-next').addEventListener('click', () => {
					if (state.current < QCOUNT - 1) { state.current++; saveState(); renderAll(); }
					else { finishTest(); }
				});
				document.getElementById('btn-clear').addEventListener('click', () => {
					delete state.answers[q.id];
					saveState();
					renderAll();
				});

				// options
				if (q.type === 'single' || q.type === 'multi') {
					const isMulti = q.type === 'multi';
					elCard.querySelectorAll('.option').forEach(el => {
						el.addEventListener('click', () => {
							const id = el.dataset.id;
							if (!isMulti) {
								state.answers[q.id] = id;
							} else {
								const cur = new Set(Array.isArray(state.answers[q.id]) ? state.answers[q.id] : []);
								if (cur.has(id)) cur.delete(id);
								else {
									if (q.pickCount && cur.size >= q.pickCount) {
										// swap oldest
										const first = cur.values().next().value;
										cur.delete(first);
									}
									cur.add(id);
								}
								state.answers[q.id] = Array.from(cur);
							}
							saveState();
							renderAll();
						});
					});
				}
				else if (q.type === 'input') {
					const input = document.getElementById('ans-input');
					input.addEventListener('input', () => {
						state.answers[q.id] = input.value.trim();
						saveState();
						renderNav();
					});
				}
				else if (q.type === 'match') {
					elCard.querySelectorAll('.match__select').forEach(sel => {
						sel.addEventListener('change', () => {
							const cur = Array.isArray(state.answers[q.id]) ? [...state.answers[q.id]] : [];
							const idx = Number(sel.dataset.idx);
							cur[idx] = sel.value;
							state.answers[q.id] = cur;
							saveState();
							renderNav();
						});
					});
				}
				else if (q.type === 'written') {
					const ta = document.getElementById('ans-written');
					if (ta) {
						ta.addEventListener('input', () => {
							state.answers[q.id] = ta.value;
							saveState();
							renderNav();
						});
					}
				}
			}

			function escapeAttr(s) { return String(s).replace(/"/g,'&quot;'); }

			// ============================================================
			// TIMER
			// ============================================================
			const elTimer = document.getElementById('timer');
			const elTimerVal = document.getElementById('timer-val');
			function tickTimer() {
				if (state.finished) return;
				const elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
				const left = Math.max(0, TEST_SECONDS - elapsed);
				const h = Math.floor(left / 3600);
				const m = Math.floor((left % 3600) / 60);
				const s = left % 60;
				elTimerVal.textContent = [h, m, s].map(x => String(x).padStart(2,'0')).join(':');
				const wasWarn = elTimer.classList.contains('is--warning');
				const wasDanger = elTimer.classList.contains('is--danger');
				elTimer.classList.toggle('is--warning', left < 20*60 && left >= 5*60);
				elTimer.classList.toggle('is--danger', left < 5*60);
				try {
					if (!wasWarn && left < 20*60 && left >= 5*60) gmCompanionSay('timer20');
					if (!wasDanger && left < 5*60 && left > 0) gmCompanionSay('timer5');
				} catch(e) {}
				if (left === 0) finishTest();
			}
			setInterval(tickTimer, 1000);
			tickTimer();

			// ============================================================
			// FINISH & RESULT
			// ============================================================
			function finishTest() {
				state.finished = true;
				if (!state.selfScores) state.selfScores = {};
				saveState();
				// Записываем в банк личных ошибок (только автопроверяемые)
				try {
					if (window.MistakesStore) {
						const items = QUESTIONS
							.filter(q => q.type !== 'written')
							.map(q => ({ qid: q.id, ok: checkAnswer(q).status === 'ok' }));
						window.MistakesStore.commitTestResults({ source: 'full', items });
					}
				} catch(e) {}
				// Обновляем попытки прогрессии по вариантам (порог части 1: 50%).
				// Стрик теперь считается отдельно — за выполнение дневной цели (см. chem-progress.js).
				try {
					let ok = 0, total = 0;
					QUESTIONS.forEach(q => {
						if (q.type === 'written') return;
						total++;
						if (checkAnswer(q).status === 'ok') ok++;
					});
					const ratio = total > 0 ? ok / total : 0;
					const PASS = 0.5;
					const COOLDOWN = 60 * 60 * 1000;
					const vid = activeVariant.id;
					let attempts = {};
					try { attempts = JSON.parse(localStorage.getItem('iqmo-bio-attempts') || '{}') || {}; } catch(e){}
					const cur = attempts[vid] || { attempts: 0 };
					if (ratio >= PASS) {
						// Вариант пройден — сбрасываем счётчик, обновляем стрик
						attempts[vid] = { attempts: 0, passedAt: Date.now() };
						localStorage.setItem('iqmo-bio-attempts', JSON.stringify(attempts));
					} else {
						// Провал — увеличиваем счётчик
						const newCount = (cur.attempts || 0) + 1;
						const entry = { attempts: newCount, lastFailAt: Date.now() };
						if (newCount >= 2) {
							entry.cooldownUntil = Date.now() + COOLDOWN;
							entry.attempts = 0; // сбрасываем после активации cooldown
						}
						attempts[vid] = entry;
						localStorage.setItem('iqmo-bio-attempts', JSON.stringify(attempts));
					}
				} catch(e) { console.error('progress update failed', e); }
				try {
					if (window.ChemProgress && typeof activeVariant !== 'undefined' && activeVariant) {
						const s = computeScoring();
						const part1Ratio = s.autoTotal > 0 ? s.autoPoints / s.autoTotal : 0;
						ChemProgress.recordAttempt({
							mode: 'full',
							variantId: activeVariant.id,
							variantTitle: activeVariant.title,
							label: 'Полный вариант · ' + activeVariant.title,
							correct: s.totalPoints,
							total: s.totalMax,
							percent: s.percent,
							passedPart1: part1Ratio >= 0.5,
							items: QUESTIONS.filter(function (q) { return q.type !== 'written'; }).map(function (q) {
								return { qid: q.id, ok: checkAnswer(q).status === 'ok' };
							})
						});
					}
				} catch (e2) {}

				// Геймификация: «глава пройдена», если этот вариант — последний ready
				// и его part1 ≥ 50%. Стреляем в Метрику и пускаем confetti на result-экране.
				try {
					const allVariants = window.BIOLOGY_VARIANTS || [];
					const readyOnly = allVariants.filter(v => v.status === 'ready');
					const lastReady = readyOnly[readyOnly.length - 1];
					const sNow = computeScoring();
					const isBossWin = lastReady && activeVariant && activeVariant.id === lastReady.id && sNow.part1Percent >= 50;
					if (isBossWin) {
						if (window.ym) ym(108770166, 'reachGoal', 'chapter_finished', { variant: activeVariant.id });
						setTimeout(() => gmFireConfetti({ particleCount: 160, spread: 100, origin: { y: 0.4 } }), 400);
					}
				} catch (e3) {}

				renderResult();
			}

			function renderResult() {
				const elTimerEl = document.getElementById('timer');
				if (elTimerEl) elTimerEl.style.display = 'none';
				try { gmCompanionHide(true); } catch (e) {}
				const s = computeScoring();
				const hasSelf = s.selfTotal > 0;
				const selfNeedsReview = hasSelf && s.selfReviewed < s.selfTotal;
				// Геймификация: звёзды и XP за этот вариант (по части 1).
				const gmStarsThis = gmStarsForPercent(s.part1Percent);
				const gmXpThis = gmXpForVariant(s.part1Percent);
				const gmGotPass = s.part1Percent >= 50;
				try {
					if (gmStarsThis === 3 && window.ym) ym(108770166, 'reachGoal', 'stars_3', { variant: activeVariant && activeVariant.id });
				} catch (e0) {}

				// Статус прогрессии по части 1
				const part1Ratio = s.autoTotal > 0 ? s.autoPoints / s.autoTotal : 0;
				const passedPart1 = part1Ratio >= 0.5;
				let progressBanner = '';
				try {
					const attempts = JSON.parse(localStorage.getItem('iqmo-bio-attempts') || '{}') || {};
					const cur = attempts[activeVariant.id];
					if (passedPart1) {
						const nextV = (window.BIOLOGY_VARIANTS || []).find(v => v.id === activeVariant.id + 1 && v.status === 'ready');
						progressBanner = `
							<div class="result-hint" style="background:#e7f6ec;color:#1f6b3b;border-left:3px solid var(--green);margin-top:16px;">
								✅ Вариант пройден · <b>${s.autoPoints}/${s.autoTotal}</b> в части 1 (≥ 50%).${nextV ? ` Вариант ${nextV.id} разблокирован.` : ''}
							</div>`;
					} else if (cur && cur.cooldownUntil && cur.cooldownUntil > Date.now()) {
						const mins = Math.ceil((cur.cooldownUntil - Date.now()) / 60000);
						progressBanner = `
							<div class="result-hint" style="background:#fdecd6;color:#8a5a1c;border-left:3px solid var(--amber);margin-top:16px;">
								⏱ Две попытки подряд не дотянули до 50%. Возвращайтесь через <b>${mins} мин</b> — за это время повторите темы, где ошиблись.
							</div>`;
					} else {
						progressBanner = `
							<div class="result-hint" style="background:#fdecd6;color:#8a5a1c;border-left:3px solid var(--amber);margin-top:16px;">
								⚠️ В части 1 <b>${s.autoPoints}/${s.autoTotal}</b> — нужно минимум 50% (${Math.ceil(s.autoTotal/2)}/${s.autoTotal}). Попробуйте ещё раз.
							</div>`;
					}
				} catch(e){}

				document.querySelector('.page__main').innerHTML = `
					<div class="container">
						<div class="result-wrap">
							<div class="result-card">
								<div class="q-tag" style="justify-content:center;">Тест завершён</div>
								<div class="result-score">${s.totalPoints}<span class="result-max">&nbsp;/&nbsp;${s.totalMax}</span></div>
								<p style="color:var(--muted); font-size:14px; margin-top:6px;">Первичных баллов · ${s.percent}%</p>

								${hasSelf ? `
								<div class="result-parts">
									<div class="result-part">
										<div class="result-part__label">Часть 1 · автопроверка</div>
										<div class="result-part__score">${s.autoPoints}<small>/ ${s.autoTotal}</small></div>
										<div class="result-part__meta">Задания 1–19 · краткий ответ</div>
									</div>
									<div class="result-part is--selfcheck">
										<div class="result-part__label">Часть 2 · самопроверка</div>
										<div class="result-part__score">${s.selfPoints}<small>/ ${s.selfMax}</small></div>
										<div class="result-part__meta">${selfNeedsReview
											? `Проверено ${s.selfReviewed} из ${s.selfTotal} — <b>откройте разбор</b>`
											: `Все ${s.selfTotal} задания проверены`}</div>
									</div>
								</div>
								` : `<div class="result-grade">Все задания проверены автоматически</div>`}

								<div class="result-breakdown">
									<div class="rb-item"><div class="rb-num">${QCOUNT}</div><div class="rb-label">всего заданий</div></div>
									<div class="rb-item"><div class="rb-num">${s.autoDone}</div><div class="rb-label">отвечено (ч.1)</div></div>
									<div class="rb-item"><div class="rb-num">${s.autoPoints}</div><div class="rb-label">правильно (ч.1)</div></div>
								</div>

								${selfNeedsReview ? `
									<p class="result-hint" style="background:#fff8ea; color:#8a5a1c; border-left:3px solid var(--amber);">
										⚠️ В части 2 есть непроверенные задания. Откройте разбор, сверьтесь с эталоном и поставьте баллы — итог обновится автоматически.
									</p>
								` : `
									<p class="result-hint">Часть 1 проверена автоматически, часть 2 — по эталону с критериями. В реальном ОГЭ также есть задание №23 (практическая работа в лаборатории) — в тренажёре оно пропущено.</p>
								`}

								${progressBanner}

								<div class="gm-combo-row">
									<span class="gm-stars-pill" title="Звёзды по этому варианту: 50/70/90% → 1/2/3★">
										<span aria-hidden="true">${'★'.repeat(gmStarsThis)}${'☆'.repeat(3 - gmStarsThis)}</span>
										<span>${gmStarsThis} из 3 звёзд</span>
									</span>
									${gmGotPass ? `
									<span class="gm-xp-pill" title="XP за этот вариант (бонус +50 за ≥80%, ещё +50 за ≥90%)">
										💎 +<span class="gm-combo-pill__num">${gmXpThis}</span> XP
									</span>` : `
									<span class="gm-combo-pill" style="background:#fdecd6;border-color:#f3d592;color:#8a5a1c;">
										💪 До зачёта (50%) не хватило ${Math.max(1, Math.ceil(s.autoTotal/2) - s.autoPoints)} ${(s.autoTotal/2 - s.autoPoints) === 1 ? 'верного ответа' : 'верных ответов'}
									</span>`}
									${s.bestStreak >= 3 ? `
									<span class="gm-combo-pill" title="Самая длинная серия правильных ответов подряд в этой попытке">
										🔥 Лучшее комбо <span class="gm-combo-pill__num">×${s.bestStreak}</span>
									</span>` : ''}
								</div>

								<div style="margin-top:24px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
									<button type="button" class="btn btn--blue" id="btn-review">${selfNeedsReview ? 'Перейти к самопроверке →' : 'Посмотреть разбор'}</button>
									<button type="button" class="btn btn--ghost" id="btn-restart">Пройти заново</button>
									<a href="/full-test-biology/" class="btn btn--ghost">← К вариантам</a>
								</div>
							</div>
						</div>
					</div>
				`;

				document.getElementById('btn-review').addEventListener('click', () => renderReview(selfNeedsReview ? 'part2' : 'all'));
				document.getElementById('btn-restart').addEventListener('click', () => {
					if (confirm('Начать заново? Все ответы будут удалены.')) {
						try { localStorage.removeItem(LS_KEY); } catch(e){}
						location.reload();
					}
				});
			}

			function computeScoring() {
				let autoPoints = 0, autoDone = 0, autoTotal = 0;
				let selfPoints = 0, selfMax = 0, selfReviewed = 0, selfTotal = 0;
				let curStreak = 0, bestStreak = 0;
				QUESTIONS.forEach(q => {
					if (q.type === 'written') {
						selfTotal++;
						const r = checkAnswer(q);
						selfPoints += r.earned || 0;
						selfMax += r.max || 0;
						if (r.reviewed) selfReviewed++;
					} else {
						autoTotal++;
						const res = checkAnswer(q);
						if (res.status !== 'skip') autoDone++;
						if (res.status === 'ok') {
							autoPoints++;
							curStreak++;
							if (curStreak > bestStreak) bestStreak = curStreak;
						} else {
							curStreak = 0;
						}
					}
				});
				const totalPoints = autoPoints + selfPoints;
				const totalMax = autoTotal + selfMax;
				const percent = totalMax > 0 ? Math.round(totalPoints / totalMax * 100) : 0;
				const part1Percent = autoTotal > 0 ? Math.round(100 * autoPoints / autoTotal) : 0;
				return {
					autoPoints, autoDone, autoTotal,
					selfPoints, selfMax, selfReviewed, selfTotal,
					totalPoints, totalMax, percent,
					part1Percent, bestStreak
				};
			}

			function checkAnswer(q) {
				const given = state.answers[q.id];
				const correct = q.correct;
				if (q.type === 'written') {
					const scores = (state.selfScores && state.selfScores[q.id]) || {};
					const earned = (q.criteria || []).reduce((s, c) => s + (scores[c.id] ? (c.points || 0) : 0), 0);
					const reviewed = !!(state.selfScores && state.selfScores[q.id] && state.selfScores[q.id].__reviewed);
					return { status: 'selfcheck', given, reviewed, earned, max: q.maxPoints || (q.criteria||[]).reduce((s,c)=>s+(c.points||0),0) };
				}
				// Делегируем сравнение в checkAnswerStatic — единая точка истины
				// для проверки ответов. Без этого экран ревью использовал свою
				// устаревшую логику (без нормализации «.» ↔ «,» и без поддержки
				// массива альтернативных текстовых вариантов для input).
				const status = checkAnswerStatic(q, given);
				return { status, given, correct };
			}

			function formatAnswer(q, val) {
				if (val === undefined || val === '' || (Array.isArray(val) && val.filter(x => x).length === 0)) {
					return '<span>нет ответа</span>';
				}
				if (q.type === 'match') {
					const arr = Array.isArray(val) ? val : [];
					return q.matchLeft.map((l, i) => `${l.letter}→${arr[i] || '—'}`).join(', ');
				}
				if (q.type === 'multi') {
					const arr = Array.isArray(val) ? [...val].sort() : [];
					return arr.join('');
				}
				return String(val);
			}

			function renderReview(filter) {
				const elTimerEl = document.getElementById('timer');

				const scoring = computeScoring();

				const items = QUESTIONS.map((q, idx) => ({ q, idx, res: checkAnswer(q) }));
				const filtered = items.filter(it => {

					.filter(v => v && v.id > activeVariant.id && v.status === 'ready' && Array.isArray(v.qids) && v.qids.length)
					.sort((a, b) => a.id - b.id))[0] || null;

								<div class="review-head__meta">Часть 1: <b>${scoring.autoPoints}/${scoring.autoTotal}</b> · Часть 2 (самопроверка): <b>${scoring.selfPoints}/${scoring.selfMax}</b> ${scoring.selfReviewed < scoring.selfTotal ? `· <span style="color:#8a5a1c;">непроверено ${scoring.selfTotal - scoring.selfReviewed}</span>` : ''}</div>

								<button type="button" data-f="ok"    class="${filter==='ok'?'is--on':''}">Правильно · ${okCount}</button>

								${showNextBtn ? `<a href="/full-test-biology/?v=${nextVariant.id}" class="btn btn--blue" id="btn-next-variant" title="Перейти к следующему варианту">${nextVariant.title || ('Вариант ' + nextVariant.id)} →</a>` : ''}
							</div>

						<div class="review-list">${listHtml}</div>
						${part2Count > 0 ? `
							<div class="sc-note">
								📋 В реальном ОГЭ по биологии также встречаются задания с <b>анализом результатов эксперимента</b> и работы с биологической схемой/таблицей. В онлайн-тренажёре их меньше, чем в очной форме — стоит дополнительно потренироваться с учителем или по сборникам ФИПИ.

				// wire self-check checkboxes
				document.querySelectorAll('.sc-criterion input[type="checkbox"]').forEach(cb => {
					cb.addEventListener('change', () => {
						const qid = Number(cb.dataset.qid);
						const cid = cb.dataset.cid;
						if (!state.selfScores) state.selfScores = {};
						if (!state.selfScores[qid]) state.selfScores[qid] = {};
						state.selfScores[qid][cid] = cb.checked;
						state.selfScores[qid].__reviewed = true;
						saveState();
						renderReview(filter); // re-render to update totals
					});
				});
			}

			function renderSelfCheckItem(q, idx, res) {
				const given = res.given || '';
				const answerHtml = given.trim()
					? `<div class="sc-your-answer">${String(given).replace(/</g,'&lt;')}</div>`

				const scores = (state.selfScores && state.selfScores[q.id]) || {};

						</div>

								<span>Итого по заданию</span>

			}

			// quit
			document.getElementById('btn-quit-exam').addEventListener('click', () => {
				if (confirm('Прервать вариант? Ответы сохранятся, вы сможете вернуться.')) {
					window.location.href = '/full-test-biology/';
				}
			});
			document.getElementById('btn-finish').addEventListener('click', () => {
				const answered = QUESTIONS.filter(q => isAnswered(q.id)).length;
				const msg = answered < QUESTIONS.length
					? `Вы ответили на ${answered} из ${QUESTIONS.length} доступных заданий. Завершить тест?`
					: 'Завершить тест?';
				if (confirm(msg)) finishTest();
			});

			// init
			function renderAll() { renderNav(); renderQuestion(); }
			if (state.finished) renderResult();
			else renderAll();
			})(); // end runApp

			// ============================================================
			// VARIANT PICKER (only used when ?v is missing/invalid)
			// ============================================================
			// ---- linear progression helpers ----
			// var (а не const) — иначе TDZ при вызовах из renderVariantPicker, который
			// исполняется из IIFE раньше места объявления.
			var STREAK_KEY = 'iqmo-chem-streak';
			var ATTEMPTS_KEY = 'iqmo-bio-attempts'; // { [vid]: { attempts: n, lastFailAt: ts, cooldownUntil: ts } }

			function loadAttempts() {
				try { return JSON.parse(localStorage.getItem(ATTEMPTS_KEY) || '{}') || {}; }
				catch(e){ return {}; }
			}
			function loadStreak() {
				try { return JSON.parse(localStorage.getItem(STREAK_KEY) || 'null') || { days: 0, lastDay: null }; }
				catch(e){ return { days: 0, lastDay: null }; }
			}
			function dayKey(ts) {
				const d = new Date(ts);
				return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
			}
			function computeStreakStatus(streak) {
				// Returns { days, todayDone, broken }
				const today = dayKey(Date.now());
				const yesterday = dayKey(Date.now() - 86400000);
				if (!streak.lastDay) return { days: 0, todayDone: false };
				if (streak.lastDay === today) return { days: streak.days, todayDone: true };
				if (streak.lastDay === yesterday) return { days: streak.days, todayDone: false };
				return { days: 0, todayDone: false, broken: true };
			}

			function getVariantResult(v) {
				// returns { passed, ok, total, ratio, inProgress } or null
				try {
					const raw = localStorage.getItem('iqmo-bio-v-' + v.id);
					if (!raw) return null;
					const s = JSON.parse(raw);
					if (!s) return null;
					const bank = window.BIOLOGY_QUESTIONS || [];
					let ok = 0, total = 0;
					(v.qids || []).forEach(qid => {
						const q = bank.find(b => b.id === qid);
						if (!q || q.type === 'written') return; // только часть 1 для порога
						total++;
						const given = s.answers ? s.answers[q.id] : undefined;
						if (checkAnswerStatic(q, given) === 'ok') ok++;
					});
					const ratio = total > 0 ? ok / total : 0;
					if (s.finished) {
						return { passed: ratio >= PASS_THRESHOLD, ok, total, ratio };
					}
					if (s.answers && Object.keys(s.answers).length > 0) {
						return { inProgress: true, ok, total, ratio };
					}
					return null;
				} catch(e){ return null; }
			}

			function msToHMS(ms) {
				if (ms <= 0) return '0 мин';
				const m = Math.ceil(ms / 60000);
				if (m < 60) return m + ' мин';
				const h = Math.floor(m / 60), mm = m % 60;
				return h + ' ч ' + (mm ? mm + ' мин' : '').trim();
			}

			// ============================================================
			// GAMIFICATION CALCULATIONS
			// XP/Level/Stars считаем из того же localStorage, что уже есть.
			// БД не трогаем: вся прогрессия может быть восстановлена из попыток.
			// ВАЖНО: данные таблиц/констант ниже встроены прямо в функции — иначе
			// при вызове до достижения объявления const ловим TDZ-ReferenceError.
			// ============================================================
			function gmLevelFromXp(xp) { return Math.floor((xp || 0) / 100); }
			function gmTitleForLevel(level) {
				const titles = [
					{ at: 0,  name: 'Новичок' },
					{ at: 5,  name: 'Ученик' },
					{ at: 10, name: 'Исследователь' },
					{ at: 15, name: 'Знаток' },
					{ at: 20, name: 'Магистр' },
					{ at: 30, name: 'Гуру ОГЭ' },
				];
				let cur = titles[0];
				for (const t of titles) { if (level >= t.at) cur = t; }
				return cur.name;
			}
			function gmStarsForPercent(percent) {
				if (percent >= 90) return 3;
				if (percent >= 70) return 2;
				if (percent >= 50) return 1;
				return 0;
			}
			// Лучший результат варианта (по части 1) с возможностью посчитать звёзды/XP.
			// Используем тот же localStorage('iqmo-bio-v-' + id) — там лежат финальные ответы.
			function gmVariantBest(v) {
				try {
					const raw = localStorage.getItem('iqmo-bio-v-' + v.id);
					if (!raw) return null;
					const s = JSON.parse(raw);
					if (!s || !s.finished) return null;
					const bank = window.BIOLOGY_QUESTIONS || [];
					let ok = 0, total = 0;
					(v.qids || []).forEach(qid => {
						const q = bank.find(b => b.id === qid);
						if (!q || q.type === 'written') return;
						total++;
						const given = s.answers ? s.answers[q.id] : undefined;
						if (checkAnswerStatic(q, given) === 'ok') ok++;
					});
					if (!total) return null;
					return { ok, total, percent: Math.round(100 * ok / total) };
				} catch (e) { return null; }
			}
			function gmXpForVariant(percent) {
				if (percent < 50) return 0;          // не зачёт — XP не идёт (cooldown логика)
				let xp = 100;                         // base за прохождение
				if (percent >= 80) xp += 50;
				if (percent >= 90) xp += 50;          // 100 + 50 + 50 = 200 за 3★
				return xp;
			}
			function gmComputedStats(variants) {
				let totalXp = 0, totalStars = 0, passed = 0;
				variants.forEach(v => {
					if (v.status !== 'ready') return;
					const best = gmVariantBest(v);
					if (!best) return;
					const stars = gmStarsForPercent(best.percent);
					totalStars += stars;
					if (stars >= 1) passed++;
					totalXp += gmXpForVariant(best.percent);
				});
				// XP за серию (бонус)
				try {
					const streak = loadStreak();
					if (streak.days >= 7) totalXp += 100;
					if (streak.days >= 14) totalXp += 100;
				} catch (e) {}
				const level = gmLevelFromXp(totalXp);
				return { totalXp, totalStars, passed, level, title: gmTitleForLevel(level) };
			}

			// «Самый коварный» — определяем эвристически: вариант, у которого по нашей
			// собственной аналитике процент прохождения с первой попытки самый низкий.
			// Пока бэк-аналитики per-variant нет — берём mock на основе позиции (середина
			// сложнее краёв). Когда придёт API /api/admin/quiz/variant-stats — заменим на
			// реальный fetch. Бейдж добавим максимум на один локед-узел.
			function gmDangerVariantId(variants) {
				const ready = variants.filter(v => v.status === 'ready');
				if (ready.length < 6) return null; // не показываем при малой выборке
				// Эвристика: вариант с id ≈ floor(0.6 * ready.length) — обычно «середина пути».
				const target = ready[Math.floor(ready.length * 0.6)];
				return target ? target.id : null;
			}

			// confetti: динамическая загрузка по требованию (не грузим, если не нужно).
			// var — защита от TDZ (ниже точки вызова).
			var _gmConfettiPromise = null;
			function gmLoadConfetti() {
				if (_gmConfettiPromise) return _gmConfettiPromise;
				_gmConfettiPromise = new Promise(resolve => {
					if (window.confetti) return resolve(window.confetti);
					const s = document.createElement('script');
					s.src = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js';
					s.async = true;
					s.onload = () => resolve(window.confetti);
					s.onerror = () => resolve(null);
					document.head.appendChild(s);
				});
				return _gmConfettiPromise;
			}
			function gmFireConfetti(opts) {
				gmLoadConfetti().then(c => {
					if (!c) return;
					c(Object.assign({
						particleCount: 80,
						spread: 70,
						origin: { y: 0.6 },
						colors: ['#4f46e5', '#7c3aed', '#10b981', '#f59e0b']
					}, opts || {}));
				});
			}

			// Ключ для отслеживания «свежей» разблокировки и level-up между визитами.
			// var (а не const) — иначе TDZ при вызовах из renderVariantPicker.
			var GM_SEEN_KEY = 'iqmo-bio-gm-seen';
			function gmLoadSeen() {
				try { return JSON.parse(localStorage.getItem(GM_SEEN_KEY) || '{}') || {}; }
				catch (e) { return {}; }
			}
			function gmSaveSeen(s) {
				try { localStorage.setItem(GM_SEEN_KEY, JSON.stringify(s)); } catch (e) {}
			}

			// ============================================================
			// LEVEL MAP (variant picker — gamified)
			// ============================================================
			function renderVariantPicker() {
				try { return _renderVariantPickerImpl(); }
				catch (e) {
					console.error('[gm] renderVariantPicker failed:', e);
					try { if (window.ym) ym(108770166, 'reachGoal', 'gm_picker_error', { message: String(e && e.message || e) }); } catch (e0) {}
					const picker = document.getElementById('variant-picker');
					if (picker) {
						picker.style.display = 'block';
						picker.innerHTML = `
							<div style="max-width:720px;margin:48px auto;padding:24px 28px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);">
								<h2 style="margin:0 0 8px;">Не удалось построить карту уровней</h2>
								<p style="color:var(--muted);margin:0 0 12px;">${String(e && e.message || e).replace(/</g,'&lt;')}</p>
								<p style="font-size:13px;color:var(--muted);margin:0 0 16px;">Если ошибка повторяется — попробуйте обновить страницу (Ctrl+F5). Список вариантов в безопасном режиме ниже.</p>
								<div id="vp-fallback"></div>
							</div>`;
						try { _renderVariantPickerFallback(document.getElementById('vp-fallback')); } catch (e1) {}
					}
				}
			}
			function _renderVariantPickerFallback(host) {
				if (!host) return;
				const variants = window.BIOLOGY_VARIANTS || [];
				const ready = variants.filter(v => v.status === 'ready');
				host.innerHTML = ready.map(v => `<a href="?v=${v.id}" style="display:inline-block;margin:4px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);text-decoration:none;font-weight:600;">${v.title || ('Вариант ' + v.id)}</a>`).join('');
			}
			// ============================================================
			// LEVEL MAP v2 — карта уровней («Полный вариант ОГЭ»)
			// 7 обычных узлов + 1 финальный босс. Реализация 1:1 по
			// _tmp_ft6/level-map.html. Старый код (renderGmNode и т.п.)
			// больше не используется и оставлен мёртвым кодом, чтобы не
			// рисковать при минорных будущих фиксах.
			// ============================================================
			function _renderVariantPickerImpl() {
				const picker = document.getElementById('variant-picker');
				const testRoot = document.getElementById('test-root');
				if (testRoot) testRoot.style.display = 'none';
				const timerEl = document.getElementById('timer');
				if (timerEl) timerEl.style.display = 'none';
				const quitBtn = document.getElementById('btn-quit-exam');
				if (quitBtn) quitBtn.style.display = 'none';
				const pb = document.getElementById('pb-fill');
				if (pb) pb.parentElement.style.display = 'none';
				if (!picker) return;
				picker.style.display = 'block';
				picker.classList.add('lm');

				const allVariants = window.BIOLOGY_VARIANTS || [];
				const ready = allVariants.filter(v => v.status === 'ready');
				// Карта уровней = первые 6 вариантов главы + 7-й как финальный
				// босс (как в _tmp_ft6/level-map.html — 6 узлов + 1 boss).
				// Берём первые 7 вариантов независимо от статуса: ready=играют,
				// coming=locked. Так карта остаётся целой даже на ранних
				// этапах банка (биология), а в химии (29 ready) — без изменений.
				if (allVariants.length < 7 || ready.length < 1) {
					_renderVariantPickerFallback(picker);
					return;
				}
				const chapterReady = allVariants.slice(0, 7);
				const bossId = chapterReady[6].id;
				const variantSlots = chapterReady.slice(0, 6); // обычные узлы
				const bossSlot = chapterReady[6];

				// Для каждого узла считаем done/current/locked.
				const attempts = loadAttempts();
				const streak = loadStreak();
				const streakStatus = computeStreakStatus(streak);
				const passOf = v => {
					if (!v || v.status !== 'ready') return null;
					const best = gmVariantBest(v);
					return best && best.percent >= 50 ? best : null;
				};
				const variantInfos = variantSlots.map((v, i) => {
					const best = passOf(v);
					return { v, i, isBoss: false, best };
				});
				// Состояния обычных узлов: первый ready non-done = current,
				// остальные ready после него и все coming = locked.
				let currentIdx = -1;
				for (let i = 0; i < variantInfos.length; i++) {
					const vi = variantInfos[i];
					if (vi.v.status === 'ready' && !vi.best) { currentIdx = i; break; }
				}
				variantInfos.forEach((vi, i) => {
					if (vi.best) vi.state = 'done';
					else if (i === currentIdx) vi.state = 'current';
					else vi.state = 'locked';
				});
				// Босс. Открыт только когда ВСЕ обычные пройдены и сам босс
				// уже опубликован (status === 'ready').
				const allRegularDone = variantInfos.every(vi => vi.state === 'done');
				const bossBest = passOf(bossSlot);
				const bossReady = bossSlot && bossSlot.status === 'ready';
				const bossInfo = {
					v: bossSlot, i: variantInfos.length, isBoss: true, best: bossBest,
					state: bossBest ? 'done' : (allRegularDone && bossReady ? 'current' : 'locked'),
				};

				// Метрики карты уровней: XP, звёзды, ср. балл.
				const stats = lmComputeChapterStats([...variantInfos, bossInfo]);
				// Глобальный уровень и серия — берём как раньше.
				const globalStats = gmComputedStats(allVariants);
				// Реальный профиль игрока (XP/уровень/название) — из chem-progress.js,
				// чтобы цифры в hero совпадали с subject-страницей. Идём по
				// «лёгкому» пути (localStorage + computeLevelDetail), чтобы не
				// триггерить тяжёлый getGamificationSnapshot (он подтягивает
				// бэйджи и в редких случаях может бросать). Если не получилось —
				// падаем на старую gmComputedStats.
				const realStats = (function () {
					try {
						if (!window.ChemProgress) return null;
						let totalPoints = 0;
						try {
							const raw = localStorage.getItem('iqmo-chem-progress-points-v1');
							if (raw != null && raw !== '') {
								let parsed = Number(raw);
								if (!Number.isFinite(parsed)) {
									try { parsed = Number(JSON.parse(raw)); } catch (eP) { parsed = 0; }
								}
								totalPoints = Math.max(0, Math.floor(Number(parsed) || 0));
							}
						} catch (eL) {}
						const computeLv = ChemProgress.computeLevelDetail || ChemProgress.getLevelDetail;
						if (typeof computeLv !== 'function') return null;
						const lv = computeLv(totalPoints);
						const titleFn = ChemProgress.getLevelTitle ||
							(typeof ChemProgress.levelTitleRu === 'function' ? ChemProgress.levelTitleRu : null);
						const title = (typeof titleFn === 'function')
							? (titleFn(lv && lv.current) || 'Новик')
							: 'Новик';
						return {
							totalPoints,
							level: lv && lv.current ? lv.current : 1,
							title,
							xpToNext: lv && lv.xpToNext != null ? Math.max(0, lv.xpToNext) : 0,
							isMax: !!(lv && lv.nextThreshold == null)
						};
					} catch (eRS) {
						try { console.warn('[gm] real stats failed:', eRS); } catch (e0) {}
						return null;
					}
				})();
				const heroStats = realStats || {
					totalPoints: globalStats.totalXp,
					level: globalStats.level,
					title: globalStats.title,
					xpToNext: 100 - (globalStats.totalXp % 100),
					isMax: false
				};
				const ringPct = stats.totalNodes ? Math.round(100 * stats.passed / stats.totalNodes) : 0;
				const dashOffset = Math.max(0, Math.round(226 * (1 - ringPct / 100)));

				const heroLead = (allRegularDone && !bossBest)
					? 'Все варианты пройдены. Открыт финальный босс — победите его, чтобы получить мастер-уровень.'
					: (bossBest)
						? 'Все варианты пройдены. Можно перерешать любой вариант, чтобы поднять звёзды.'
						: 'Проходите варианты по порядку. Следующий открывается, когда вы набираете не менее 50 % правильных ответов в части 1 текущего варианта.';

				const seen = gmLoadSeen();
				// «realLevel» — отдельное поле, чтобы новая (реальная) шкала уровней
				// не давала ложных level-up на пользователях, у которых seen.level
				// был сохранён по старой формуле gmComputedStats.
				const justLeveledUp = (seen.realLevel !== undefined) && heroStats.level > seen.realLevel;
				const freshUnlockId = (seen.lastUnlockedId == null && currentIdx >= 0)
					? variantInfos[currentIdx].v.id
					: (currentIdx >= 0 && variantInfos[currentIdx].v.id !== seen.lastUnlockedId
						? variantInfos[currentIdx].v.id : null);

				// Куда ведёт CTA «Начните серию» в hero: первый недопройденный
				// обычный вариант → босс, если все 6 пройдены → первый вариант
				// для перепрохождения, если пройдено всё, включая босса.
				let nextActionId = null;
				if (currentIdx >= 0) nextActionId = variantInfos[currentIdx].v.id;
				else if (allRegularDone && !bossBest) nextActionId = bossSlot.id;
				else if (variantInfos.length) nextActionId = variantInfos[0].v.id;

				picker.innerHTML = `
					<div class="lm-shell">
						${lmHeroHtml({ heroLead, stats, globalStats, heroStats, streakStatus, nextActionId })}
						${lmMapHtml({ variantInfos, bossInfo, currentIdx })}
						${lmGrid4Html({ stats, globalStats, streakStatus })}
						${lmTipHtml(stats, bossInfo)}
					</div>
				`;

				// Wire clicks
				picker.querySelectorAll('.lm-node[data-v]').forEach(btn => {
					btn.addEventListener('click', () => {
						const st = btn.dataset.state;
						const v = btn.dataset.v;
						if (st === 'locked') {
							alert('Чтобы открыть этот узел, пройдите предыдущие с результатом ≥ 50% в части 1.');
							return;
						}
						window.location.search = '?v=' + v;
					});
				});
				picker.querySelectorAll('.lm-start-btn[data-v]').forEach(btn => {
					btn.addEventListener('click', e => {
						e.stopPropagation();
						window.location.search = '?v=' + btn.dataset.v;
					});
				});
				// CTA в hero «Начните серию / Серия N дней» → текущий вариант
				picker.querySelectorAll('.lm-btn-streak[data-v]').forEach(btn => {
					btn.addEventListener('click', e => {
						e.preventDefault();
						const v = btn.dataset.v;
						if (!v) return;
						try { if (window.ym) ym(108770166, 'reachGoal', 'bio_full_hero_cta', { v }); } catch(e0) {}
						window.location.search = '?v=' + v;
					});
				});

				// Confetti / level-up
				if (justLeveledUp) {
					gmShowLevelUp(heroStats.level, heroStats.title);
					try { if (window.ym) ym(108770166, 'reachGoal', 'level_up', { level: heroStats.level }); } catch (e0) {}
				} else if (freshUnlockId) {
					setTimeout(() => gmFireConfetti({ origin: { y: 0.4 } }), 250);
				}

				// Save seen state
				seen.level = globalStats.level;
				seen.realLevel = heroStats.level;
				seen.lastUnlockedId = currentIdx >= 0 ? variantInfos[currentIdx].v.id : (allRegularDone ? bossSlot.id : null);
				gmSaveSeen(seen);

				// Live-лидерборд: тянем top-4 по XP из /api/leaderboard.
				try { lmLoadLeaderboard(); } catch (eLB) {}

				// Спутник встречает на витрине вариантов. Sticky — чтобы не
				// исчезал через 5.5 с, пока пользователь читает карту уровней;
				// крестик/клик по аватару закрывают как обычно.
				try { gmCompanionSay('hub', { sticky: true, force: true }); } catch (eC) {}
			}

			// ── live leaderboard (top по XP) ───────────────────────────────
			function lmLoadLeaderboard() {
				var host = document.getElementById('lm-lb-host');
				if (!host) return;
				function fmtPts(n) {
					try { return new Intl.NumberFormat('ru-RU').format(Math.max(0, Math.floor(n || 0))); }
					catch (e) { return String(Math.max(0, Math.floor(n || 0))); }
				}
				function rowHtml(it, isTopRow) {
					var rank = Number(it.rank) || 0;
					var rankCls = ['', 'lm-lb-1', 'lm-lb-2', 'lm-lb-3'][rank] || '';
					var nameRaw = it.is_me ? 'Вы' : (it.display || 'user');
					var name = String(nameRaw).replace(/[<>&"']/g, function (c) {
						return ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;' })[c];
					});
					var meStyle = it.is_me ? ' style="background: var(--lm-primary-50); padding: 6px 10px; margin: 0 -10px; border-radius: 10px;"' : '';
					var nameStyle = it.is_me ? ' style="color: var(--lm-primary)"' : '';
					var scoreStyle = it.is_me ? ' style="color: var(--lm-primary)"' : '';
					var rankNode = isTopRow && rankCls
						? '<div class="lm-lb-rank ' + rankCls + '">' + rank + '</div>'
						: '<div class="lm-lb-mini"' + (it.is_me ? ' style="background: var(--lm-primary); color: #fff;"' : '') + '>' + rank + '</div>';
					return '<div class="lm-lb-row"' + meStyle + '>' +
						rankNode +
						'<div class="lm-lb-name"' + nameStyle + '>' + name + '</div>' +
						'<div class="lm-lb-score lm-num"' + scoreStyle + '>' + fmtPts(it.xp) + ' XP</div>' +
					'</div>';
				}
				fetch('/api/leaderboard?limit=4', { credentials: 'include', cache: 'no-store' })
					.then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
					.then(function (data) {
						var items = (data && Array.isArray(data.items)) ? data.items : [];
						if (!items.length) {
							host.innerHTML = '<div class="lm-lb-row" style="opacity:.85">' +
								'<div class="lm-lb-mini">—</div>' +
								'<div class="lm-lb-name" style="color:var(--lm-muted)">Пока никто не набрал XP</div>' +
								'<div class="lm-lb-score lm-num" style="color:var(--lm-muted)">0 XP</div>' +
								'</div>';
							host.removeAttribute('data-loading');
							return;
						}
						var html = items.map(function (it) { return rowHtml(it, true); }).join('');
						var meIdx = items.findIndex(function (x) { return x && x.is_me; });
						if (meIdx < 0 && data && data.me && data.me.uid) {
							html += '<div style="border-top:1px dashed var(--lm-line, var(--line)); margin-top:6px; padding-top:8px;">' +
								rowHtml({ rank: data.me.rank, xp: data.me.xp, is_me: true, display: 'Вы' }, false) +
								'</div>';
						}
						host.innerHTML = html;
						host.removeAttribute('data-loading');
					})
					.catch(function () {
						host.innerHTML = '<div class="lm-lb-row" style="opacity:.85">' +
							'<div class="lm-lb-mini">—</div>' +
							'<div class="lm-lb-name" style="color:var(--lm-muted)">Не удалось загрузить рейтинг</div>' +
							'<div class="lm-lb-score lm-num" style="color:var(--lm-muted)">—</div>' +
							'</div>';
						host.removeAttribute('data-loading');
					});
			}

			// ── helpers (lm-*) ────────────────────────────────────────────

			function lmComputeChapterStats(allInfos) {
				let totalScore = 0, scoredCount = 0, passed = 0, totalStars = 0, totalXp = 0;
				allInfos.forEach(vi => {
					if (vi.best) {
						passed++;
						totalScore += vi.best.percent;
						scoredCount++;
						const stars = gmStarsForPercent(vi.best.percent);
						totalStars += stars;
						totalXp += gmXpForVariant(vi.best.percent);
					}
				});
				const avgScore = scoredCount ? Math.round(totalScore / scoredCount) : 0;
				return {
					totalNodes: allInfos.length,
					maxStars: allInfos.length * 3,
					passed, totalStars, totalXp, avgScore,
				};
			}

			// SVG-кривая между центрами узлов в DOM-порядке. Считаем после layout.
			function gmDrawPath(rootEl, infos) {
				const svg = rootEl.querySelector('#gm-map-path');
				const nodesWrap = rootEl.querySelector('#gm-map-nodes');
				if (!svg || !nodesWrap) return;
				const nodeEls = Array.from(nodesWrap.querySelectorAll('.gm-node'));
				if (!nodeEls.length) return;
				const wrapRect = nodesWrap.getBoundingClientRect();
				svg.setAttribute('width', wrapRect.width);
				svg.setAttribute('height', wrapRect.height);
				svg.setAttribute('viewBox', `0 0 ${wrapRect.width} ${wrapRect.height}`);
				let pathHtml = '';
				const points = nodeEls.map(el => {
					const r = el.getBoundingClientRect();
					return { x: r.left - wrapRect.left + r.width / 2, y: r.top - wrapRect.top + r.height / 2 };
				});
				for (let i = 0; i < points.length - 1; i++) {
					const p1 = points[i], p2 = points[i + 1];
					const midX = (p1.x + p2.x) / 2;
					// Контроль-точка с лёгким изгибом — ±25 по Y, чередуем направление.
					const bend = ((i % 2 === 0) ? -1 : 1) * 18;
					const ctrlX = midX, ctrlY = (p1.y + p2.y) / 2 + bend;
					const isDone = (infos[i] && infos[i].state === 'passed') && (infos[i + 1] && (infos[i + 1].state === 'passed' || infos[i + 1].state === 'current' || infos[i + 1].state === 'pending-open'));
					pathHtml += `<path d="M ${p1.x},${p1.y} Q ${ctrlX},${ctrlY} ${p2.x},${p2.y}" class="${isDone ? 'is--done' : ''}" />`;
				}
				svg.innerHTML = pathHtml;
			}

			function seededShuffle(arr, seed) {
				// mulberry32
				let t = seed >>> 0;
				function rnd() {
					t += 0x6D2B79F5;
					let r = Math.imul(t ^ (t >>> 15), 1 | t);
					r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
					return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
				}
				const a = arr.slice();
				for (let i = a.length - 1; i > 0; i--) {
					const j = Math.floor(rnd() * (i + 1));
					[a[i], a[j]] = [a[j], a[i]];
				}
				return a;
			}

			function checkAnswerStatic(q, given) {
				const correct = q.correct;
				const isEmpty = given === undefined || given === '' ||
					(Array.isArray(given) && given.filter(x => x).length === 0);
				if (isEmpty) return 'skip';
				// Нормализация ответов в свободной форме:
				// 1) trim + lowercase — учитель/ученик могут ввести «Размножение» или «РАЗМНОЖЕНИЕ»;
				// 2) запятая ↔ точка — для дробных чисел (134.6 ≡ 134,6 — на клавиатуре пользователь
				//    в зависимости от привычки может ввести любой разделитель);
				// 3) неразрывный пробел U+00A0 → обычный пробел;
				// 4) множественные пробелы → одиночный.
				const norm = (s) => String(s)
					.trim()
					.toLowerCase()
					.replace(/\u00A0/g, ' ')
					.replace(/\s+/g, ' ')
					.replace(/\./g, ',');
				if (q.type === 'input') {
					const variants = Array.isArray(correct) ? correct : [correct];
					return variants.some((v) => norm(given) === norm(v)) ? 'ok' : 'wrong';
				}
				if (Array.isArray(correct)) {
					if (q.type === 'match') {
						const g = Array.isArray(given) ? given.map(x => x || '').join(',') : '';
						return g === correct.join(',') ? 'ok' : 'wrong';
					}
					const g = (Array.isArray(given) ? [...given] : []).sort().join(',');
					const c = [...correct].sort().join(',');
					return g === c ? 'ok' : 'wrong';
				}
				return norm(given) === norm(correct) ? 'ok' : 'wrong';
			}
		</script>
