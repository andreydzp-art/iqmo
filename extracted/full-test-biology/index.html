		<style>


			/* ---- top bar ---- (стиль навбара из референса _tmp_ft6/level-map.html) */
			.topbar {
				background: transparent;
				padding: 0;
				position: relative;
				top: 0;
				z-index: 20;
			}
			.topbar__head {
				border-bottom: 0;
				padding: 16px 0 0;
			}
			.topbar__head > .container {
				background: #fff;
				border: 1px solid var(--line);
				border-radius: 16px;
				box-shadow: 0 1px 2px rgba(15,18,38,.04), 0 1px 1px rgba(15,18,38,.03);
				padding: 8px 14px;
			}
			.topbar__row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
			.topbar__right { display: flex; align-items: center; flex-shrink: 0; }
			.topbar__left { display: flex; align-items: center; gap: 12px; min-width: 0; }
			.brand { display:flex; align-items:center; gap:12px; min-width: 0; }
			.brand-mark {
				width: 30px; height: 30px; border-radius: 9px;
				background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
				position: relative; flex-shrink: 0;
				box-shadow: 0 6px 14px -4px rgba(79,70,229,.55);
			}
			.brand-mark::after {
				content:""; position:absolute; inset:6px;
				background: #fff;
				-webkit-mask:
					radial-gradient(circle at 30% 30%, #000 0 35%, transparent 36%),
					radial-gradient(circle at 70% 70%, #000 0 35%, transparent 36%);
				-webkit-mask-composite: source-over;
				        mask-composite: add;
				border-radius: 4px;
				opacity: .95;
			}
			.brand-name { font-weight: 800; letter-spacing: -.01em; font-size: 15px; color: var(--ink); }
			.brand-sep { color: var(--line); margin: 0 4px; }
			.breadcrumbs {
				color: var(--muted); font-size: 13.5px;
				overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
			}
			.breadcrumbs b { color: #2a2e4a; font-weight: 600; }
			/* Старые имена для обратной совместимости */
			.logo { font-weight: 800; font-size: 18px; letter-spacing: .02em; }
			.topbar__subject {
				font-size: 13.5px; color: var(--muted);
				overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
			}
			.topbar__subject b { color: #2a2e4a; font-weight: 600; }
			/* Pill-кнопки в шапке (без затрагивания .btn в карточках теста) */
			.topbar .btn--ghost {
				height: 36px; padding: 0 14px;
				border-radius: 999px;
				border: 1px solid var(--line);
				background: #fff;
				color: #2a2e4a;
				font-size: 13px; font-weight: 500;
			}
			.topbar .btn--ghost:hover { background: #eef0f7; border-color: var(--line); }
			.topbar .btn--ghost.is--alert { color: #b23e3e; }
			.topbar__center { display: flex; align-items: center; gap: 14px; }
			.timer {
				display: inline-flex; align-items: center; gap: 8px;
				background: var(--accent-weak); color: var(--accent);
				padding: 8px 14px; border-radius: 999px;
				font-weight: 700; font-size: 14px;
				font-variant-numeric: tabular-nums;
			}
			.timer.is--warning { background: #fbf0d9; color: #c28216; }
			.timer.is--danger { background: #fbe2e2; color: #b23e3e; }
			.timer__dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
			@keyframes pulse { 50% { opacity: .35; transform: scale(.85); } }

			.btn {
				display: inline-flex; align-items: center; justify-content: center;
				gap: 8px; font-weight: 600; font-size: 14px;
				padding: 10px 18px; border-radius: 999px;
				border: 1.5px solid transparent; cursor: pointer;
				transition: background .15s, color .15s, border-color .15s, transform .08s;
				white-space: nowrap;
			}
			[hidden] { display: none !important; }
			.btn:active { transform: translateY(1px); }
			.btn--primary { background: linear-gradient(180deg, #44c77d, #2fa965); color: #fff; box-shadow: 0 8px 20px -8px rgba(62,195,122,.55); }
			.btn--primary:hover { filter: brightness(1.05); }
			.btn--ghost { background: #fff; border-color: var(--line); color: var(--ink); }
			.btn--ghost:hover { border-color: var(--ink); }
			.btn--dark { background: var(--dark); color: #fff; }
			.btn--dark:hover { background: #111520; }
			.btn--blue { background: var(--accent); color: #fff; }
			.btn--blue:hover { background: #3e64b6; }
			.btn[disabled] { opacity: .4; cursor: not-allowed; }

			/* ---- progress bar ---- */
			.progressbar {
				height: 3px;
				background: var(--line);
				overflow: hidden;
				margin-top: 0;
			}
			.progressbar__fill {
				height: 100%; background: linear-gradient(90deg, var(--accent), var(--green));
				transition: width .3s ease; width: 0%;
			}

			/* ---- layout ---- */
			.page__main { flex: 1 0 auto; padding: 24px 0 48px; }
			.grid {
				display: grid;
				grid-template-columns: minmax(0, 240px) minmax(0, 1fr);
				gap: 24px;
				align-items: start;
			}
			.grid__aside { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 16px; }

			/* ---- nav tasks ---- */
			.nav-tasks { padding: 18px; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); }
			.nav-tasks__head {
				display: flex; align-items: center; justify-content: space-between;
				margin-bottom: 14px;
			}
			.nav-tasks__title { font-size: 14px; font-weight: 700; }
			.nav-tasks__counter { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
			.nav-tasks__grid {
				display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
			}
			.nav-task {
				aspect-ratio: 1 / 1;
				border-radius: 9px;
				background: #eef1f6; color: var(--ink-2);
				font-weight: 700; font-size: 13px;
				display: inline-flex; align-items: center; justify-content: center;
				cursor: pointer;
				transition: background .15s, color .15s, box-shadow .15s;
				font-variant-numeric: tabular-nums;
				position: relative;
				border: 1.5px solid transparent;
			}
			.nav-task:hover { background: #e2e7f0; }
			.nav-task.is--answered { background: #e7f6ec; color: #2fa968; }
			.nav-task.is--flagged::after {
				content: ""; position: absolute; top: 3px; right: 3px;
				width: 6px; height: 6px; border-radius: 50%; background: var(--amber);
			}
			.nav-task.is--current { border-color: var(--accent); background: var(--accent); color: #fff; box-shadow: 0 4px 10px -2px rgba(79,123,214,.5); }

			.nav-legend { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
			.nav-legend__row { display: flex; align-items: center; gap: 8px; }
			.nav-legend__dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }

			.quit {
				background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
				padding: 16px; display: flex; flex-direction: column; gap: 10px;
			}
			.quit__hint { font-size: 12px; color: var(--muted); line-height: 1.5; }

			/* ---- question card ---- */
			.q-card {
				background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
				padding: 28px 32px; display: flex; flex-direction: column; gap: 22px;
				min-height: 520px;
			}
			.q-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
			.q-head__left { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
			.q-tag {
				display: inline-flex; align-items: center; gap: 8px;
				font-size: 12px; font-weight: 700; letter-spacing: .06em;
				text-transform: uppercase; color: var(--muted);
			}
			.q-tag b { color: var(--accent); font-weight: 700; }
			.q-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
			.q-flag {
				display: inline-flex; align-items: center; gap: 6px;
				font-size: 13px; color: var(--muted); font-weight: 600;
				padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
				background: #fff; cursor: pointer;
				transition: border-color .15s, color .15s, background .15s;
			}
			.q-flag:hover { border-color: var(--amber); color: var(--amber); }
			.q-flag.is--on { background: #fbf0d9; color: #c28216; border-color: #f0d59a; }

			.q-body { font-size: 16px; color: var(--ink); line-height: 1.65; }
			.q-body p { margin: 0 0 10px; }
			.q-body p:last-child { margin-bottom: 0; }
			.q-body b, .q-body strong { font-weight: 700; }
			.q-body .chem { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; }
			.q-body sub { font-size: 0.75em; }
			.q-body sup { font-size: 0.75em; }
			/* Картинки внутри тела вопроса. По умолчанию иллюстрации идут в
			   натуральных пикселях (≈1000×1000) и на десктопе занимают
			   половину экрана, оттесняя варианты ответа вниз. Держим их
			   в компактной центрированной рамке (≤ 380 px по ширине,
			   ≤ 360 px по высоте) — этого хватает для схем, графиков и
			   фотографий. Для модификатора .q-figure--wide (широкие графики
			   с длинными осями) лимит выше. Распространяется на ВСЕ задания
			   биологии — и на текущие, и на будущие. */
			.q-body .q-figure {
				margin: 12px auto 14px;
				max-width: min(100%, 380px);
				width: 100%;
			}
			.q-body .q-figure--wide { max-width: min(100%, 520px); }
			.q-body .q-figure__img,
			.q-body img {
				display: block;
				width: 100%;
				max-width: 100%;
				max-height: 360px;
				height: auto;
				object-fit: contain;
				border-radius: 10px;
				box-shadow: 0 6px 18px -12px rgba(20, 28, 44, 0.25);
			}

			/* options */
			.options { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
			.option {
				display: flex; align-items: flex-start; gap: 12px;
				padding: 12px 14px;
				border: 1.5px solid var(--line); border-radius: 12px;
				background: #fff; cursor: pointer;
				transition: border-color .15s, background .15s;
				font-size: 15px; color: var(--ink); line-height: 1.5;
			}
			.option:hover { border-color: #c7cfdc; }
			.option__marker {
				width: 22px; height: 22px; border-radius: 6px;
				background: #eef1f6; color: var(--ink-2);
				display: inline-flex; align-items: center; justify-content: center;
				font-weight: 700; font-size: 13px; flex: 0 0 auto;
				transition: background .15s, color .15s;
			}
			.option.is--checked { border-color: var(--accent); background: var(--accent-weak); }
			.option.is--checked .option__marker { background: var(--accent); color: #fff; }
			.option input { display: none; }
			.option__label { min-width: 0; }

			.hint {
				font-size: 13px; color: var(--muted);
				padding: 10px 14px; background: #f3f5f8; border-radius: 10px;
				display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
			}
			.hint svg { flex: 0 0 auto; color: var(--accent); }

			/* answer input */
			.answer-input {
				display: flex; align-items: center; gap: 12px;
				padding: 10px; border: 1.5px solid var(--line); border-radius: 12px;
				background: #fff; max-width: 400px;
			}
			.answer-input:focus-within { border-color: var(--accent); background: var(--accent-weak); }
			.answer-input label { font-size: 13px; font-weight: 600; color: var(--muted); padding-left: 6px; }
			.answer-input input {
				flex: 1; border: 0; outline: 0; background: transparent;
				font-family: 'JetBrains Mono', monospace; font-size: 16px;
				font-weight: 600; color: var(--ink); padding: 6px 8px;
			}

			/* match table */
			.match {
				display: grid; grid-template-columns: 1fr 120px;
				gap: 10px 16px; max-width: 480px; margin-top: 6px;
			}
			.match__left { font-size: 15px; color: var(--ink); padding-top: 8px; }
			.match__left b { color: var(--accent); margin-right: 6px; }
			.match__select {
				width: 100%; padding: 8px 10px;
				border: 1.5px solid var(--line); border-radius: 10px;
				font-family: inherit; font-size: 14px; font-weight: 600;
				background: #fff; color: var(--ink); cursor: pointer;
			}
			.match__select:focus { outline: 0; border-color: var(--accent); }

			/* open answer */
			.open-answer {
				padding: 14px 16px; border-radius: 12px;
				background: #f3f5f8; border: 1px dashed #c7cfdc;
				font-size: 13px; color: var(--muted); line-height: 1.55;
			}
			.open-answer b { color: var(--ink); font-weight: 700; }

			/* footer nav */
			.q-foot {
				margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line);
				display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
			}
			.q-foot__left, .q-foot__right { display: flex; gap: 10px; align-items: center; }

			/* result page */
			.result-wrap { max-width: 720px; margin: 0 auto; }
			.result-card {
				background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
				padding: 40px 32px; text-align: center;
			}
			.result-score {
				font-size: 64px; font-weight: 800; letter-spacing: -0.02em;
				line-height: 1;
				background: linear-gradient(180deg, var(--accent), #3e64b6);
				-webkit-background-clip: text; background-clip: text; color: transparent;
				margin-bottom: 4px;
			}
			.result-max { color: var(--muted); font-size: 18px; font-weight: 600; }
			.result-grade {
				display: inline-block; margin-top: 16px;
				padding: 8px 20px; border-radius: 999px;
				background: var(--accent-weak); color: var(--accent);
				font-weight: 700;
			}
			.result-breakdown {
				margin-top: 28px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
			}
			.rb-item {
				padding: 14px; border-radius: 12px; background: #f3f5f8;
			}
			.rb-num { font-size: 22px; font-weight: 800; color: var(--ink); }
			.rb-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
			.result-hint { margin-top: 20px; font-size: 13px; color: var(--muted); text-align: left; }

			/* ---- review page ---- */
			.review-head {
				background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
				box-shadow: var(--shadow);
				padding: 22px 24px; margin-bottom: 18px;
				display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
			}
			.review-head__score { display: flex; align-items: baseline; gap: 10px; }
			.review-head__score b { font-size: 36px; font-weight: 800; color: var(--ink); }
			.review-head__score span { font-size: 16px; color: var(--muted); }
			.review-head__meta { font-size: 14px; color: var(--muted); }
			.review-head__meta b { color: var(--ink); }
			.review-filter { display: flex; gap: 8px; }
			.review-filter button {
				padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
				background: #fff; font-size: 13px; font-weight: 600; color: var(--ink-2);
			}
			.review-filter button.is--on { background: var(--ink); color: #fff; border-color: var(--ink); }
			.review-actions { display: flex; gap: 10px; flex-wrap: wrap; }

			.review-list { display: flex; flex-direction: column; gap: 14px; }
			.review-item {
				background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line);
				border-radius: var(--radius); box-shadow: var(--shadow);
				padding: 22px 24px;
			}
			.review-item.is--ok     { border-left-color: var(--green); }
			.review-item.is--wrong  { border-left-color: var(--red); }
			.review-item.is--skip   { border-left-color: var(--muted); }
			.review-item__head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
			.review-item__num {
				display: inline-flex; align-items: center; justify-content: center;
				width: 28px; height: 28px; border-radius: 8px;
				background: #eef1f6; color: var(--ink); font-weight: 700; font-size: 14px;
			}
			.review-item__title { font-size: 16px; font-weight: 700; color: var(--ink); }
			.review-item__badge {
				margin-left: auto; font-size: 12px; font-weight: 600;
				padding: 4px 10px; border-radius: 999px;
			}
			.review-item.is--ok    .review-item__badge { background: #e7f6ec; color: #2a8f52; }
			.review-item.is--wrong .review-item__badge { background: #fbe8e8; color: #b04545; }
			.review-item.is--skip  .review-item__badge { background: #eef1f6; color: var(--muted); }
			.review-item__body { font-size: 15px; line-height: 1.55; color: var(--ink-2); margin-bottom: 12px; }
			.review-item__body p { margin: 0 0 8px; }
			/* В разборе нет обёртки .q-body, поэтому собственных ограничений у фигур нет
			   и они рендерятся в натуральных пикселях (~1000×1000). В режиме «прочитать
			   и понять ошибку» иллюстрация — вспомогательная: держим её в компактной
			   рамке слева, чтобы текст разбора был основным фокусом. */
			.review-item__body .q-figure {
				margin: 10px 0 12px;
				max-width: min(100%, 240px);
				width: 100%;
			}
			.review-item__body .q-figure--wide { max-width: min(100%, 360px); }
			.review-item__body .q-figure__img,
			.review-item__body img {
				display: block; width: 100%; max-width: 100%; height: auto;
				border-radius: 10px;
				box-shadow: 0 6px 18px -12px rgba(20, 28, 44, 0.25);
			}

			.review-answers { display: grid; gap: 10px; margin: 10px 0 14px; }
			.review-answer {
				display: grid; grid-template-columns: 140px 1fr; gap: 12px;
				padding: 10px 14px; border-radius: 10px; background: #f7f9fc; font-size: 14px;
			}
			.review-answer__label { color: var(--muted); font-weight: 600; }
			.review-answer__value { color: var(--ink); font-weight: 600; }
			.review-answer.is--correct { background: #eef8f1; }
			.review-answer.is--correct .review-answer__value { color: #2a8f52; }
			.review-answer.is--wrong { background: #fdf0f0; }
			.review-answer.is--wrong .review-answer__value { color: #b04545; }
			.review-answer.is--muted .review-answer__value { color: var(--muted); font-style: italic; font-weight: 500; }

			.review-hint {
				display: flex; gap: 10px; align-items: flex-start;
				background: #eef4fe; color: #2b4a86; border-radius: 10px;
				padding: 12px 14px; font-size: 14px; line-height: 1.55;
			}
			.review-hint svg { flex-shrink: 0; margin-top: 3px; }
			.review-hint b { color: #1f3d76; }

			/* ---- written question (Part 2) ---- */
			.written-area {
				display: flex; flex-direction: column; gap: 10px; margin-top: 18px;
			}
			.written-area textarea {
				width: 100%; min-height: 200px; resize: vertical;
				font: 14px/1.5 'JetBrains Mono', Menlo, monospace;
				padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px;
				background: #fafbfd; color: var(--ink); transition: border-color .15s;
			}
			.written-area textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
			.written-note {
				display: flex; gap: 10px; align-items: flex-start;
				background: #fff8ea; color: #8a5a1c; border-radius: 10px;
				padding: 10px 14px; font-size: 13px; line-height: 1.5;
				border-left: 3px solid var(--amber);
			}
			.part-banner {
				display: inline-flex; align-items: center; gap: 6px;
				background: #fdecd6; color: #8a5a1c;
				font-size: 11px; font-weight: 700; text-transform: uppercase;
				letter-spacing: .06em; padding: 4px 10px; border-radius: 999px;
				margin-right: 8px;
			}

			/* nav dot for written tasks */
			.nav-task.is--written::after {
				content: ''; position: absolute; right: 4px; top: 4px;
				width: 5px; height: 5px; border-radius: 50%; background: var(--amber);
			}

			/* result — parts breakdown */
			.result-parts {
				display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
				margin: 20px 0 12px; text-align: left;
			}
			.result-part {
				border: 1.5px solid var(--line); border-radius: 14px;
				padding: 16px 18px; background: #fbfcfe;
			}
			.result-part__label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
			.result-part__score {
				font-size: 28px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums;
				display: flex; align-items: baseline; gap: 6px;
			}
			.result-part__score small { font-size: 15px; color: var(--muted); font-weight: 600; }
			.result-part__meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
			.result-part.is--selfcheck { background: #fff8ea; border-color: #f3d592; }
			.result-part.is--selfcheck .result-part__label { color: #8a5a1c; }

			/* self-check card in review */
			.sc-card { border-color: #f3d592 !important; }
			.sc-your-answer {
				background: #f7f8fb; border-radius: 10px; padding: 12px 14px;
				font-family: 'JetBrains Mono', Menlo, monospace; font-size: 13px;
				white-space: pre-wrap; color: var(--ink-2); margin-top: 10px;
				border: 1px solid var(--line);
			}
			.sc-your-answer.is--empty { font-style: italic; color: var(--muted); font-family: inherit; }
			.sc-solution {
				background: #eef4fe; border-radius: 10px; padding: 14px 16px;
				font-size: 14px; line-height: 1.6; color: #1f3d76; margin-top: 12px;
				border-left: 3px solid var(--accent);
			}
			.sc-solution b { color: #1a325e; }
			.sc-solution p { margin: 0; }
			.sc-solution p + p, .sc-solution p + ol, .sc-solution ol + p { margin-top: 8px; }
			.sc-criteria {
				margin-top: 14px; display: flex; flex-direction: column; gap: 8px;
			}
			.sc-criteria__title {
				font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
				color: var(--muted); margin-bottom: 2px;
			}
			.sc-criterion {
				display: flex; gap: 10px; align-items: flex-start;
				padding: 10px 12px; background: #fff; border: 1.5px solid var(--line);
				border-radius: 10px; cursor: pointer; transition: .12s;
			}
			.sc-criterion:hover { border-color: var(--accent); }
			.sc-criterion.is--checked { background: #eef8f1; border-color: #bfe3cd; }
			.sc-criterion input { margin: 2px 0 0; accent-color: var(--green); flex-shrink: 0; }
			.sc-criterion__body { flex: 1; font-size: 14px; color: var(--ink-2); }
			.sc-criterion__pts {
				font-size: 11px; font-weight: 700; color: var(--green);
				background: #e7f6ec; padding: 2px 8px; border-radius: 999px; flex-shrink: 0;
			}
			.sc-total {
				margin-top: 8px; padding: 10px 14px; background: #f7f8fb;
				border-radius: 10px; display: flex; justify-content: space-between;
				align-items: center; font-size: 14px;
			}
			.sc-total b { font-size: 17px; font-variant-numeric: tabular-nums; color: var(--ink); }
			.sc-note {
				margin-top: 28px; padding: 14px 18px; background: #fafbfd;
				border: 1.5px dashed var(--line); border-radius: 12px;
				font-size: 13px; color: var(--muted); text-align: center;
			}

			@media (max-width: 600px) {
				.result-parts { grid-template-columns: 1fr; }
			}

			@media (max-width: 600px) {
				.review-head { padding: 18px; }
				.review-answer { grid-template-columns: 1fr; gap: 4px; padding: 10px 12px; }
			}

			/* ---- responsive ---- */
			@media (max-width: 1024px) {
				.grid { grid-template-columns: 1fr; }
				.grid__aside { position: static; flex-direction: row; flex-wrap: wrap; }
				.nav-tasks, .quit { flex: 1 1 280px; }
				.nav-tasks__grid { grid-template-columns: repeat(10, 1fr); }
				.q-card { padding: 22px 20px; }
			}
			/* ---- variant picker ---- */
			.vp-hero {
				padding: 36px 0 10px;
				display: flex; align-items: flex-end; justify-content: space-between;
				gap: 24px; flex-wrap: wrap;
			}
			.vp-hero__title { font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
			.vp-hero__sub { color: var(--muted); font-size: 14px; margin-top: 6px; max-width: 540px; }
			.vp-stats { display: flex; gap: 22px; font-size: 13px; color: var(--muted); }
			.vp-stats b { display: block; color: var(--ink); font-size: 20px; font-weight: 800; line-height: 1.1; margin-bottom: 2px; font-variant-numeric: tabular-nums; }

			.vp-section-title {
				margin: 28px 0 8px;
				font-size: 13px; font-weight: 700; color: var(--muted);
				text-transform: uppercase; letter-spacing: .06em;
			}
			.vp-section-hint {
				font-size: 13px; color: var(--muted);
				line-height: 1.5;
				max-width: 560px;
				margin: 0 0 16px;
			}

			.vp-grid {
				display: grid; gap: 12px;
				grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
				padding-bottom: 48px;
			}
			/* Два ближайших варианта: не грузим сеткой на десятки карточек */
			.vp-grid--pair {
				grid-template-columns: repeat(2, minmax(0, 1fr));
				max-width: 520px;
			}
			.vp-grid--pair.vp-grid--single {
				grid-template-columns: 1fr;
				max-width: 280px;
			}
			.vp-tile {
				position: relative;
				background: var(--card); border: 1.5px solid var(--line);
				border-radius: 14px; padding: 14px 14px 12px;
				display: flex; flex-direction: column; gap: 6px;
				min-height: 108px;
				transition: border-color .15s, transform .08s, box-shadow .15s;
				cursor: pointer; text-align: left; font-family: inherit;
			}
			.vp-tile:hover { border-color: var(--accent); box-shadow: 0 6px 18px -10px rgba(79,123,214,.4); }
			.vp-tile:active { transform: translateY(1px); }
			.vp-tile__num { font-size: 26px; font-weight: 800; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
			.vp-tile__label { font-size: 12px; color: var(--muted); font-weight: 600; }
			.vp-tile__badge {
				position: absolute; top: 10px; right: 10px;
				font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
				padding: 3px 7px; border-radius: 999px;
				background: #e7f6ec; color: #1f8a4c;
			}
			.vp-tile__status {
				margin-top: auto; font-size: 12px; color: var(--muted);
				display: flex; align-items: center; gap: 6px;
			}
			.vp-tile__dot { width: 6px; height: 6px; border-radius: 50%; background: #c9cfda; }

			/* passed variant */
			.vp-tile.is--passed .vp-tile__dot { background: var(--green); }
			.vp-tile.is--passed .vp-tile__score { color: var(--green); font-weight: 700; }
			/* in progress */
			.vp-tile.is--progress .vp-tile__dot { background: var(--amber); }
			/* coming soon */
			.vp-tile.is--coming {
				opacity: .55; cursor: not-allowed; background: #f7f8fb;
			}
			.vp-tile.is--coming:hover { border-color: var(--line); box-shadow: none; }

			/* locked (not yet unlocked in linear progression) */
			.vp-tile.is--locked {
				cursor: not-allowed;
				background: linear-gradient(180deg, #fff2f2 0%, #fde7e7 100%);
				color: #a94d4d;
			}
			.vp-tile.is--locked .vp-tile__num { color: #c25555; }
			.vp-tile.is--locked .vp-tile__label { color: #b35959; }
			.vp-tile.is--locked .vp-tile__status { color: #b35959; }
			.vp-tile.is--locked:hover { border-color: #e88a8a; box-shadow: 0 6px 18px -10px rgba(214,90,90,.4); }
			.vp-tile__lock {
				position: absolute; top: 10px; right: 10px;
				width: 22px; height: 22px; border-radius: 50%;
				background: #e6e9ef; color: var(--muted);
				display: flex; align-items: center; justify-content: center;
				font-size: 12px;
			}
			.vp-tile__lock svg {
				width: 12px;
				height: 12px;
				display: block;
			}
			/* как в макете: белый замок на сплошном красном кружке */
			.vp-tile.is--locked .vp-tile__lock {
				width: 24px;
				height: 24px;
				background: var(--red);
				color: #fff;
				border: none;
				box-shadow: 0 2px 6px rgba(214, 90, 90, 0.45);
			}
			.vp-tile.is--locked .vp-tile__lock svg {
				width: 13px;
				height: 13px;
				stroke: #fff;
			}

			/* cooldown */
			.vp-tile.is--cooldown {
				opacity: .7; cursor: not-allowed; background: #fdf4e7;
				border-color: #f2cf8e;
			}
			.vp-tile.is--cooldown:hover { border-color: #f2cf8e; box-shadow: none; }
			.vp-tile.is--cooldown .vp-tile__dot { background: var(--amber); }

			/* dev / все открытые варианты (pending-open) — раньше без класса, стили не применялись */
			.vp-tile.is--pending-open {
				background: linear-gradient(180deg, #f7f9ff 0%, #eef3fc 100%);
				border-color: #c8d4ee;
			}
			.vp-tile.is--pending-open:hover { border-color: var(--accent); }

			/* current (next unlocked task) */
			.vp-tile.is--current {
				border-color: var(--accent);
				box-shadow: 0 0 0 3px rgba(79,123,214,.14);
				animation: vpPulse 2.4s ease-in-out infinite;
			}
			@keyframes vpPulse {
				0%, 100% { box-shadow: 0 0 0 3px rgba(79,123,214,.14); }
				50%      { box-shadow: 0 0 0 6px rgba(79,123,214,.08); }
			}

			/* streak banner */
			.vp-streak {
				display: inline-flex; align-items: center; gap: 10px;
				padding: 10px 14px;
				background: linear-gradient(135deg, #fff4e0 0%, #ffe8c7 100%);
				border: 1px solid #f2cf8e;
				border-radius: 12px;
				font-size: 13px; color: #7a5418; font-weight: 600;
				margin-top: 14px;
			}
			.vp-streak__flame { font-size: 18px; }
			.vp-streak b { color: #8a5a1c; font-size: 15px; }

			.vp-back {
				display: inline-flex; align-items: center; gap: 6px;
				font-size: 13px; color: var(--muted); margin-top: 4px;
			}
			.vp-back:hover { color: var(--ink); }

			@media (max-width: 600px) {
				.vp-grid:not(.vp-grid--pair) { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
				.vp-grid--pair { grid-template-columns: 1fr; max-width: none; }
			}

			@media (max-width: 600px) {
				.topbar__subject { display: none; }
				.brand-sep, .breadcrumbs { display: none; }
				.q-title { font-size: 19px; }
				.nav-tasks__grid { grid-template-columns: repeat(8, 1fr); }
				.result-breakdown { grid-template-columns: 1fr; }
				.q-card { padding: 20px 16px; }
			}

			/* ============================================================
			   GAMIFICATION — level map / stars / XP / level / boss
			   prefix: .gm-*
			   ============================================================ */
			:root {
				--gm-primary:   #4f46e5;
				--gm-primary-2: #6366f1;
				--gm-primary-50:#eef0ff;
				--gm-violet:    #7c3aed;
				--gm-violet-2:  #a855f7;
				--gm-violet-50: #f3eeff;
				--gm-emerald:   #10b981;
				--gm-emerald-2: #34d399;
				--gm-emerald-50:#e7faf2;
				--gm-amber:     #f59e0b;
				--gm-rose:      #f43f5e;
				--gm-shadow-glow: 0 0 0 6px rgba(79,70,229,.10), 0 0 0 14px rgba(79,70,229,.06), 0 18px 36px -10px rgba(79,70,229,.45);
				--gm-shadow-boss: 0 0 0 6px rgba(124,58,237,.12), 0 18px 36px -8px rgba(124,58,237,.45);
				--gm-shadow-card: 0 1px 2px rgba(15,18,38,.04), 0 8px 24px rgba(15,18,38,.06);
			}

			/* ---- top hero with stat cluster ---- */
			.gm-hero {
				display: flex; align-items: stretch; justify-content: space-between;
				gap: 24px; flex-wrap: wrap;
				padding: 28px 0 8px;
			}
			.gm-hero__left { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1 1 360px; }
			.gm-hero__title {
				font-size: 30px; font-weight: 800; letter-spacing: -.01em;
				display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
			}
			.gm-hero__sub { color: var(--muted); font-size: 14px; max-width: 540px; }
			.gm-hero__back { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
			.gm-hero__back:hover { color: var(--ink); }

			.gm-stat-cluster {
				display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
				gap: 0; min-width: 540px;
				background: #fff; border: 1px solid var(--line); border-radius: 16px;
				box-shadow: var(--gm-shadow-card);
				overflow: hidden;
				flex-shrink: 0;
			}
			.gm-stat {
				padding: 14px 18px; display: flex; flex-direction: column; gap: 2px;
				border-right: 1px solid var(--line);
				white-space: nowrap;
			}
			.gm-stat:last-child { border-right: 0; }
			.gm-stat__label {
				font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
				color: var(--muted); display: flex; align-items: center; gap: 6px;
			}
			.gm-stat__val {
				font-family: 'JetBrains Mono', ui-monospace, monospace;
				font-variant-numeric: tabular-nums;
				font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1.1;
			}
			.gm-stat__val--gradient {
				background: linear-gradient(135deg, var(--gm-primary), var(--gm-violet));
				-webkit-background-clip: text; background-clip: text; color: transparent;
			}
			.gm-stat__sub { font-size: 11px; color: var(--muted); font-weight: 600; }

			@media (max-width: 720px) {
				.gm-stat-cluster { min-width: 0; width: 100%; grid-template-columns: repeat(2, 1fr); }
				.gm-stat { border-right: 0; border-bottom: 1px solid var(--line); }
				.gm-stat:nth-child(2), .gm-stat:nth-child(4) { border-right: 0; }
				.gm-stat:nth-child(3), .gm-stat:nth-child(4) { border-bottom: 0; }
				.gm-stat:nth-child(odd) { border-right: 1px solid var(--line); }
			}

			/* ---- level map roadmap ---- */
			.gm-map-section {
				margin-top: 24px;
				background: #fff;
				border: 1px solid var(--line);
				border-radius: 22px;
				padding: 24px 24px 32px;
				box-shadow: var(--gm-shadow-card);
				position: relative;
				overflow: hidden;
			}
			.gm-map-section__head {
				display: flex; align-items: baseline; justify-content: space-between;
				gap: 16px; flex-wrap: wrap; margin-bottom: 18px;
			}
			.gm-map-section__title { font-size: 18px; font-weight: 800; letter-spacing: -.005em; }
			.gm-map-section__hint { font-size: 13px; color: var(--muted); max-width: 520px; }

			.gm-map {
				position: relative;
				min-height: 220px;
				padding: 14px 8px 20px;
			}
			.gm-map__path {
				position: absolute; inset: 0;
				width: 100%; height: 100%;
				pointer-events: none;
				z-index: 0;
			}
			.gm-map__path path { fill: none; stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
			.gm-map__path path.is--done { stroke: var(--gm-emerald); }

			.gm-map__nodes {
				position: relative;
				display: grid;
				grid-template-columns: repeat(var(--gm-cols, 6), 1fr);
				gap: 18px 6px;
				z-index: 1;
				justify-items: center;
			}

			/* ---- node (variant) ---- */
			.gm-node {
				position: relative;
				width: 78px; height: 78px;
				border-radius: 50%;
				border: 0; padding: 0;
				display: inline-flex; align-items: center; justify-content: center;
				font-family: 'JetBrains Mono', ui-monospace, monospace;
				font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums;
				cursor: pointer; transition: transform .12s ease, box-shadow .2s ease;
				background: #fff; color: var(--ink);
				border: 2px solid var(--line);
			}
			.gm-node:hover { transform: translateY(-2px); }
			.gm-node:active { transform: translateY(0); }

			.gm-node__cap {
				position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
				font-family: 'Manrope', sans-serif;
				font-size: 11px; font-weight: 700; color: var(--muted);
				white-space: nowrap; letter-spacing: .02em;
			}
			.gm-node__cap--status {
				display: block; margin-top: 2px; font-size: 10px; font-weight: 600; color: var(--muted);
				text-transform: uppercase; letter-spacing: .04em;
			}
			.gm-node__check, .gm-node__lock {
				position: absolute; top: -6px; right: -6px;
				width: 24px; height: 24px; border-radius: 50%;
				display: flex; align-items: center; justify-content: center;
				font-size: 13px; color: #fff; box-shadow: 0 4px 8px rgba(0,0,0,.12);
			}
			.gm-node__check { background: var(--gm-emerald); }
			.gm-node__lock { background: #c9cdda; color: #fff; width: 22px; height: 22px; }
			.gm-node__lock svg { width: 12px; height: 12px; }
			.gm-node__stars {
				position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
				display: flex; gap: 2px; font-size: 13px; line-height: 1;
				color: var(--gm-amber);
			}
			.gm-node__stars span { filter: drop-shadow(0 1px 1px rgba(245,158,11,.35)); }
			.gm-node__stars span.is--off { color: #d9dde9; filter: none; }

			/* ---- node states ---- */
			.gm-node.is--done {
				background: var(--gm-emerald-50);
				border-color: var(--gm-emerald-2);
				color: var(--gm-emerald);
			}
			.gm-node.is--done .gm-node__cap { color: var(--gm-emerald); font-weight: 700; }

			.gm-node.is--current {
				background: linear-gradient(180deg, var(--gm-primary), var(--gm-primary-2));
				border-color: transparent;
				color: #fff;
				box-shadow: var(--gm-shadow-glow);
				animation: gmPulse 2.4s ease-in-out infinite;
			}
			.gm-node.is--current .gm-node__cap { color: var(--gm-primary); font-weight: 800; }
			.gm-node.is--current .gm-node__cap--status { color: var(--gm-primary); }

			.gm-node.is--cooldown {
				background: #fff7eb;
				border-color: #f3d592;
				color: #8a5a1c;
				cursor: not-allowed;
			}
			.gm-node.is--cooldown .gm-node__cap { color: #8a5a1c; }

			.gm-node.is--locked {
				background: #f5f6fa;
				border-color: #e3e6f0;
				color: #b9bdcc;
				cursor: not-allowed;
			}
			.gm-node.is--locked:hover { transform: none; }

			.gm-node.is--coming {
				background: #fafbfd;
				border-color: #eaecf3;
				border-style: dashed;
				color: #c4c8d6;
				cursor: not-allowed;
			}
			.gm-node.is--coming:hover { transform: none; }

			/* boss node — final */
			.gm-node.is--boss {
				width: 96px; height: 96px;
				background: linear-gradient(135deg, var(--gm-violet), var(--gm-violet-2));
				border: 0;
				color: #fff;
				font-size: 36px;
				box-shadow: var(--gm-shadow-boss);
				position: relative;
			}
			.gm-node.is--boss::before {
				content: '';
				position: absolute; inset: -6px;
				border-radius: 50%;
				background: conic-gradient(from 0deg, transparent, rgba(168,85,247,.4), transparent 30%);
				z-index: -1;
				animation: gmSpin 8s linear infinite;
			}
			.gm-node.is--boss.is--locked {
				background: #f5f6fa;
				color: #b9bdcc;
				box-shadow: none;
			}
			.gm-node.is--boss.is--locked::before { display: none; }
			.gm-node.is--boss.is--done {
				background: linear-gradient(135deg, var(--gm-emerald), var(--gm-emerald-2));
				color: #fff;
			}

			/* trophy/lightning icon for boss — using emoji-fallback through ::after when text is "Б" */
			.gm-node.is--boss .gm-node__cap { color: var(--gm-violet); font-weight: 800; }
			.gm-node.is--boss.is--done .gm-node__cap { color: var(--gm-emerald); }

			.gm-node__danger-badge {
				position: absolute; top: -10px; left: -10px;
				background: var(--gm-rose); color: #fff;
				font-family: 'Manrope', sans-serif;
				font-size: 9px; font-weight: 800; letter-spacing: .04em;
				padding: 3px 7px; border-radius: 999px;
				box-shadow: 0 4px 10px -2px rgba(244,63,94,.45);
				white-space: nowrap;
				transform: rotate(-6deg);
			}

			/* ---- responsive grid columns ---- */
			@media (max-width: 1100px) {
				.gm-map__nodes { grid-template-columns: repeat(min(var(--gm-cols, 6), 5), 1fr); gap: 36px 6px; }
			}
			@media (max-width: 720px) {
				.gm-map__nodes { grid-template-columns: repeat(min(var(--gm-cols, 6), 4), 1fr); gap: 36px 6px; }
				.gm-node { width: 64px; height: 64px; font-size: 22px; }
				.gm-node.is--boss { width: 78px; height: 78px; font-size: 28px; }
				.gm-map__path { display: none; } /* кривая на мелком экране ломается; узлы и так очевидны */
			}
			@media (max-width: 480px) {
				.gm-map__nodes { grid-template-columns: repeat(3, 1fr); }
			}

			/* ---- animations ---- */
			@keyframes gmPulse {
				0%, 100% { box-shadow: 0 0 0 6px rgba(79,70,229,.10), 0 0 0 14px rgba(79,70,229,.06), 0 18px 36px -10px rgba(79,70,229,.45); }
				50%      { box-shadow: 0 0 0 9px rgba(79,70,229,.16), 0 0 0 22px rgba(79,70,229,.10), 0 22px 40px -10px rgba(79,70,229,.55); }
			}
			@keyframes gmSpin { to { transform: rotate(360deg); } }
			@keyframes gmFreshPop {
				0%   { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
				40%  { box-shadow: 0 0 0 12px rgba(16,185,129,.25), 0 0 0 22px rgba(16,185,129,.10); }
				100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
			}
			.gm-node.is--fresh { animation: gmFreshPop 2.4s ease-out 1; }

			@media (prefers-reduced-motion: reduce) {
				.gm-node.is--current, .gm-node.is--boss::before, .gm-node.is--fresh { animation: none !important; }
			}

			/* ---- companion (Sputnik) — fixed bottom-right during test ---- */
			.gm-companion {
				position: fixed; right: 20px; bottom: 20px;
				display: flex; align-items: flex-end; gap: 10px;
				z-index: 30;
				max-width: min(360px, calc(100% - 40px));
				pointer-events: none;
			}
			.gm-companion__bubble {
				background: #fff;
				border: 1.5px solid var(--line);
				border-radius: 16px 16px 16px 4px;
				padding: 10px 14px;
				box-shadow: 0 8px 24px -8px rgba(15,18,38,.18);
				font-size: 13px; line-height: 1.45; color: var(--ink-2);
				font-weight: 500;
				max-width: 280px;
				transform: translateX(20px);
				opacity: 0;
				transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s;
				pointer-events: auto;
			}
			.gm-companion__bubble.is--shown { transform: translateX(0); opacity: 1; }
			.gm-companion__bubble b { color: var(--gm-primary); }
			.gm-companion__avatar {
				width: 56px; height: 56px;
				border-radius: 50%;
				background: linear-gradient(135deg, var(--gm-primary), var(--gm-violet));
				display: flex; align-items: center; justify-content: center;
				font-size: 28px;
				color: #fff;
				box-shadow: 0 8px 18px -6px rgba(79,70,229,.45);
				flex-shrink: 0;
				cursor: pointer;
				pointer-events: auto;
				transition: transform .15s;
			}
			.gm-companion__avatar:hover { transform: scale(1.06); }
			.gm-companion__close {
				position: absolute; top: 4px; right: 6px;
				background: none; border: 0; padding: 2px 6px;
				font-size: 14px; color: var(--muted); cursor: pointer;
				line-height: 1;
			}
			.gm-companion__close:hover { color: var(--ink); }

			@media (max-width: 720px) {
				.gm-companion { right: 12px; bottom: 12px; }
				.gm-companion__avatar { width: 46px; height: 46px; font-size: 22px; }
			}

			/* ---- combo / max-streak in result ---- */
			.gm-combo-row {
				display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px;
				justify-content: center;
			}
			.gm-combo-pill {
				display: inline-flex; align-items: center; gap: 8px;
				background: linear-gradient(135deg, #fff7eb 0%, #ffe9c2 100%);
				border: 1px solid #f3d592;
				color: #8a5a1c;
				font-size: 13px; font-weight: 700;
				padding: 8px 14px;
				border-radius: 999px;
			}
			.gm-combo-pill__num {
				font-family: 'JetBrains Mono', monospace;
				font-variant-numeric: tabular-nums;
				font-weight: 800;
				font-size: 14px;
			}
			.gm-stars-pill {
				display: inline-flex; align-items: center; gap: 6px;
				background: linear-gradient(135deg, #fff8e1 0%, #ffe9b3 100%);
				border: 1px solid #f0d59a;
				color: #8a5a1c;
				font-size: 13px; font-weight: 700;
				padding: 8px 14px;
				border-radius: 999px;
			}
			.gm-xp-pill {
				display: inline-flex; align-items: center; gap: 6px;
				background: var(--gm-primary-50);
				border: 1px solid #d8def9;
				color: var(--gm-primary);
				font-size: 13px; font-weight: 700;
				padding: 8px 14px;
				border-radius: 999px;
			}

			/* ---- level-up overlay ---- */
			.gm-levelup {
				position: fixed; inset: 0;
				background: rgba(15,18,38,.55);
				backdrop-filter: blur(4px);
				z-index: 90;
				display: flex; align-items: center; justify-content: center;
				padding: 20px;
				opacity: 0;
				pointer-events: none;
				transition: opacity .3s;
			}
			.gm-levelup.is--shown { opacity: 1; pointer-events: auto; }
			.gm-levelup__card {
				background: #fff; border-radius: 22px; padding: 32px 32px 24px;
				max-width: 380px; width: 100%; text-align: center;
				box-shadow: 0 24px 48px -10px rgba(15,18,38,.4);
				transform: scale(.92); opacity: 0; transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s;
			}
			.gm-levelup.is--shown .gm-levelup__card { transform: scale(1); opacity: 1; }
			.gm-levelup__art {
				width: 88px; height: 88px; border-radius: 50%;
				background: linear-gradient(135deg, var(--gm-primary), var(--gm-violet));
				display: flex; align-items: center; justify-content: center;
				font-size: 44px; color: #fff;
				margin: 0 auto 14px;
				box-shadow: 0 18px 36px -10px rgba(79,70,229,.55);
			}
			.gm-levelup__h { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
			.gm-levelup__sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
			.gm-levelup__rank {
				display: inline-flex; margin-top: 12px;
				padding: 6px 14px; border-radius: 999px;
				background: var(--gm-violet-50); color: var(--gm-violet);
				font-size: 13px; font-weight: 700;
			}

			/* ============================================================
			   LEVEL MAP v2 — карта одной главы (7 узлов + босс)
			   Точная вёрстка по референсу _tmp_ft6/level-map.html.
			   Все классы префиксированы .lm- чтобы не конфликтовать со
			   старым .gm- кодом. CSS-переменные локальные (--lm-*).
			   ============================================================ */
			.lm {
				--lm-bg:        #f6f7fb;
				--lm-bg-2:      #eef0f7;
				--lm-surface:   #ffffff;
				--lm-line:      #e6e8f0;
				--lm-line-2:    #eef0f7;
				--lm-ink:       #0f1226;
				--lm-ink-2:     #2a2e4a;
				--lm-muted:     #6b7094;
				--lm-muted-2:   #9aa0bf;
				--lm-primary:   #4f46e5;
				--lm-primary-2: #6366f1;
				--lm-primary-50:#eef0ff;
				--lm-violet:    #7c3aed;
				--lm-violet-50: #f3eeff;
				--lm-emerald:   #10b981;
				--lm-emerald-50:#e7faf2;
				--lm-amber:     #f59e0b;
				--lm-shadow-sm: 0 1px 2px rgba(15,18,38,.04), 0 1px 1px rgba(15,18,38,.03);
				--lm-shadow:    0 1px 2px rgba(15,18,38,.04), 0 8px 24px rgba(15,18,38,.06);
				--lm-shadow-glow:0 0 0 6px rgba(79,70,229,.10), 0 0 0 14px rgba(79,70,229,.06), 0 18px 36px -10px rgba(79,70,229,.45);
				--lm-shadow-boss:0 0 0 6px rgba(124,58,237,.12), 0 18px 36px -8px rgba(124,58,237,.45);
				font-feature-settings: "ss01","cv11";
			}
			.lm .lm-num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

			/* HERO */
			.lm-hero {
				background: var(--lm-surface);
				border: 1px solid var(--lm-line);
				border-radius: 28px;
				padding: 28px 32px;
				box-shadow: var(--lm-shadow);
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 28px;
				align-items: center;
				position: relative;
				overflow: hidden;
			}
			.lm-hero::before {
				content: ""; position: absolute; inset: auto -10% -60% auto;
				width: 520px; height: 520px;
				background: radial-gradient(closest-side, rgba(124,58,237,.10), transparent 70%);
				pointer-events: none;
			}
			.lm-back {
				color: var(--lm-muted); font-size: 12.5px;
				display: inline-flex; align-items: center; gap: 6px;
				text-decoration: none;
			}
			.lm-back:hover { color: var(--lm-ink-2); }
			.lm-hero h1 {
				margin: 10px 0 8px; font-size: 32px; line-height: 1.1;
				letter-spacing: -0.02em; font-weight: 800; color: var(--lm-ink);
			}
			.lm-hero h1 .lm-dot { color: var(--lm-muted-2); margin: 0 6px; font-weight: 400; }
			.lm-hero p.lm-lead {
				margin: 0 0 18px; color: var(--lm-muted);
				font-size: 14.5px; line-height: 1.55; max-width: 56ch;
			}
			.lm-cta-row { display: flex; gap: 10px; flex-wrap: wrap; }
			.lm-btn {
				height: 42px; padding: 0 16px; border-radius: 12px;
				border: 1px solid var(--lm-line); background: var(--lm-surface);
				font-weight: 600; font-size: 13.5px; color: var(--lm-ink-2);
				display: inline-flex; align-items: center; gap: 8px;
				cursor: pointer; transition: background .15s, border-color .15s;
			}
			.lm-btn:hover { background: var(--lm-bg-2); }
			.lm-btn-streak {
				background: linear-gradient(180deg, #fff7ed 0%, #ffedd5 100%);
				border-color: #fed7aa; color: #9a3412;
			}
			.lm-btn-streak:hover { background: linear-gradient(180deg, #ffedd5 0%, #fed7aa 100%); }

			.lm-stat-cluster {
				display: grid; grid-template-columns: repeat(4, auto);
				border: 1px solid var(--lm-line);
				border-radius: 18px;
				background: linear-gradient(180deg, #ffffff 0%, #fafbff 100%);
				overflow: hidden;
				min-width: 540px;
			}
			.lm-stat {
				padding: 16px 22px;
				display: flex; align-items: center; gap: 12px;
				border-right: 1px solid var(--lm-line-2);
				white-space: nowrap;
			}
			.lm-stat:last-child { border-right: none; }
			.lm-stat-ico {
				width: 38px; height: 38px; border-radius: 10px;
				display: inline-flex; align-items: center; justify-content: center;
				flex-shrink: 0;
			}
			.lm-ico-star { background: #fff7d6; color: #b45309; }
			.lm-ico-fire { background: #ffe4e1; color: #dc2626; }
			.lm-ico-xp   { background: var(--lm-violet-50); color: var(--lm-violet); }
			.lm-ico-lvl  { background: var(--lm-primary-50); color: var(--lm-primary); }
			.lm-stat-val {
				font-size: 19px; font-weight: 800; letter-spacing: -.01em;
				line-height: 1; color: var(--lm-ink);
			}
			.lm-stat-lbl {
				font-size: 11.5px; color: var(--lm-muted); margin-top: 4px;
				letter-spacing: .02em;
			}
			.lm-stat .lm-num { font-weight: 800; }
			.lm-stat-lvl-num {
				font-size: 26px; font-weight: 800;
				background: linear-gradient(180deg, var(--lm-primary) 0%, var(--lm-violet) 100%);
				-webkit-background-clip: text; background-clip: text;
				-webkit-text-fill-color: transparent;
				line-height: 1;
			}

			/* MAP */
			.lm-map-card {
				margin-top: 22px;
				background: var(--lm-surface);
				border: 1px solid var(--lm-line);
				border-radius: 28px;
				padding: 26px 28px 30px;
				box-shadow: var(--lm-shadow);
				position: relative;
				overflow: hidden;
			}
			.lm-map-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 6px; gap: 12px; flex-wrap: wrap; }
			.lm-map-title { font-size: 18px; font-weight: 700; letter-spacing: -.01em; color: var(--lm-ink); }
			.lm-map-sub { font-size: 12.5px; color: var(--lm-muted); }
			.lm-legend { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
			.lm-legend-item { font-size: 12px; color: var(--lm-muted); display: inline-flex; align-items: center; gap: 6px; }
			.lm-legend-dot { width: 8px; height: 8px; border-radius: 999px; }
			.lm-legend-done { background: var(--lm-emerald); }
			.lm-legend-now  { background: var(--lm-primary); box-shadow: 0 0 0 3px rgba(79,70,229,.18); }
			.lm-legend-lock { background: #c8cce0; }
			.lm-legend-boss { background: var(--lm-violet); }

			.lm-map-wrap { position: relative; height: 290px; margin-top: 18px; }
			.lm-map-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
			.lm-nodes {
				position: absolute; inset: 0;
				display: grid;
				grid-template-columns: repeat(7, 1fr);  /* 6 узлов + 1 босс = 7 ячеек */
				align-items: center;
			}
			.lm-cell {
				display: flex; flex-direction: column; align-items: center; justify-content: center;
				position: relative; height: 100%;
			}
			.lm-cell .lm-label-top {
				position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
				font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
				white-space: nowrap;
			}
			.lm-cell .lm-label-top.is--next { color: var(--lm-primary); }
			.lm-cell .lm-label-top.is--boss { color: var(--lm-violet); }

			.lm-node {
				width: 78px; height: 78px; border-radius: 999px;
				background: var(--lm-surface);
				border: 2px solid var(--lm-line);
				display: flex; align-items: center; justify-content: center;
				font-size: 26px; font-weight: 800; color: var(--lm-muted-2);
				position: relative;
				transition: transform .15s ease;
				z-index: 2;
				cursor: pointer;
				font-family: inherit;
				padding: 0;
			}
			.lm-node:disabled { cursor: not-allowed; }
			.lm-node.is--done {
				border-color: var(--lm-emerald);
				color: var(--lm-emerald);
				background: #fff;
			}
			.lm-node.is--done::after {
				content: ""; position: absolute; right: -4px; top: -4px;
				width: 26px; height: 26px; border-radius: 999px;
				background: var(--lm-emerald);
				background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");
				background-repeat: no-repeat; background-position: center;
				box-shadow: 0 4px 10px -2px rgba(16,185,129,.55), 0 0 0 3px #fff;
			}
			.lm-node.is--current {
				background: linear-gradient(180deg, var(--lm-primary-2) 0%, var(--lm-primary) 100%);
				border-color: transparent;
				color: #fff;
				box-shadow: var(--lm-shadow-glow);
				animation: lmPulse 2.4s ease-in-out infinite;
			}
			@keyframes lmPulse {
				0%,100% { box-shadow: 0 0 0 6px rgba(79,70,229,.10), 0 0 0 14px rgba(79,70,229,.06), 0 18px 36px -10px rgba(79,70,229,.45); }
				50%     { box-shadow: 0 0 0 10px rgba(79,70,229,.14), 0 0 0 20px rgba(79,70,229,.06), 0 18px 36px -10px rgba(79,70,229,.55); }
			}
			.lm-node.is--locked {
				background: #f3f4fb;
				border-color: var(--lm-line);
				color: var(--lm-muted-2);
			}
			.lm-node.is--locked .lm-lock { width: 22px; height: 22px; }
			.lm-node.is--boss {
				width: 88px; height: 88px;
				background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%);
				border-color: transparent;
				color: #fff;
				box-shadow: var(--lm-shadow-boss);
			}
			.lm-node.is--boss::before {
				content: ""; position: absolute; inset: -6px; border-radius: 999px;
				background: conic-gradient(from 0deg, rgba(167,139,250,.0), rgba(167,139,250,.55), rgba(167,139,250,.0) 60%);
				-webkit-mask: radial-gradient(circle, transparent 60%, #000 61%);
				        mask: radial-gradient(circle, transparent 60%, #000 61%);
				z-index: -1;
				animation: lmSpin 8s linear infinite;
			}
			.lm-node.is--boss.is--locked { background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%); color: #fff; opacity: .9; }
			@keyframes lmSpin { to { transform: rotate(360deg); } }
			.lm-node.is--boss .lm-boss-lock {
				position: absolute; right: -2px; top: -2px;
				width: 24px; height: 24px; border-radius: 999px; background: #fff;
				color: var(--lm-violet); display: inline-flex; align-items: center; justify-content: center;
				box-shadow: 0 4px 10px -2px rgba(124,58,237,.45), 0 0 0 3px #fff;
			}

			.lm-cap { margin-top: 14px; text-align: center; max-width: 130px; }
			.lm-cap-name { font-size: 13.5px; font-weight: 600; color: var(--lm-ink); }
			.lm-cap-status { font-size: 12px; margin-top: 3px; color: var(--lm-muted); display: inline-flex; align-items: center; gap: 5px; }
			.lm-cap-status.is--done { color: var(--lm-emerald); font-weight: 600; }
			.lm-cap-status.is--now  { color: var(--lm-primary); font-weight: 600; }
			.lm-cap-stars { margin-top: 6px; display: inline-flex; gap: 3px; }
			.lm-cap-stars svg { width: 14px; height: 14px; }
			.lm-star-on  { color: #f59e0b; }
			.lm-star-off { color: #d9dcea; }
			.lm-score-chip {
				margin-top: 8px;
				display: inline-flex; align-items: center; gap: 5px;
				font-size: 11.5px; font-weight: 600;
				background: var(--lm-emerald-50); color: #047857;
				padding: 3px 9px; border-radius: 999px;
				border: 1px solid #c2f0d9;
			}
			.lm-start-btn {
				margin-top: 10px;
				height: 34px; padding: 0 14px;
				border-radius: 10px; border: 0;
				background: linear-gradient(180deg, var(--lm-primary-2), var(--lm-primary));
				color: #fff; font-weight: 600; font-size: 13px;
				display: inline-flex; align-items: center; gap: 6px;
				cursor: pointer;
				box-shadow: 0 6px 14px -4px rgba(79,70,229,.55);
				font-family: inherit;
			}
