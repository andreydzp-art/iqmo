		<meta charset="UTF-8" />

		<title>IQMO — Полный вариант ОГЭ · Биология</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="./iqmo-base.css?v=1" />
		<style>


			/* ---- top bar ---- */
			.topbar {
				background: #fff;
				padding: 0;
				position: sticky;
				top: 0;
				z-index: 20;
			}
			/* Полоса под заголовком — только под строкой с кнопкой, не пересекается с «Выйти» */
			.topbar__head {
				border-bottom: 1px solid var(--line);
				padding: 14px 0;
			}
			.topbar__row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
			.topbar__right { display: flex; align-items: center; flex-shrink: 0; }
			.topbar__left { display: flex; align-items: center; gap: 16px; min-width: 0; }
			.logo { font-weight: 800; font-size: 18px; letter-spacing: .02em; }
			.topbar__subject {
				font-size: 13px; color: var(--muted); padding-left: 14px;
				border-left: 1px solid var(--line);
				overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
			}
			.topbar__subject b { color: var(--ink); font-weight: 700; }
			.topbar__center { display: flex; align-items: center; gap: 14px; }
			.timer {
				display: inline-flex; align-items: center; gap: 8px;
				background: var(--accent-weak); color: var(--accent);
				padding: 8px 14px; border-radius: 999px;
				font-weight: 700; font-size: 14px;
				font-variant-numeric: tabular-nums;
			}
			.timer.is--warning { background: #fbf0d9; color: #c28216; }
			.timer.is--danger { background: #fbe2e2; color: #b23e3e; }
			.timer__dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
			@keyframes pulse { 50% { opacity: .35; transform: scale(.85); } }

			.btn {
				display: inline-flex; align-items: center; justify-content: center;
				gap: 8px; font-weight: 600; font-size: 14px;
				padding: 10px 18px; border-radius: 999px;
				border: 1.5px solid transparent; cursor: pointer;
				transition: background .15s, color .15s, border-color .15s, transform .08s;
				white-space: nowrap;
			}
			[hidden] { display: none !important; }
			.btn:active { transform: translateY(1px); }
			.btn--primary { background: linear-gradient(180deg, #44c77d, #2fa965); color: #fff; box-shadow: 0 8px 20px -8px rgba(62,195,122,.55); }
			.btn--primary:hover { filter: brightness(1.05); }
			.btn--ghost { background: #fff; border-color: var(--line); color: var(--ink); }
			.btn--ghost:hover { border-color: var(--ink); }
			.btn--dark { background: var(--dark); color: #fff; }
			.btn--dark:hover { background: #111520; }
			.btn--blue { background: var(--accent); color: #fff; }
			.btn--blue:hover { background: #3e64b6; }
			.btn[disabled] { opacity: .4; cursor: not-allowed; }

			/* ---- progress bar ---- */
			.progressbar {
				height: 3px;
				background: var(--line);
				overflow: hidden;
				margin-top: 0;
			}
			.progressbar__fill {
				height: 100%; background: linear-gradient(90deg, var(--accent), var(--green));
				transition: width .3s ease; width: 0%;
			}

			/* ---- layout ---- */
			.page__main { flex: 1 0 auto; padding: 24px 0 48px; }
			.grid {
				display: grid;
				grid-template-columns: minmax(0, 240px) minmax(0, 1fr);
				gap: 24px;
				align-items: start;
			}
			.grid__aside { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 16px; }

			/* ---- nav tasks ---- */
			.nav-tasks { padding: 18px; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); }
			.nav-tasks__head {
				display: flex; align-items: center; justify-content: space-between;
				margin-bottom: 14px;
			}
			.nav-tasks__title { font-size: 14px; font-weight: 700; }
			.nav-tasks__counter { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
			.nav-tasks__grid {
				display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
			}
			.nav-task {
				aspect-ratio: 1 / 1;
				border-radius: 9px;
				background: #eef1f6; color: var(--ink-2);
				font-weight: 700; font-size: 13px;
				display: inline-flex; align-items: center; justify-content: center;
				cursor: pointer;
				transition: background .15s, color .15s, box-shadow .15s;
				font-variant-numeric: tabular-nums;
				position: relative;
				border: 1.5px solid transparent;
			}
			.nav-task:hover { background: #e2e7f0; }
			.nav-task.is--answered { background: #e7f6ec; color: #2fa968; }
			.nav-task.is--flagged::after {
				content: ""; position: absolute; top: 3px; right: 3px;
				width: 6px; height: 6px; border-radius: 50%; background: var(--amber);
			}
			.nav-task.is--current { border-color: var(--accent); background: var(--accent); color: #fff; box-shadow: 0 4px 10px -2px rgba(79,123,214,.5); }

			.nav-legend { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
			.nav-legend__row { display: flex; align-items: center; gap: 8px; }
			.nav-legend__dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }

			.quit {
				background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
				padding: 16px; display: flex; flex-direction: column; gap: 10px;
			}
			.quit__hint { font-size: 12px; color: var(--muted); line-height: 1.5; }

			/* ---- question card ---- */
			.q-card {
				background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
				padding: 28px 32px; display: flex; flex-direction: column; gap: 22px;
				min-height: 520px;
			}
			.q-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
			.q-head__left { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
			.q-tag {
				display: inline-flex; align-items: center; gap: 8px;
				font-size: 12px; font-weight: 700; letter-spacing: .06em;
				text-transform: uppercase; color: var(--muted);
			}
			.q-tag b { color: var(--accent); font-weight: 700; }
			.q-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
			.q-flag {
				display: inline-flex; align-items: center; gap: 6px;
				font-size: 13px; color: var(--muted); font-weight: 600;
				padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
				background: #fff; cursor: pointer;
				transition: border-color .15s, color .15s, background .15s;
			}
			.q-flag:hover { border-color: var(--amber); color: var(--amber); }
			.q-flag.is--on { background: #fbf0d9; color: #c28216; border-color: #f0d59a; }

			.q-body { font-size: 16px; color: var(--ink); line-height: 1.65; }
			.q-body p { margin: 0 0 10px; }
			.q-body p:last-child { margin-bottom: 0; }
			.q-body b, .q-body strong { font-weight: 700; }
			.q-body .chem { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; }
			.q-body sub { font-size: 0.75em; }
			.q-body sup { font-size: 0.75em; }
			.q-body .q-figure {
				margin: 16px auto 0;
				max-width: min(100%, 400px);
				width: 100%;
			}
			.q-body .q-figure--wide { max-width: min(100%, 640px); }
			.q-body .q-figure__img {
				display: block; width: 100%; max-width: 100%; height: auto; margin: 0 auto; border-radius: 12px;
				box-shadow: 0 8px 24px -14px rgba(20, 28, 44, 0.3);
			}

			/* options */
			.options { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
			.option {
				display: flex; align-items: flex-start; gap: 12px;
				padding: 12px 14px;
				border: 1.5px solid var(--line); border-radius: 12px;
				background: #fff; cursor: pointer;
				transition: border-color .15s, background .15s;
				font-size: 15px; color: var(--ink); line-height: 1.5;
			}
			.option:hover { border-color: #c7cfdc; }
			.option__marker {
				width: 22px; height: 22px; border-radius: 6px;
				background: #eef1f6; color: var(--ink-2);
				display: inline-flex; align-items: center; justify-content: center;
				font-weight: 700; font-size: 13px; flex: 0 0 auto;
				transition: background .15s, color .15s;
			}
			.option.is--checked { border-color: var(--accent); background: var(--accent-weak); }
			.option.is--checked .option__marker { background: var(--accent); color: #fff; }
			.option input { display: none; }
			.option__label { min-width: 0; }

			.hint {
				font-size: 13px; color: var(--muted);
				padding: 10px 14px; background: #f3f5f8; border-radius: 10px;
				display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
			}
			.hint svg { flex: 0 0 auto; color: var(--accent); }

			/* answer input */
			.answer-input {
				display: flex; align-items: center; gap: 12px;
				padding: 10px; border: 1.5px solid var(--line); border-radius: 12px;
				background: #fff; max-width: 400px;
			}
			.answer-input:focus-within { border-color: var(--accent); background: var(--accent-weak); }
			.answer-input label { font-size: 13px; font-weight: 600; color: var(--muted); padding-left: 6px; }
			.answer-input input {
				flex: 1; border: 0; outline: 0; background: transparent;
				font-family: 'JetBrains Mono', monospace; font-size: 16px;
				font-weight: 600; color: var(--ink); padding: 6px 8px;
			}

			/* match table */
			.match {
				display: grid; grid-template-columns: 1fr 120px;
				gap: 10px 16px; max-width: 480px; margin-top: 6px;
			}
			.match__left { font-size: 15px; color: var(--ink); padding-top: 8px; }
			.match__left b { color: var(--accent); margin-right: 6px; }
			.match__select {
				width: 100%; padding: 8px 10px;
				border: 1.5px solid var(--line); border-radius: 10px;
				font-family: inherit; font-size: 14px; font-weight: 600;
				background: #fff; color: var(--ink); cursor: pointer;
			}
			.match__select:focus { outline: 0; border-color: var(--accent); }

			/* open answer */
			.open-answer {
				padding: 14px 16px; border-radius: 12px;
				background: #f3f5f8; border: 1px dashed #c7cfdc;
				font-size: 13px; color: var(--muted); line-height: 1.55;
			}
			.open-answer b { color: var(--ink); font-weight: 700; }

			/* footer nav */
			.q-foot {
				margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line);
				display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
			}
			.q-foot__left, .q-foot__right { display: flex; gap: 10px; align-items: center; }

			/* result page */
			.result-wrap { max-width: 720px; margin: 0 auto; }
			.result-card {
				background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
				padding: 40px 32px; text-align: center;
			}
			.result-score {
				font-size: 64px; font-weight: 800; letter-spacing: -0.02em;
				line-height: 1;
				background: linear-gradient(180deg, var(--accent), #3e64b6);
				-webkit-background-clip: text; background-clip: text; color: transparent;
				margin-bottom: 4px;
			}
			.result-max { color: var(--muted); font-size: 18px; font-weight: 600; }
			.result-grade {
				display: inline-block; margin-top: 16px;
				padding: 8px 20px; border-radius: 999px;
				background: var(--accent-weak); color: var(--accent);
				font-weight: 700;
			}
			.result-breakdown {
				margin-top: 28px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
			}
			.rb-item {
				padding: 14px; border-radius: 12px; background: #f3f5f8;
			}
			.rb-num { font-size: 22px; font-weight: 800; color: var(--ink); }
			.rb-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
			.result-hint { margin-top: 20px; font-size: 13px; color: var(--muted); text-align: left; }

			/* ---- review page ---- */
			.review-head {
				background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
				box-shadow: var(--shadow);
				padding: 22px 24px; margin-bottom: 18px;
				display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
			}
			.review-head__score { display: flex; align-items: baseline; gap: 10px; }
			.review-head__score b { font-size: 36px; font-weight: 800; color: var(--ink); }
			.review-head__score span { font-size: 16px; color: var(--muted); }
			.review-head__meta { font-size: 14px; color: var(--muted); }
			.review-head__meta b { color: var(--ink); }
			.review-filter { display: flex; gap: 8px; }
			.review-filter button {
				padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
				background: #fff; font-size: 13px; font-weight: 600; color: var(--ink-2);
			}
			.review-filter button.is--on { background: var(--ink); color: #fff; border-color: var(--ink); }
			.review-actions { display: flex; gap: 10px; flex-wrap: wrap; }

			.review-list { display: flex; flex-direction: column; gap: 14px; }
			.review-item {
				background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line);
				border-radius: var(--radius); box-shadow: var(--shadow);
				padding: 22px 24px;
			}
			.review-item.is--ok     { border-left-color: var(--green); }
			.review-item.is--wrong  { border-left-color: var(--red); }
			.review-item.is--skip   { border-left-color: var(--muted); }
			.review-item__head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
			.review-item__num {
				display: inline-flex; align-items: center; justify-content: center;
				width: 28px; height: 28px; border-radius: 8px;
				background: #eef1f6; color: var(--ink); font-weight: 700; font-size: 14px;
			}
			.review-item__title { font-size: 16px; font-weight: 700; color: var(--ink); }
			.review-item__badge {
				margin-left: auto; font-size: 12px; font-weight: 600;
				padding: 4px 10px; border-radius: 999px;
			}
			.review-item.is--ok    .review-item__badge { background: #e7f6ec; color: #2a8f52; }
			.review-item.is--wrong .review-item__badge { background: #fbe8e8; color: #b04545; }
			.review-item.is--skip  .review-item__badge { background: #eef1f6; color: var(--muted); }
			.review-item__body { font-size: 15px; line-height: 1.55; color: var(--ink-2); margin-bottom: 12px; }
			.review-item__body p { margin: 0 0 8px; }
			/* В разборе нет обёртки .q-body, поэтому собственных ограничений у фигур нет
			   и они рендерятся в натуральных пикселях (~1000×1000). В режиме «прочитать
			   и понять ошибку» иллюстрация — вспомогательная: держим её в компактной
			   рамке слева, чтобы текст разбора был основным фокусом. */
			.review-item__body .q-figure {
				margin: 10px 0 12px;
				max-width: min(100%, 240px);
				width: 100%;
			}
			.review-item__body .q-figure--wide { max-width: min(100%, 360px); }
			.review-item__body .q-figure__img,
			.review-item__body img {
				display: block; width: 100%; max-width: 100%; height: auto;
				border-radius: 10px;
				box-shadow: 0 6px 18px -12px rgba(20, 28, 44, 0.25);
			}

			.review-answers { display: grid; gap: 10px; margin: 10px 0 14px; }
			.review-answer {
				display: grid; grid-template-columns: 140px 1fr; gap: 12px;
				padding: 10px 14px; border-radius: 10px; background: #f7f9fc; font-size: 14px;
			}
			.review-answer__label { color: var(--muted); font-weight: 600; }
			.review-answer__value { color: var(--ink); font-weight: 600; }
			.review-answer.is--correct { background: #eef8f1; }
			.review-answer.is--correct .review-answer__value { color: #2a8f52; }
			.review-answer.is--wrong { background: #fdf0f0; }
			.review-answer.is--wrong .review-answer__value { color: #b04545; }
			.review-answer.is--muted .review-answer__value { color: var(--muted); font-style: italic; font-weight: 500; }

			.review-hint {
				display: flex; gap: 10px; align-items: flex-start;
				background: #eef4fe; color: #2b4a86; border-radius: 10px;
				padding: 12px 14px; font-size: 14px; line-height: 1.55;
			}
			.review-hint svg { flex-shrink: 0; margin-top: 3px; }
			.review-hint b { color: #1f3d76; }

			/* ---- written question (Part 2) ---- */
			.written-area {
				display: flex; flex-direction: column; gap: 10px; margin-top: 18px;
			}
			.written-area textarea {
				width: 100%; min-height: 200px; resize: vertical;
				font: 14px/1.5 'JetBrains Mono', Menlo, monospace;
				padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px;
				background: #fafbfd; color: var(--ink); transition: border-color .15s;
			}
			.written-area textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
			.written-note {
				display: flex; gap: 10px; align-items: flex-start;
				background: #fff8ea; color: #8a5a1c; border-radius: 10px;
				padding: 10px 14px; font-size: 13px; line-height: 1.5;
				border-left: 3px solid var(--amber);
			}
			.part-banner {
				display: inline-flex; align-items: center; gap: 6px;
				background: #fdecd6; color: #8a5a1c;
				font-size: 11px; font-weight: 700; text-transform: uppercase;
				letter-spacing: .06em; padding: 4px 10px; border-radius: 999px;
				margin-right: 8px;
			}

			/* nav dot for written tasks */
			.nav-task.is--written::after {
				content: ''; position: absolute; right: 4px; top: 4px;
				width: 5px; height: 5px; border-radius: 50%; background: var(--amber);
			}

			/* result — parts breakdown */
			.result-parts {
				display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
				margin: 20px 0 12px; text-align: left;
			}
			.result-part {
				border: 1.5px solid var(--line); border-radius: 14px;
				padding: 16px 18px; background: #fbfcfe;
			}
			.result-part__label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
			.result-part__score {
				font-size: 28px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums;
				display: flex; align-items: baseline; gap: 6px;
			}
			.result-part__score small { font-size: 15px; color: var(--muted); font-weight: 600; }
			.result-part__meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
			.result-part.is--selfcheck { background: #fff8ea; border-color: #f3d592; }
			.result-part.is--selfcheck .result-part__label { color: #8a5a1c; }

			/* self-check card in review */
			.sc-card { border-color: #f3d592 !important; }
			.sc-your-answer {
				background: #f7f8fb; border-radius: 10px; padding: 12px 14px;
				font-family: 'JetBrains Mono', Menlo, monospace; font-size: 13px;
				white-space: pre-wrap; color: var(--ink-2); margin-top: 10px;
				border: 1px solid var(--line);
			}
			.sc-your-answer.is--empty { font-style: italic; color: var(--muted); font-family: inherit; }
			.sc-solution {
				background: #eef4fe; border-radius: 10px; padding: 14px 16px;
				font-size: 14px; line-height: 1.6; color: #1f3d76; margin-top: 12px;
				border-left: 3px solid var(--accent);
			}
			.sc-solution b { color: #1a325e; }
			.sc-solution p { margin: 0; }
			.sc-solution p + p, .sc-solution p + ol, .sc-solution ol + p { margin-top: 8px; }
			.sc-criteria {
				margin-top: 14px; display: flex; flex-direction: column; gap: 8px;
			}
			.sc-criteria__title {
				font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
				color: var(--muted); margin-bottom: 2px;
			}
			.sc-criterion {
				display: flex; gap: 10px; align-items: flex-start;
				padding: 10px 12px; background: #fff; border: 1.5px solid var(--line);
				border-radius: 10px; cursor: pointer; transition: .12s;
			}
			.sc-criterion:hover { border-color: var(--accent); }
			.sc-criterion.is--checked { background: #eef8f1; border-color: #bfe3cd; }
			.sc-criterion input { margin: 2px 0 0; accent-color: var(--green); flex-shrink: 0; }
			.sc-criterion__body { flex: 1; font-size: 14px; color: var(--ink-2); }
			.sc-criterion__pts {
				font-size: 11px; font-weight: 700; color: var(--green);
				background: #e7f6ec; padding: 2px 8px; border-radius: 999px; flex-shrink: 0;
			}
			.sc-total {
				margin-top: 8px; padding: 10px 14px; background: #f7f8fb;
				border-radius: 10px; display: flex; justify-content: space-between;
				align-items: center; font-size: 14px;
			}
			.sc-total b { font-size: 17px; font-variant-numeric: tabular-nums; color: var(--ink); }
			.sc-note {
				margin-top: 28px; padding: 14px 18px; background: #fafbfd;
				border: 1.5px dashed var(--line); border-radius: 12px;
				font-size: 13px; color: var(--muted); text-align: center;
			}

			@media (max-width: 600px) {
				.result-parts { grid-template-columns: 1fr; }
			}

			@media (max-width: 600px) {
				.review-head { padding: 18px; }
				.review-answer { grid-template-columns: 1fr; gap: 4px; padding: 10px 12px; }
			}

			/* ---- responsive ---- */
			@media (max-width: 1024px) {
				.grid { grid-template-columns: 1fr; }
				.grid__aside { position: static; flex-direction: row; flex-wrap: wrap; }
				.nav-tasks, .quit { flex: 1 1 280px; }
				.nav-tasks__grid { grid-template-columns: repeat(10, 1fr); }
				.q-card { padding: 22px 20px; }
			}
			/* ---- variant picker ---- */
			.vp-hero {
				padding: 36px 0 10px;
				display: flex; align-items: flex-end; justify-content: space-between;
				gap: 24px; flex-wrap: wrap;
			}
			.vp-hero__title { font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
			.vp-hero__sub { color: var(--muted); font-size: 14px; margin-top: 6px; max-width: 540px; }
			.vp-stats { display: flex; gap: 22px; font-size: 13px; color: var(--muted); }
			.vp-stats b { display: block; color: var(--ink); font-size: 20px; font-weight: 800; line-height: 1.1; margin-bottom: 2px; font-variant-numeric: tabular-nums; }

			.vp-section-title {
				margin: 28px 0 8px;
				font-size: 13px; font-weight: 700; color: var(--muted);
				text-transform: uppercase; letter-spacing: .06em;
			}
			.vp-section-hint {
				font-size: 13px; color: var(--muted);
				line-height: 1.5;
				max-width: 560px;
				margin: 0 0 16px;
			}

			.vp-grid {
				display: grid; gap: 12px;
				grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
				padding-bottom: 48px;
			}
			/* Два ближайших варианта: не грузим сеткой на десятки карточек */
			.vp-grid--pair {
				grid-template-columns: repeat(2, minmax(0, 1fr));
				max-width: 520px;
			}
			.vp-grid--pair.vp-grid--single {
				grid-template-columns: 1fr;
				max-width: 280px;
			}
			.vp-tile {
				position: relative;
				background: var(--card); border: 1.5px solid var(--line);
				border-radius: 14px; padding: 14px 14px 12px;
				display: flex; flex-direction: column; gap: 6px;
				min-height: 108px;
				transition: border-color .15s, transform .08s, box-shadow .15s;
				cursor: pointer; text-align: left; font-family: inherit;
			}
			.vp-tile:hover { border-color: var(--accent); box-shadow: 0 6px 18px -10px rgba(79,123,214,.4); }
			.vp-tile:active { transform: translateY(1px); }
			.vp-tile__num { font-size: 26px; font-weight: 800; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
			.vp-tile__label { font-size: 12px; color: var(--muted); font-weight: 600; }
			.vp-tile__badge {
				position: absolute; top: 10px; right: 10px;
				font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
				padding: 3px 7px; border-radius: 999px;
				background: #e7f6ec; color: #1f8a4c;
			}
			.vp-tile__status {
				margin-top: auto; font-size: 12px; color: var(--muted);
				display: flex; align-items: center; gap: 6px;
			}
			.vp-tile__dot { width: 6px; height: 6px; border-radius: 50%; background: #c9cfda; }

			/* passed variant */
			.vp-tile.is--passed .vp-tile__dot { background: var(--green); }
			.vp-tile.is--passed .vp-tile__score { color: var(--green); font-weight: 700; }
			/* in progress */
			.vp-tile.is--progress .vp-tile__dot { background: var(--amber); }
			/* coming soon */
			.vp-tile.is--coming {
				opacity: .55; cursor: not-allowed; background: #f7f8fb;
			}
			.vp-tile.is--coming:hover { border-color: var(--line); box-shadow: none; }

			/* locked (not yet unlocked in linear progression) */
			.vp-tile.is--locked {
				cursor: not-allowed;
				background: linear-gradient(180deg, #fff2f2 0%, #fde7e7 100%);
				color: #a94d4d;
			}
			.vp-tile.is--locked .vp-tile__num { color: #c25555; }
			.vp-tile.is--locked .vp-tile__label { color: #b35959; }
			.vp-tile.is--locked .vp-tile__status { color: #b35959; }
			.vp-tile.is--locked:hover { border-color: #e88a8a; box-shadow: 0 6px 18px -10px rgba(214,90,90,.4); }
			.vp-tile__lock {
				position: absolute; top: 10px; right: 10px;
				width: 22px; height: 22px; border-radius: 50%;
				background: #e6e9ef; color: var(--muted);
				display: flex; align-items: center; justify-content: center;
				font-size: 12px;
			}
			.vp-tile__lock svg {
				width: 12px;
				height: 12px;
				display: block;
			}
			/* как в макете: белый замок на сплошном красном кружке */
			.vp-tile.is--locked .vp-tile__lock {
				width: 24px;
				height: 24px;
				background: var(--red);
				color: #fff;
				border: none;
				box-shadow: 0 2px 6px rgba(214, 90, 90, 0.45);
			}
			.vp-tile.is--locked .vp-tile__lock svg {
				width: 13px;
				height: 13px;
				stroke: #fff;
			}

			/* cooldown */
			.vp-tile.is--cooldown {
				opacity: .7; cursor: not-allowed; background: #fdf4e7;
				border-color: #f2cf8e;
			}
			.vp-tile.is--cooldown:hover { border-color: #f2cf8e; box-shadow: none; }
			.vp-tile.is--cooldown .vp-tile__dot { background: var(--amber); }

			/* dev / все открытые варианты (pending-open) — раньше без класса, стили не применялись */
			.vp-tile.is--pending-open {
				background: linear-gradient(180deg, #f7f9ff 0%, #eef3fc 100%);
				border-color: #c8d4ee;
			}
			.vp-tile.is--pending-open:hover { border-color: var(--accent); }

			/* current (next unlocked task) */
			.vp-tile.is--current {
				border-color: var(--accent);
				box-shadow: 0 0 0 3px rgba(79,123,214,.14);
				animation: vpPulse 2.4s ease-in-out infinite;
			}
			@keyframes vpPulse {
				0%, 100% { box-shadow: 0 0 0 3px rgba(79,123,214,.14); }
				50%      { box-shadow: 0 0 0 6px rgba(79,123,214,.08); }
			}

			/* streak banner */
			.vp-streak {
				display: inline-flex; align-items: center; gap: 10px;
				padding: 10px 14px;
				background: linear-gradient(135deg, #fff4e0 0%, #ffe8c7 100%);
				border: 1px solid #f2cf8e;
				border-radius: 12px;
				font-size: 13px; color: #7a5418; font-weight: 600;
				margin-top: 14px;
			}
			.vp-streak__flame { font-size: 18px; }
			.vp-streak b { color: #8a5a1c; font-size: 15px; }

			.vp-back {
				display: inline-flex; align-items: center; gap: 6px;
				font-size: 13px; color: var(--muted); margin-top: 4px;
			}
			.vp-back:hover { color: var(--ink); }

			@media (max-width: 600px) {
				.vp-grid:not(.vp-grid--pair) { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
				.vp-grid--pair { grid-template-columns: 1fr; max-width: none; }
			}

			@media (max-width: 600px) {
				.topbar__subject { display: none; }
				.q-title { font-size: 19px; }
				.nav-tasks__grid { grid-template-columns: repeat(8, 1fr); }
				.result-breakdown { grid-template-columns: 1fr; }
				.q-card { padding: 20px 16px; }
			}
		</style>
	</head>

		<script src="./exam-config.js"></script>
		<script src="./biology-bank.js?v=11"></script>
		<script src="./biology-variants.js?v=2"></script>
		<script src="./iqmo-sync.js"></script>
		<script src="./iqmo-nav.js"></script>
		<script src="./iqmo-regnudge.js?v=3"></script>
		<script src="./mistakes-store.js"></script>
		<script src="./chem-progress.js"></script>
		<script>
			// ============================================================
			// QUESTION BANK (loaded from biology-bank.js)
			// Structure per question:
			//   id: task number (1..23)
			//   type: 'single' | 'multi' | 'input' | 'match' | 'open'
			//   title: short title for header
			//   body: HTML string (the task statement)
			//   options: [{id, label}]          — for single/multi
			//   correct: string | string[]      — expected answer (for auto-check)
			//     - single: "2"
			//     - multi:  ["1","5"]           (order-independent)
			//     - input:  "24" | "7"          (string compare)
			//     - match:  ["1","2","3"] in order A,Б,В
			//   matchLeft, matchRight: for 'match' type
			//   hint: optional string
			// ============================================================
			const BANK = window.BIOLOGY_QUESTIONS || [];
			const VARIANTS = window.BIOLOGY_VARIANTS || [];

			// ============================================================
			// ROUTING: variant picker vs. test
			// ============================================================
			const urlParams = new URLSearchParams(window.location.search);
			const variantParam = urlParams.get('v');

			// ---- DEV flag (hoisted to top of script) ----
			var DEV_UNLOCK_ALL = false;
			var PASS_THRESHOLD = 0.5;
			var COOLDOWN_MS = 60 * 60 * 1000;
			(function runApp() {
			if (!variantParam) {
				renderVariantPicker();
				return; // stop here, picker only
			}

			// Resolve variant
			let activeVariant = null;
			let QUESTIONS = [];
			{
				const vid = Number(variantParam);
				activeVariant = VARIANTS.find(v => v.id === vid);
				if (!activeVariant || activeVariant.status !== 'ready' || !activeVariant.qids.length) {
					// Fallback: show picker
					renderVariantPicker();
					return;
				}
				QUESTIONS = activeVariant.qids.map(qid => BANK.find(b => b.id === qid)).filter(Boolean);
			}

			// Update subject label with variant
			try {
				const subj = document.querySelector('.topbar__subject');
				if (subj) subj.innerHTML = `<b>Биология · ОГЭ 2026</b> — ${activeVariant.title}`;
			} catch(e) {}

			// ============================================================
			// STATE
			// ============================================================
			const LS_KEY = 'iqmo-bio-v-' + activeVariant.id;
			const EXAM_SUBJECT = (document.body && document.body.dataset.examSubject) || 'biology';
			const FULL_MIN = window.getExamTimerMinutes ? getExamTimerMinutes(EXAM_SUBJECT, 'full') : 180;
			const TEST_SECONDS = FULL_MIN * 60;
			const state = loadState();

			function loadState() {
				try {
					const raw = localStorage.getItem(LS_KEY);
					if (raw) {
						const s = JSON.parse(raw);
						if (s && typeof s === 'object') {
							if (!s.attemptId) {
								s.attemptId =
									(typeof crypto !== 'undefined' && crypto.randomUUID && crypto.randomUUID()) ||
									'at-' + Date.now().toString(36);
							}
							if (s.startEventSent == null) s.startEventSent = false;
							return s;
						}
					}
				} catch(e) {}
				return {
					current: 0,
					answers: {},   // { 1: '2', 2: ['1','5'], ... }
					flagged: {},   // { 1: true }
					selfScores: {}, // { 20: {c1:true, c2:false, __reviewed:true}, ... }
					startedAt: Date.now(),
					finished: false,
					attemptId:
						(typeof crypto !== 'undefined' && crypto.randomUUID && crypto.randomUUID()) ||
						'at-' + Date.now().toString(36),
					startEventSent: false
				};
			}
			function saveState() {
				try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
			}

			(function fullAnalyticsStart() {
				if (state.finished || state.startEventSent || !QUESTIONS.length) return;
				try {
					if (window.ChemProgress && typeof ChemProgress.beginAttempt === 'function') {
						ChemProgress.beginAttempt({
							mode: 'full',
							subject: EXAM_SUBJECT,
							label: 'Полный вариант · ' + ((activeVariant && activeVariant.title) || ''),
							variantId: activeVariant && activeVariant.id != null ? activeVariant.id : null,
							variantTitle: (activeVariant && activeVariant.title) || '',
							totalQuestions: QUESTIONS.length,
							attemptId: state.attemptId
						});
					}
					state.startEventSent = true;
					saveState();
				} catch (eA) {}
			})();

			// ============================================================
			// RENDER
			// ============================================================
			const elCard = document.getElementById('q-card');
			const elNavGrid = document.getElementById('nav-grid');
			const elPb = document.getElementById('pb-fill');
			const elAnsweredCount = document.getElementById('answered-count');
			const elTotalCount = document.getElementById('total-count');
			elTotalCount.textContent = String(QUESTIONS.length);

			// Сколько из QUESTIONS — письменные (часть 2)
			const QCOUNT = QUESTIONS.length;
			const WRITTEN_IDS = new Set(QUESTIONS.filter(q => q.type === 'written').map(q => q.id));

			function isAnswered(id) {
				const a = state.answers[id];
				if (Array.isArray(a)) return a.length > 0;
				return a !== undefined && a !== '';
			}

			function renderNav() {
				elNavGrid.innerHTML = '';
				const total = QCOUNT;
				for (let i = 0; i < total; i++) {
					const q = QUESTIONS[i];
					const btn = document.createElement('button');
					btn.className = 'nav-task';
					btn.textContent = i + 1;
					if (i === state.current) btn.classList.add('is--current');
					if (q && isAnswered(q.id)) btn.classList.add('is--answered');
					if (q && state.flagged[q.id]) btn.classList.add('is--flagged');
					if (q && q.type === 'written') btn.classList.add('is--written');
					if (!q) { btn.disabled = true; btn.style.opacity = '.35'; btn.style.cursor = 'not-allowed'; btn.title = 'Задание будет добавлено'; }
					btn.addEventListener('click', () => {
						if (!q) return;
						state.current = i;
						saveState();
						renderAll();
					});
					elNavGrid.appendChild(btn);
				}
				const answered = QUESTIONS.filter(q => isAnswered(q.id)).length;
				elAnsweredCount.textContent = answered;
				elPb.style.width = (answered / total * 100) + '%';
			}

			function renderQuestion() {
				const q = QUESTIONS[state.current];
				if (!q) {
					elCard.innerHTML = `
						<div class="q-head">
							<div class="q-head__left">
								<div class="q-tag">Задание ${state.current + 1} / ${QCOUNT}</div>
								<h1 class="q-title">Задание ещё не добавлено</h1>
							</div>
						</div>
						<div class="open-answer">Пришлите условие этого задания, и оно появится здесь.</div>
					`;
					return;
				}

				const flagged = !!state.flagged[q.id];
				let inputHtml = '';

				if (q.type === 'single' || q.type === 'multi') {
					const picked = state.answers[q.id];
					const pickedSet = new Set(Array.isArray(picked) ? picked : (picked ? [picked] : []));
					// Перемешиваем варианты ответов при повторах (seeded by variant id + attempt index + qid)
					const attemptIdx = getAttemptIndex(activeVariant.id);
					const opts = attemptIdx > 0 ? seededShuffle(q.options.slice(), activeVariant.id * 1000 + attemptIdx * 37 + q.id) : q.options;
					inputHtml = `<div class="options" data-role="options" data-multi="${q.type === 'multi' ? '1' : '0'}">
						${opts.map(o => `
							<label class="option ${pickedSet.has(o.id) ? 'is--checked' : ''}" data-id="${o.id}">
								<span class="option__marker">${o.id}</span>
								<span class="option__label">${o.label}</span>
							</label>
						`).join('')}
					</div>`;
					// подсказка (q.hint) скрыта во время теста и будет показана на странице результатов
				}
				else if (q.type === 'input') {
					const v = state.answers[q.id] || '';
					const isText = q.textAnswer === true;
					inputHtml = `<div class="answer-input" data-role="input">
						<label for="ans-input">Ответ:</label>
						<input id="ans-input" type="text" inputmode="${isText ? 'text' : 'numeric'}" autocomplete="off" value="${escapeAttr(v)}" placeholder="${q.placeholder || (isText ? 'введите ответ' : 'введите число')}" />
					</div>`;
					// подсказка (q.hint) скрыта во время теста и будет показана на странице результатов
				}
				else if (q.type === 'match') {
					const picked = Array.isArray(state.answers[q.id]) ? state.answers[q.id] : [];
					inputHtml = `<div class="match" data-role="match">
						${q.matchLeft.map((l, i) => `
							<div class="match__left"><b>${l.letter})</b> ${l.label}</div>
							<select class="match__select" data-idx="${i}">
								<option value="">—</option>
								${q.matchRight.map(r => `<option value="${r.id}" ${picked[i]===r.id?'selected':''}>${r.id}) ${r.label}</option>`).join('')}
							</select>
						`).join('')}
					</div>`;
				}
				else if (q.type === 'open') {
					inputHtml = `<div class="open-answer"><b>Развёрнутый ответ.</b> Решение проверяется вручную — запишите его на бумаге. После завершения теста экран предложит ввести, считаете ли вы задачу решённой.</div>`;
				}
				else if (q.type === 'written') {
					const v = state.answers[q.id] || '';
					inputHtml = `
						<div class="written-area">
							<label for="ans-written" style="font-size:13px; color:var(--muted); font-weight:600;">Ваше решение (черновик):</label>
							<textarea id="ans-written" placeholder="Запишите здесь уравнения, расчёты, наблюдения — свободной формой. Этот текст увидите только вы.">${v.replace(/</g,'&lt;')}</textarea>
							<div class="written-note">
								<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:2px;"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
								<div><b>Это задание части 2.</b> Решение проверяется вручную. После завершения теста вы увидите эталон и поставите себе баллы по критериям. Максимум — <b>${q.maxPoints || 3} балла</b>.</div>
							</div>
						</div>
					`;
				}

				elCard.innerHTML = `
					<div class="q-head">
						<div class="q-head__left">
							<div class="q-tag">${q.type === 'written' ? '<span class="part-banner">Часть 2</span>' : ''}Задание <b>${q.id}</b> / ${QCOUNT} · ${taskTypeLabel(q)}</div>
							<h1 class="q-title">${q.title}</h1>
						</div>
						<button type="button" class="q-flag ${flagged?'is--on':''}" id="btn-flag">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="${flagged?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
							${flagged ? 'Отмечено' : 'Вернуться позже'}
						</button>
					</div>
					<div class="q-body">${q.body}</div>
					${inputHtml}
					<div class="q-foot">
						<div class="q-foot__left">
							${state.current > 0 ? `<button type="button" class="btn btn--ghost" id="btn-prev" title="Перейти к предыдущему заданию">← Назад</button>` : ''}
						</div>
						<div class="q-foot__right">
							<button type="button" class="btn btn--ghost" id="btn-clear">Очистить</button>
							<button type="button" class="btn btn--blue" id="btn-next">${state.current===QCOUNT-1?'К завершению →':'Следующее →'}</button>
						</div>
					</div>
				`;
				wireQuestion(q);
			}

			function taskTypeLabel(q) {
				switch(q.type) {
					case 'single': return 'один ответ';
					case 'multi': return q.pickCount ? `выбор ${q.pickCount}-х` : 'несколько ответов';
					case 'input': return q.textAnswer ? 'текст' : 'число';
					case 'match': return 'соответствие';
					case 'open': return 'развёрнутый ответ';
					case 'written': return `развёрнутый ответ · до ${q.maxPoints || 3} баллов`;
				}
				return '';
			}

			function wireQuestion(q) {
				// flag
				document.getElementById('btn-flag').addEventListener('click', () => {
					state.flagged[q.id] = !state.flagged[q.id];
					saveState();
					renderAll();
				});
				// prev / next
				const btnPrev = document.getElementById('btn-prev');
				if (btnPrev) {
					btnPrev.addEventListener('click', () => {
						if (state.current > 0) { state.current--; saveState(); renderAll(); }
					});
				}
				document.getElementById('btn-next').addEventListener('click', () => {
					if (state.current < QCOUNT - 1) { state.current++; saveState(); renderAll(); }
					else { finishTest(); }
				});
				document.getElementById('btn-clear').addEventListener('click', () => {
					delete state.answers[q.id];
					saveState();
					renderAll();
				});

				// options
				if (q.type === 'single' || q.type === 'multi') {
					const isMulti = q.type === 'multi';
					elCard.querySelectorAll('.option').forEach(el => {
						el.addEventListener('click', () => {
							const id = el.dataset.id;
							if (!isMulti) {
								state.answers[q.id] = id;
							} else {
								const cur = new Set(Array.isArray(state.answers[q.id]) ? state.answers[q.id] : []);
								if (cur.has(id)) cur.delete(id);
								else {
									if (q.pickCount && cur.size >= q.pickCount) {
										// swap oldest
										const first = cur.values().next().value;
										cur.delete(first);
									}
									cur.add(id);
								}
								state.answers[q.id] = Array.from(cur);
							}
							saveState();
							renderAll();
						});
					});
				}
				else if (q.type === 'input') {
					const input = document.getElementById('ans-input');
					input.addEventListener('input', () => {
						state.answers[q.id] = input.value.trim();
						saveState();
						renderNav();
					});
				}
				else if (q.type === 'match') {
					elCard.querySelectorAll('.match__select').forEach(sel => {
						sel.addEventListener('change', () => {
							const cur = Array.isArray(state.answers[q.id]) ? [...state.answers[q.id]] : [];
							const idx = Number(sel.dataset.idx);
							cur[idx] = sel.value;
							state.answers[q.id] = cur;
							saveState();
							renderNav();
						});
					});
				}
				else if (q.type === 'written') {
					const ta = document.getElementById('ans-written');
					if (ta) {
						ta.addEventListener('input', () => {
							state.answers[q.id] = ta.value;
							saveState();
							renderNav();
						});
					}
				}
			}

			function escapeAttr(s) { return String(s).replace(/"/g,'&quot;'); }

			// ============================================================
			// TIMER
			// ============================================================
			const elTimer = document.getElementById('timer');
			const elTimerVal = document.getElementById('timer-val');
			function tickTimer() {
				if (state.finished) return;
				const elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
				const left = Math.max(0, TEST_SECONDS - elapsed);
				const h = Math.floor(left / 3600);
				const m = Math.floor((left % 3600) / 60);
				const s = left % 60;
				elTimerVal.textContent = [h, m, s].map(x => String(x).padStart(2,'0')).join(':');
				elTimer.classList.toggle('is--warning', left < 20*60 && left >= 5*60);
				elTimer.classList.toggle('is--danger', left < 5*60);
				if (left === 0) finishTest();
			}
			setInterval(tickTimer, 1000);
			tickTimer();

			// ============================================================
			// FINISH & RESULT
			// ============================================================
			function finishTest() {
				state.finished = true;
				if (!state.selfScores) state.selfScores = {};
				saveState();
				// Записываем в банк личных ошибок (только автопроверяемые)
				try {
					if (window.MistakesStore) {
						const items = QUESTIONS
							.filter(q => q.type !== 'written')
							.map(q => ({ qid: q.id, ok: checkAnswer(q).status === 'ok' }));
						window.MistakesStore.commitTestResults({ source: 'full', items });
					}
				} catch(e) {}
				// Обновляем попытки прогрессии по вариантам (порог части 1: 50%).
				// Стрик теперь считается отдельно — за выполнение дневной цели (см. chem-progress.js).
				try {
					let ok = 0, total = 0;
					QUESTIONS.forEach(q => {
						if (q.type === 'written') return;
						total++;
						if (checkAnswer(q).status === 'ok') ok++;
					});
					const ratio = total > 0 ? ok / total : 0;
					const PASS = 0.5;
					const COOLDOWN = 60 * 60 * 1000;
					const vid = activeVariant.id;
					let attempts = {};
					try { attempts = JSON.parse(localStorage.getItem('iqmo-bio-attempts') || '{}') || {}; } catch(e){}
					const cur = attempts[vid] || { attempts: 0 };
					if (ratio >= PASS) {
						// Вариант пройден — сбрасываем счётчик, обновляем стрик
						attempts[vid] = { attempts: 0, passedAt: Date.now() };
						localStorage.setItem('iqmo-bio-attempts', JSON.stringify(attempts));
					} else {
						// Провал — увеличиваем счётчик
						const newCount = (cur.attempts || 0) + 1;
						const entry = { attempts: newCount, lastFailAt: Date.now() };
						if (newCount >= 2) {
							entry.cooldownUntil = Date.now() + COOLDOWN;
							entry.attempts = 0; // сбрасываем после активации cooldown
						}
						attempts[vid] = entry;
						localStorage.setItem('iqmo-bio-attempts', JSON.stringify(attempts));
					}
				} catch(e) { console.error('progress update failed', e); }
				try {
					if (window.ChemProgress && typeof activeVariant !== 'undefined' && activeVariant) {
						const s = computeScoring();
						const part1Ratio = s.autoTotal > 0 ? s.autoPoints / s.autoTotal : 0;
						ChemProgress.recordAttempt({
							mode: 'full',
							subject: EXAM_SUBJECT,
							variantId: activeVariant.id,
							variantTitle: activeVariant.title,
							label: 'Полный вариант · ' + activeVariant.title,
							correct: s.totalPoints,
							total: s.totalMax,
							percent: s.percent,
							passedPart1: part1Ratio >= 0.5,
							items: QUESTIONS.filter(function (q) { return q.type !== 'written'; }).map(function (q) {
								return { qid: q.id, ok: checkAnswer(q).status === 'ok' };
							})
						});
					}
				} catch (e2) {}
				renderResult();
			}

			function renderResult() {
				const elTimerEl = document.getElementById('timer');
				if (elTimerEl) elTimerEl.style.display = 'none';
				const s = computeScoring();
				const hasSelf = s.selfTotal > 0;
				const selfNeedsReview = hasSelf && s.selfReviewed < s.selfTotal;

				// Статус прогрессии по части 1
				const part1Ratio = s.autoTotal > 0 ? s.autoPoints / s.autoTotal : 0;
				const passedPart1 = part1Ratio >= 0.5;
				let progressBanner = '';
				try {
					const attempts = JSON.parse(localStorage.getItem('iqmo-bio-attempts') || '{}') || {};
					const cur = attempts[activeVariant.id];
					if (passedPart1) {
						const nextV = (window.BIOLOGY_VARIANTS || []).find(v => v.id === activeVariant.id + 1 && v.status === 'ready');
						progressBanner = `
							<div class="result-hint" style="background:#e7f6ec;color:#1f6b3b;border-left:3px solid var(--green);margin-top:16px;">
								✅ Вариант пройден · <b>${s.autoPoints}/${s.autoTotal}</b> в части 1 (≥ 50%).${nextV ? ` Вариант ${nextV.id} разблокирован.` : ''}
							</div>`;
					} else if (cur && cur.cooldownUntil && cur.cooldownUntil > Date.now()) {
						const mins = Math.ceil((cur.cooldownUntil - Date.now()) / 60000);
						progressBanner = `
							<div class="result-hint" style="background:#fdecd6;color:#8a5a1c;border-left:3px solid var(--amber);margin-top:16px;">
								⏱ Две попытки подряд не дотянули до 50%. Возвращайтесь через <b>${mins} мин</b> — за это время повторите темы, где ошиблись.
							</div>`;
					} else {
						progressBanner = `
							<div class="result-hint" style="background:#fdecd6;color:#8a5a1c;border-left:3px solid var(--amber);margin-top:16px;">
								⚠️ В части 1 <b>${s.autoPoints}/${s.autoTotal}</b> — нужно минимум 50% (${Math.ceil(s.autoTotal/2)}/${s.autoTotal}). Попробуйте ещё раз.
							</div>`;
					}
				} catch(e){}

				document.querySelector('.page__main').innerHTML = `
					<div class="container">
						<div class="result-wrap">
							<div class="result-card">
								<div class="q-tag" style="justify-content:center;">Тест завершён</div>
								<div class="result-score">${s.totalPoints}<span class="result-max">&nbsp;/&nbsp;${s.totalMax}</span></div>
								<p style="color:var(--muted); font-size:14px; margin-top:6px;">Первичных баллов · ${s.percent}%</p>

								${hasSelf ? `
								<div class="result-parts">
									<div class="result-part">
										<div class="result-part__label">Часть 1 · автопроверка</div>
										<div class="result-part__score">${s.autoPoints}<small>/ ${s.autoTotal}</small></div>
										<div class="result-part__meta">Задания 1–19 · краткий ответ</div>
									</div>
									<div class="result-part is--selfcheck">
										<div class="result-part__label">Часть 2 · самопроверка</div>
										<div class="result-part__score">${s.selfPoints}<small>/ ${s.selfMax}</small></div>
										<div class="result-part__meta">${selfNeedsReview
											? `Проверено ${s.selfReviewed} из ${s.selfTotal} — <b>откройте разбор</b>`
											: `Все ${s.selfTotal} задания проверены`}</div>
									</div>
								</div>
								` : `<div class="result-grade">Все задания проверены автоматически</div>`}

								<div class="result-breakdown">
									<div class="rb-item"><div class="rb-num">${QCOUNT}</div><div class="rb-label">всего заданий</div></div>
									<div class="rb-item"><div class="rb-num">${s.autoDone}</div><div class="rb-label">отвечено (ч.1)</div></div>
									<div class="rb-item"><div class="rb-num">${s.autoPoints}</div><div class="rb-label">правильно (ч.1)</div></div>
								</div>

								${selfNeedsReview ? `
									<p class="result-hint" style="background:#fff8ea; color:#8a5a1c; border-left:3px solid var(--amber);">
										⚠️ В части 2 есть непроверенные задания. Откройте разбор, сверьтесь с эталоном и поставьте баллы — итог обновится автоматически.
									</p>
								` : `
									<p class="result-hint">Часть 1 проверена автоматически, часть 2 — по эталону с критериями. В реальном ОГЭ также есть задание №23 (практическая работа в лаборатории) — в тренажёре оно пропущено.</p>
								`}

								${progressBanner}

								<div style="margin-top:24px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
									<button type="button" class="btn btn--blue" id="btn-review">${selfNeedsReview ? 'Перейти к самопроверке →' : 'Посмотреть разбор'}</button>
									<button type="button" class="btn btn--ghost" id="btn-restart">Пройти заново</button>
									<a href="./full-test-biology.html" class="btn btn--ghost">← К вариантам</a>
								</div>
							</div>
						</div>
					</div>
				`;

				document.getElementById('btn-review').addEventListener('click', () => renderReview(selfNeedsReview ? 'part2' : 'all'));
				document.getElementById('btn-restart').addEventListener('click', () => {
					if (confirm('Начать заново? Все ответы будут удалены.')) {
						try { localStorage.removeItem(LS_KEY); } catch(e){}
						location.reload();
					}
				});
			}

			function computeScoring() {
				let autoPoints = 0, autoDone = 0, autoTotal = 0;
				let selfPoints = 0, selfMax = 0, selfReviewed = 0, selfTotal = 0;
				QUESTIONS.forEach(q => {
					if (q.type === 'written') {
						selfTotal++;
						const r = checkAnswer(q);
						selfPoints += r.earned || 0;
						selfMax += r.max || 0;
						if (r.reviewed) selfReviewed++;
					} else {
						autoTotal++;
						const res = checkAnswer(q);
						if (res.status !== 'skip') autoDone++;
						if (res.status === 'ok') autoPoints++;
					}
				});
				const totalPoints = autoPoints + selfPoints;
				const totalMax = autoTotal + selfMax;
				const percent = totalMax > 0 ? Math.round(totalPoints / totalMax * 100) : 0;
				return { autoPoints, autoDone, autoTotal, selfPoints, selfMax, selfReviewed, selfTotal, totalPoints, totalMax, percent };
			}

			function checkAnswer(q) {
				const given = state.answers[q.id];
				const correct = q.correct;
				if (q.type === 'written') {
					// Не автопроверяется. Статус «selfcheck» с баллами из state.selfScores.
					const scores = (state.selfScores && state.selfScores[q.id]) || {};
					const earned = (q.criteria || []).reduce((s, c) => s + (scores[c.id] ? (c.points || 0) : 0), 0);
					const reviewed = !!(state.selfScores && state.selfScores[q.id] && state.selfScores[q.id].__reviewed);
					return { status: 'selfcheck', given, reviewed, earned, max: q.maxPoints || (q.criteria||[]).reduce((s,c)=>s+(c.points||0),0) };
				}
				const isEmpty = given === undefined || given === '' ||
					(Array.isArray(given) && given.filter(x => x).length === 0);
				if (isEmpty) return { status: 'skip', given, correct };
				let ok = false;
				if (Array.isArray(correct)) {
					if (q.type === 'match') {
						const g = Array.isArray(given) ? given.map(x => x || '').join(',') : '';
						const c = correct.join(',');
						ok = g === c;
					} else {
						const g = (Array.isArray(given) ? [...given] : []).sort().join(',');
						const c = [...correct].sort().join(',');
						ok = g === c;
					}
				} else {
					ok = String(given).trim().toLowerCase() === String(correct).trim().toLowerCase();
				}
				return { status: ok ? 'ok' : 'wrong', given, correct };
			}

			function formatAnswer(q, val) {
				if (val === undefined || val === '' || (Array.isArray(val) && val.filter(x => x).length === 0)) {
					return '<span>нет ответа</span>';
				}
				if (q.type === 'match') {
					const arr = Array.isArray(val) ? val : [];
					return q.matchLeft.map((l, i) => `${l.letter}→${arr[i] || '—'}`).join(', ');
				}
				if (q.type === 'multi') {
					const arr = Array.isArray(val) ? [...val].sort() : [];
					return arr.join('');
				}
				return String(val);
			}

			function renderReview(filter) {
				const elTimerEl = document.getElementById('timer');
				if (elTimerEl) elTimerEl.style.display = 'none';
				const scoring = computeScoring();

				const items = QUESTIONS.map((q, idx) => ({ q, idx, res: checkAnswer(q) }));
				const filtered = items.filter(it => {
					if (filter === 'wrong') return it.res.status === 'wrong' || it.res.status === 'skip';
					if (filter === 'ok')    return it.res.status === 'ok';
					if (filter === 'part2') return it.q.type === 'written';
					return true;
				});

				const cls = { ok: 'is--ok', wrong: 'is--wrong', skip: 'is--skip', selfcheck: 'sc-card' };
				const lbl = { ok: 'Правильно', wrong: 'Ошибка', skip: 'Пропущено', selfcheck: 'Самопроверка' };

				const listHtml = filtered.length === 0
					? `<div class="review-item"><div class="review-item__body" style="text-align:center; color:var(--muted);">В этой категории заданий нет.</div></div>`
					: filtered.map(({ q, idx, res }) => {
						if (q.type === 'written') return renderSelfCheckItem(q, idx, res);
						const yourVal = formatAnswer(q, res.given);
						const corrVal = formatAnswer(q, res.correct);
						const yourCls = res.status === 'ok' ? 'is--correct'
										: res.status === 'skip' ? 'is--muted' : 'is--wrong';
						return `
							<article class="review-item ${cls[res.status]}">
								<div class="review-item__head">
									<span class="review-item__num">${idx + 1}</span>
									<span class="review-item__title">${q.title}</span>
									<span class="review-item__badge">${lbl[res.status]}</span>
								</div>
								<div class="review-item__body">${q.body}</div>
								<div class="review-answers">
									<div class="review-answer ${yourCls}">
										<span class="review-answer__label">Ваш ответ</span>
										<span class="review-answer__value">${yourVal}</span>
									</div>
									<div class="review-answer is--correct">
										<span class="review-answer__label">Правильный ответ</span>
										<span class="review-answer__value">${corrVal}</span>
									</div>
								</div>
								${q.hint ? `
									<div class="review-hint">
										<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
										<div><b>Разбор.</b> ${q.hint}</div>
									</div>
								` : ''}
							</article>
						`;
					}).join('');

				const wrongCount = items.filter(i => i.q.type !== 'written' && i.res.status !== 'ok').length;
				const okCount = items.filter(i => i.q.type !== 'written' && i.res.status === 'ok').length;
				const part2Count = items.filter(i => i.q.type === 'written').length;

				const tp = scoring.totalPoints, tm = scoring.totalMax;

				document.querySelector('.page__main').innerHTML = `
					<div class="container" style="padding-top: 18px; padding-bottom: 48px;">
						<div class="review-head">
							<div>
								<div class="review-head__score"><b>${tp}</b><span>/ ${tm} · ${scoring.percent}%</span></div>
								<div class="review-head__meta">Часть 1: <b>${scoring.autoPoints}/${scoring.autoTotal}</b> · Часть 2 (самопроверка): <b>${scoring.selfPoints}/${scoring.selfMax}</b> ${scoring.selfReviewed < scoring.selfTotal ? `· <span style="color:#8a5a1c;">непроверено ${scoring.selfTotal - scoring.selfReviewed}</span>` : ''}</div>
							</div>
							<div class="review-filter">
								<button type="button" data-f="all"   class="${filter==='all'?'is--on':''}">Все · ${items.length}</button>
								<button type="button" data-f="wrong" class="${filter==='wrong'?'is--on':''}">Ошибки · ${wrongCount}</button>
								<button type="button" data-f="ok"    class="${filter==='ok'?'is--on':''}">Правильно · ${okCount}</button>
								${part2Count > 0 ? `<button type="button" data-f="part2" class="${filter==='part2'?'is--on':''}">Часть 2 · ${part2Count}</button>` : ''}
							</div>
							<div class="review-actions">
								<button type="button" class="btn btn--ghost" id="btn-back-summary">← К сводке</button>
								<button type="button" class="btn btn--blue" id="btn-restart-2">Пройти заново</button>
							</div>
						</div>
						<div class="review-list">${listHtml}</div>
						${part2Count > 0 ? `
							<div class="sc-note">
								📋 В реальном ОГЭ также есть <b>задание №23</b> — практическая работа в лаборатории (оксиды, соли, наблюдения). В онлайн-тренажёре оно пропущено. Рекомендуем отработать его со школьным учителем или в видео-демонстрациях.
							</div>
						` : ''}
					</div>
				`;

				document.querySelectorAll('.review-filter button').forEach(b => {
					b.addEventListener('click', () => renderReview(b.dataset.f));
				});
				document.getElementById('btn-back-summary').addEventListener('click', renderResult);
				document.getElementById('btn-restart-2').addEventListener('click', () => {
					if (confirm('Начать заново? Все ответы будут удалены.')) {
						try { localStorage.removeItem(LS_KEY); } catch(e){}
						location.reload();
					}
				});

				// wire self-check checkboxes
				document.querySelectorAll('.sc-criterion input[type="checkbox"]').forEach(cb => {
					cb.addEventListener('change', () => {
						const qid = Number(cb.dataset.qid);
						const cid = cb.dataset.cid;
						if (!state.selfScores) state.selfScores = {};
						if (!state.selfScores[qid]) state.selfScores[qid] = {};
						state.selfScores[qid][cid] = cb.checked;
						state.selfScores[qid].__reviewed = true;
						saveState();
						renderReview(filter); // re-render to update totals
					});
				});
			}

			function renderSelfCheckItem(q, idx, res) {
				const given = res.given || '';
				const answerHtml = given.trim()
					? `<div class="sc-your-answer">${String(given).replace(/</g,'&lt;')}</div>`
					: `<div class="sc-your-answer is--empty">Вы не записали решение в тренажёре.</div>`;
				const scores = (state.selfScores && state.selfScores[q.id]) || {};
				const earned = res.earned;
				const reviewed = res.reviewed;
				const badge = reviewed
					? `<span class="review-item__badge" style="background:#eaf0fb;color:#2b4a86;">Оценено: ${earned}/${res.max}</span>`
					: `<span class="review-item__badge" style="background:#fdecd6;color:#8a5a1c;">Требует проверки</span>`;

				const critHtml = (q.criteria || []).map(c => `
					<label class="sc-criterion ${scores[c.id] ? 'is--checked' : ''}">
						<input type="checkbox" data-qid="${q.id}" data-cid="${c.id}" ${scores[c.id] ? 'checked' : ''} />
						<span class="sc-criterion__body">${c.label}</span>
						<span class="sc-criterion__pts">+${c.points} балл${c.points === 1 ? '' : 'а'}</span>
					</label>
				`).join('');

				return `
					<article class="review-item sc-card">
						<div class="review-item__head">
							<span class="review-item__num">${idx + 1}</span>
							<span class="review-item__title"><span class="part-banner">Часть 2</span>${q.title}</span>
							${badge}
						</div>
						<div class="review-item__body">${q.body}</div>
						${answerHtml}
						<div class="sc-solution">
							<b>Эталонное решение</b>
							${q.solution || '<p style="margin-top:6px;">Эталон будет добавлен вместе с условием.</p>'}
						</div>
						<div class="sc-criteria">
							<div class="sc-criteria__title">Критерии · отметьте, что выполнено в вашем решении</div>
							${critHtml}
							<div class="sc-total">
								<span>Итого по заданию</span>
								<b>${earned} / ${res.max}</b>
							</div>
						</div>
					</article>
				`;
			}

			// quit
			document.getElementById('btn-quit-exam').addEventListener('click', () => {
				if (confirm('Прервать вариант? Ответы сохранятся, вы сможете вернуться.')) {
					window.location.href = './full-test-biology.html';
				}
			});
			document.getElementById('btn-finish').addEventListener('click', () => {
				const answered = QUESTIONS.filter(q => isAnswered(q.id)).length;
				const msg = answered < QUESTIONS.length
					? `Вы ответили на ${answered} из ${QUESTIONS.length} доступных заданий. Завершить тест?`
					: 'Завершить тест?';
				if (confirm(msg)) finishTest();
			});

			// init
			function renderAll() { renderNav(); renderQuestion(); }
			if (state.finished) renderResult();
			else renderAll();
			})(); // end runApp

			// ============================================================
			// VARIANT PICKER (only used when ?v is missing/invalid)
			// ============================================================
			// ---- linear progression helpers ----
			const STREAK_KEY = 'iqmo-bio-streak';
			const ATTEMPTS_KEY = 'iqmo-bio-attempts'; // { [vid]: { attempts: n, lastFailAt: ts, cooldownUntil: ts } }

			function loadAttempts() {
				try { return JSON.parse(localStorage.getItem(ATTEMPTS_KEY) || '{}') || {}; }
				catch(e){ return {}; }
			}
			function loadStreak() {
				try { return JSON.parse(localStorage.getItem(STREAK_KEY) || 'null') || { days: 0, lastDay: null }; }
				catch(e){ return { days: 0, lastDay: null }; }
			}
			function dayKey(ts) {
				const d = new Date(ts);
				return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
			}
			function computeStreakStatus(streak) {
				// Returns { days, todayDone, broken }
				const today = dayKey(Date.now());
				const yesterday = dayKey(Date.now() - 86400000);
				if (!streak.lastDay) return { days: 0, todayDone: false };
				if (streak.lastDay === today) return { days: streak.days, todayDone: true };
				if (streak.lastDay === yesterday) return { days: streak.days, todayDone: false };
				return { days: 0, todayDone: false, broken: true };
			}

			function getVariantResult(v) {
				// returns { passed, ok, total, ratio, inProgress } or null
				try {
					const raw = localStorage.getItem('iqmo-bio-v-' + v.id);
					if (!raw) return null;
					const s = JSON.parse(raw);
					if (!s) return null;
					const bank = window.BIOLOGY_QUESTIONS || [];
					let ok = 0, total = 0;
					(v.qids || []).forEach(qid => {
						const q = bank.find(b => b.id === qid);
						if (!q || q.type === 'written') return; // только часть 1 для порога
						total++;
						const given = s.answers ? s.answers[q.id] : undefined;
						if (checkAnswerStatic(q, given) === 'ok') ok++;
					});
					const ratio = total > 0 ? ok / total : 0;
					if (s.finished) {
						return { passed: ratio >= PASS_THRESHOLD, ok, total, ratio };
					}
					if (s.answers && Object.keys(s.answers).length > 0) {
						return { inProgress: true, ok, total, ratio };
					}
					return null;
				} catch(e){ return null; }
			}

			function msToHMS(ms) {
				if (ms <= 0) return '0 мин';
				const m = Math.ceil(ms / 60000);
				if (m < 60) return m + ' мин';
				const h = Math.floor(m / 60), mm = m % 60;
				return h + ' ч ' + (mm ? mm + ' мин' : '').trim();
			}

			function renderVariantPicker() {
				const picker = document.getElementById('variant-picker');
				const testRoot = document.getElementById('test-root');
				if (testRoot) testRoot.style.display = 'none';
				const timerEl = document.getElementById('timer');
				if (timerEl) timerEl.style.display = 'none';
				const quitBtn = document.getElementById('btn-quit-exam');
				if (quitBtn) quitBtn.style.display = 'none';
				const pb = document.getElementById('pb-fill');
				if (pb) pb.parentElement.style.display = 'none';
				if (!picker) return;
				picker.style.display = 'block';

				const variants = window.BIOLOGY_VARIANTS || [];
				const attempts = loadAttempts();
				const streak = loadStreak();
				const streakStatus = computeStreakStatus(streak);

				// Определяем статус каждого варианта: passed / current / locked / cooldown / coming
				let firstNotPassedIdx = -1;
				const readyVariants = variants.filter(v => v.status === 'ready');
				const variantInfos = variants.map((v, idx) => {
					const info = { v, idx };
					if (v.status !== 'ready') { info.state = 'coming'; return info; }
					const res = getVariantResult(v);
					info.res = res;
					if (res && res.passed) info.state = 'passed';
					else info.state = 'pending'; // will be narrowed to current/locked
					return info;
				});
				// find first non-passed ready variant
				for (let i = 0; i < variantInfos.length; i++) {
					const vi = variantInfos[i];
					if (vi.state === 'pending') { firstNotPassedIdx = i; break; }
				}
				// Assign current/locked
				variantInfos.forEach((vi, i) => {
					if (vi.state !== 'pending') return;
					if (DEV_UNLOCK_ALL) {
						// В dev-режиме все готовые варианты доступны
						vi.state = (i === firstNotPassedIdx) ? 'current' : 'pending-open';
						return;
					}
					if (i === firstNotPassedIdx) {
						// check cooldown
						const att = attempts[vi.v.id];
						if (att && att.cooldownUntil && att.cooldownUntil > Date.now()) {
							vi.state = 'cooldown';
							vi.cooldownLeft = att.cooldownUntil - Date.now();
						} else {
							vi.state = 'current';
						}
					} else {
						vi.state = 'locked';
					}
				});

				const passedCount = variantInfos.filter(x => x.state === 'passed').length;
				const readyCount = readyVariants.length;
				const inProgressCount = variantInfos.filter(x => (x.state === 'current' || x.state === 'cooldown') && x.res && x.res.inProgress).length;

				/**
				 * Состав сетки вариантов:
				 *   1) Все ранее пройденные — чтобы ученик мог вернуться, разобрать ошибки
				 *      и пересдать (раньше пройденные исчезали из UI, и до них было не добраться).
				 *   2) Текущий (next-not-passed) и следующий за ним «локед» — фокус на сегодня.
				 *   3) Если все варианты ready и пройдены, добавим первый «coming» + пару следующих.
				 */
				const visibleSet = new Set();
				variantInfos.forEach((vi, i) => {
					if (vi.state === 'passed') visibleSet.add(i);
				});
				if (firstNotPassedIdx >= 0) {
					visibleSet.add(firstNotPassedIdx);
					if (firstNotPassedIdx + 1 < variantInfos.length) visibleSet.add(firstNotPassedIdx + 1);
				} else {
					for (let j = 0; j < variantInfos.length; j++) {
						if (variantInfos[j].state === 'coming') {
							visibleSet.add(j);
							if (j + 1 < variantInfos.length) visibleSet.add(j + 1);
							break;
						}
					}
				}
				const variantInfosVisible = Array.from(visibleSet).sort((a, b) => a - b).map(i => variantInfos[i]);
				// Сетка переключается между «парой» и полным гридом: при <=2 плиток держим компактный
				// pair-вид (как раньше), при пройденных вариантах раскрываем во всю ширину.
				const variantsGridCls = variantInfosVisible.length <= 2
					? 'vp-grid vp-grid--pair' + (variantInfosVisible.length === 1 ? ' vp-grid--single' : '')
					: 'vp-grid';
				const variantsHintHtml = passedCount > 0
					? `Пройденные варианты остаются здесь — кликните, чтобы пересдать или разобрать ошибки. Следующий новый откроется после ≥ <b>50%</b> в части 1 текущего.`
					: `Показаны два ближайших варианта — тот, до которого вы дошли по порядку, и следующий. Остальные появятся после прохождения с <b>≥ 50%</b> в части 1.`;

				const streakHtml = streakStatus.days > 0
					? `<div class="vp-streak"><span class="vp-streak__flame">🔥</span>Серия: <b>${streakStatus.days}</b> ${streakStatus.days === 1 ? 'день' : 'дн.'} подряд${streakStatus.todayDone ? ' · сегодня ✓' : ''}</div>`
					: `<div class="vp-streak" style="background:#f7f8fb;border-color:var(--line);color:var(--muted);"><span class="vp-streak__flame">🔥</span>Начните серию — пройдите вариант сегодня</div>`;

				picker.innerHTML = `
					<div class="vp-hero">
						<div>
							<a href="./subject-biology.html" class="vp-back">← К предмету</a>
							<div class="vp-hero__title">Полный вариант ОГЭ · Биология</div>
							<div class="vp-hero__sub">Проходите варианты по порядку. Следующий откроется, когда наберёте <b>≥ 50%</b> правильных ответов в части 1 текущего варианта.</div>
							${streakHtml}
						</div>
						<div class="vp-stats">
							<div><b>${variants.length}</b>всего</div>
							<div><b>${passedCount}</b>пройдено</div>
							<div><b>${inProgressCount}</b>в процессе</div>
						</div>
					</div>

					<div class="vp-section-title">Варианты</div>
					<p class="vp-section-hint">${variantsHintHtml}</p>
					<div class="${variantsGridCls}">
						${variantInfosVisible.length ? variantInfosVisible.map(vi => {
							const v = vi.v;
							let cls = '', statusHtml = '', badgeHtml = '', lockHtml = '', disabled = false;
							if (vi.state === 'coming') {
								cls = 'is--coming'; disabled = true;
								statusHtml = `<span class="vp-tile__dot"></span>Скоро`;
							} else if (vi.state === 'passed') {
								cls = 'is--passed';
								const okPart = vi.res ? `${vi.res.ok}/${vi.res.total}` : '';
								statusHtml = `<span class="vp-tile__dot"></span><span class="vp-tile__score">${okPart}</span>`;
								if (vi.res && vi.res.ok === vi.res.total) badgeHtml = `<span class="vp-tile__badge">100%</span>`;
							} else if (vi.state === 'current') {
								cls = 'is--current';
								if (vi.res && vi.res.inProgress) {
									statusHtml = `<span class="vp-tile__dot" style="background:var(--amber)"></span>В процессе`;
								} else {
									const att = attempts[v.id];
									if (att && att.attempts > 0) {
										statusHtml = `<span class="vp-tile__dot" style="background:var(--red)"></span>Попытка ${att.attempts + 1}`;
									} else {
										statusHtml = `<span class="vp-tile__dot" style="background:var(--accent)"></span>Доступен сейчас`;
									}
								}
							} else if (vi.state === 'pending-open') {
								cls = 'is--pending-open';
								statusHtml = `<span class="vp-tile__dot" style="background:var(--accent)"></span>Dev · открыт`;
							} else if (vi.state === 'cooldown') {
								cls = 'is--cooldown'; disabled = true;
								lockHtml = `<span class="vp-tile__lock">⏱</span>`;
								statusHtml = `<span class="vp-tile__dot"></span>Через ${msToHMS(vi.cooldownLeft)}`;
							} else if (vi.state === 'locked') {
								cls = 'is--locked'; disabled = true;
								lockHtml = `<span class="vp-tile__lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>`;
								statusHtml = `<span class="vp-tile__dot"></span>Заблокирован`;
							}
							return `
								<button type="button" class="vp-tile ${cls}" data-v="${v.id}" data-state="${vi.state}" ${disabled?'disabled':''}>
									${badgeHtml}${lockHtml}
									<div class="vp-tile__num">${v.id}</div>
									<div class="vp-tile__label">${v.title}</div>
									<div class="vp-tile__status">${statusHtml}</div>
								</button>
							`;
						}).join('') : '<p class="vp-section-hint" style="margin:0;grid-column:1/-1">Нет вариантов для отображения.</p>'}
					</div>
				`;

				picker.querySelectorAll('.vp-tile[data-v]').forEach(btn => {
					btn.addEventListener('click', () => {
						if (btn.disabled) return;
						const state = btn.dataset.state;
						const v = btn.dataset.v;
						if (state === 'locked') {
							alert('Чтобы открыть этот вариант, пройдите предыдущие.');
							return;
						}
						if (state === 'cooldown') {
							alert('После двух провальных попыток вариант временно закрыт. Отдохните и повторите задания.');
							return;
						}
						window.location.search = '?v=' + v;
					});
				});
			}

			function buildRandomVariant() {
				// deprecated — linear progression only
				return null;
			}

			function getAttemptIndex(vid) {
				try {
					const attempts = JSON.parse(localStorage.getItem('iqmo-bio-attempts') || '{}') || {};
					const cur = attempts[vid];
					return cur ? (cur.attempts || 0) : 0;
				} catch(e){ return 0; }
			}
			function seededShuffle(arr, seed) {
				// mulberry32
				let t = seed >>> 0;
				function rnd() {
					t += 0x6D2B79F5;
					let r = Math.imul(t ^ (t >>> 15), 1 | t);
					r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
					return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
				}
				const a = arr.slice();
				for (let i = a.length - 1; i > 0; i--) {
					const j = Math.floor(rnd() * (i + 1));
					[a[i], a[j]] = [a[j], a[i]];
				}
				return a;
			}

			function checkAnswerStatic(q, given) {
				const correct = q.correct;
				const isEmpty = given === undefined || given === '' ||
					(Array.isArray(given) && given.filter(x => x).length === 0);
				if (isEmpty) return 'skip';
				if (Array.isArray(correct)) {
					if (q.type === 'match') {
						const g = Array.isArray(given) ? given.map(x => x || '').join(',') : '';
						return g === correct.join(',') ? 'ok' : 'wrong';
					}
					const g = (Array.isArray(given) ? [...given] : []).sort().join(',');
					const c = [...correct].sort().join(',');
					return g === c ? 'ok' : 'wrong';
				}
				return String(given).trim().toLowerCase() === String(correct).trim().toLowerCase() ? 'ok' : 'wrong';
			}
		</script>
	</body>
