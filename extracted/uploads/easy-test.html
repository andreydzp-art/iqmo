		<!-- chemistry bank (важно: страница лежит в /uploads, поэтому используем ../) -->

		<script>
			(function () {
				const N = 10;
				const ALL = window.CHEMISTRY_QUESTIONS || [];
				const CATS = window.CHEMISTRY_CATEGORIES || [];

				function getParams() {
					const sp = new URLSearchParams(location.search || '');
					return {
						mode: sp.get('mode') || '',
						path: sp.get('path') || '',
						goal: sp.get('goal') || '',
						term: sp.get('term') || '',
						kind: sp.get('kind') || ''
					};
				}

				function shuffle(arr) {
					const a = arr.slice();
					for (let i = a.length - 1; i > 0; i--) {
						const j = Math.floor(Math.random() * (i + 1));
						[a[i], a[j]] = [a[j], a[i]];
					}
					return a;
				}

				function clampInt(n, min, max, fallback) {
					const x = Number(n);
					if (!Number.isFinite(x)) return fallback;
					return Math.max(min, Math.min(max, Math.trunc(x)));
				}

				function getExpressDayIndex(key) {
					try {
						const raw = localStorage.getItem(key);
						const now = Date.now();
						if (!raw) {
							localStorage.setItem(key, JSON.stringify({ start: now }));
							return 0;
						}
						const data = JSON.parse(raw);
						const start = Number(data && data.start);
						if (!Number.isFinite(start) || start <= 0) {
							localStorage.setItem(key, JSON.stringify({ start: now }));
							return 0;
						}
						return Math.max(0, Math.floor((now - start) / 86400000));
					} catch (e) {
						return 0;
					}
				}

				function pickFromCats(chosenCats, perCatCounts, byId) {
					const chosen = [];
					const used = new Set();

					for (let i = 0; i < chosenCats.length; i++) {
						const cat = chosenCats[i];
						const k = perCatCounts[i] || 0;
						if (!cat || !k) continue;

						const qids = shuffle(cat.qids || []);
						let added = 0;
						for (const qid of qids) {
							if (added >= k) break;
							if (used.has(qid)) continue;
							const q = byId.get(qid);
							if (!q) continue;
							used.add(qid);
							chosen.push(q);
							added++;
						}
						if (chosen.length >= N) break;
					}

					if (chosen.length < N) {
						for (const q of shuffle(ALL)) {
							if (chosen.length >= N) break;
							if (used.has(q.id)) continue;
							used.add(q.id);
							chosen.push(q);
						}
					}

					return chosen.slice(0, N);
				}

				function pickMixed() {
					const byId = new Map(ALL.map(q => [q.id, q]));
					const readyCats = CATS.filter(c => c && c.status === 'ready' && Array.isArray(c.qids) && c.qids.length);
					const chosen = [];
					const used = new Set();

					for (const cat of shuffle(readyCats).slice(0, N)) {
						const qids = shuffle(cat.qids);
						let picked = null;
						for (const qid of qids) {
							if (used.has(qid)) continue;
							const q = byId.get(qid);
							if (!q) continue;
							used.add(qid);
							picked = q;
							break;
						}
						if (picked) chosen.push(picked);
						if (chosen.length >= N) break;
					}

					if (chosen.length < N) {
						for (const q of shuffle(ALL)) {
							if (chosen.length >= N) break;
							if (used.has(q.id)) continue;
							used.add(q.id);
							chosen.push(q);
						}
					}

					return chosen.slice(0, N);
				}

				function pickExpress(params) {
					const byId = new Map(ALL.map(q => [q.id, q]));
					const readyCats = CATS
						.filter(c => c && c.status === 'ready' && Array.isArray(c.qids) && c.qids.length)
						.slice()
						.sort((a, b) => (a.id || 0) - (b.id || 0));

					const g = clampInt(params.goal, 3, 5, 3);
					const len = readyCats.length || 0;
					const takeRatio = g === 3 ? 0.65 : (g === 4 ? 0.85 : 1);
					const subsetLen = Math.max(1, Math.min(len, Math.ceil(len * takeRatio)));
					const subset = readyCats.slice(0, subsetLen);

					const term = params.term || '6w';
					const targetCats = term === '2w' ? 5 : (term === '2m' ? 10 : 8);
					const m = Math.max(1, Math.min(targetCats, subset.length, N));

					let chosenCats = [];
					if ((params.kind || '') === 'today') {
						const key = `iqmo_express_start_${g}_${term}`;
						const day = getExpressDayIndex(key);
						const start = (day * m) % subset.length;
						for (let i = 0; i < m; i++) chosenCats.push(subset[(start + i) % subset.length]);
					} else {
						chosenCats = shuffle(subset).slice(0, m);
					}

					// Распределяем 10 вопросов по выбранным категориям.
					const perCat = new Array(chosenCats.length).fill(1);
					let remain = N - perCat.length;
					let rr = 0;
					while (remain > 0 && perCat.length) {
						perCat[rr % perCat.length]++;
						rr++;
						remain--;
					}

					return pickFromCats(chosenCats, perCat, byId);
				}

				const params = getParams();
				const isExpress = (params.path || '') === 'express';
				const headerTag = isExpress
					? `Экспресс: цель ${params.goal || '3'} · срок ${params.term || '6w'} · ${params.kind === 'control' ? 'проверка' : 'сегодня'}`
					: 'Случайные темы';
				const finalNote = isExpress
					? 'Подборка составлена по параметрам экспресс‑подготовки (категории зависят от цели, срока и режима).'
					: 'Вопросы выбираются случайно из разных тем химии.';

				const state = {
					questions: isExpress ? pickExpress(params) : pickMixed(),
					current: 0,
					given: null,
					checked: false,
					correct: false,
					results: []
				};
				try {
					if (window.ChemProgress && typeof ChemProgress.beginAttempt === 'function') {
						ChemProgress.beginAttempt({
							mode: 'quick',
							subject: 'chemistry',
							label: headerTag,
							totalQuestions: state.questions.length
						});
					}
				} catch (eA) {}

				const elStage = document.getElementById('stage');
				const elChips = document.getElementById('chips');

				function renderChips() {
					elChips.innerHTML = '';
					for (let i = 0; i < N; i++) {
						const chip = document.createElement('span');
						chip.className = 'chip';
						const r = state.results[i];
						if (r) chip.classList.add(r.ok ? 'is--ok' : 'is--wrong');
						else if (i === state.current) chip.classList.add('is--current');
						elChips.appendChild(chip);
					}
				}

				function checkAnswer(q, given) {
					if (given === null || given === undefined || given === '' ||
						(Array.isArray(given) && given.filter(x => x).length === 0)) return false;
					const correct = q.correct;
					if (Array.isArray(correct)) {
						if (q.type === 'match') {
							const g = (Array.isArray(given) ? given : []).map(x => x || '').join(',');
							return g === correct.join(',');
						}
						const g = (Array.isArray(given) ? [...given] : []).sort().join(',');
						return g === [...correct].sort().join(',');
					}
					return String(given).trim().toLowerCase() === String(correct).trim().toLowerCase();
				}

				function formatCorrect(q) {
					if (q.type === 'match') return q.matchLeft.map((l, i) => `${l.letter} → ${q.correct[i]}`).join(', ');
					if (Array.isArray(q.correct)) return [...q.correct].sort().join('');
					return String(q.correct);
				}

				function isGivenNonEmpty(q) {
					const g = state.given;
					if (g === null || g === undefined || g === '') return false;
					if (Array.isArray(g)) {
						if (q.type === 'match') return g.filter(Boolean).length === q.matchLeft.length;
						return g.filter(Boolean).length > 0;
					}
					return true;
				}

				function updateCheckBtn() {
					const btn = document.getElementById('btn-check');
					if (!btn) return;
					const q = state.questions[state.current];
					btn.disabled = !isGivenNonEmpty(q);
				}

				function renderFinal() {
					const ok = state.results.filter(r => r && r.ok).length;
					const items = state.results
						.filter(function (r) {
							return r && typeof r.qid === 'number';
						})
						.map(function (r) {
							return { qid: r.qid, ok: !!r.ok };
						});
					if (window.ChemProgress) {
						try {
							ChemProgress.recordAttempt({
								mode: 'quick',
								subject: 'chemistry',
								label: 'Быстрый тест',
								correct: ok,
								total: N,
								items: items
							});
						} catch (e) {}
					}
					if (window.MistakesStore && items.length) {
						try {
							MistakesStore.commitTestResults({ source: 'quick', items: items });
						} catch (e2) {}
					}
					elStage.innerHTML = `
						<div class="q-card">
							<div class="final">
								<h1 class="final__title">Быстрый тест завершён</h1>
								<div class="final__score">${ok}<span> / ${N}</span></div>
								<p class="final__note">${finalNote}</p>
								<div class="final__actions">
									<button type="button" class="btn btn--primary" id="btn-again">Ещё ${N} вопросов →</button>
									<a href="../subject-chemistry.html" class="btn btn--ghost">К предмету</a>
								</div>
							</div>
						</div>
					`;
					elChips.innerHTML = '';
					state.results.forEach(r => {
						const chip = document.createElement('span');
						chip.className = 'chip ' + (r.ok ? 'is--ok' : 'is--wrong');
						elChips.appendChild(chip);
					});
					document.getElementById('btn-again').addEventListener('click', () => location.reload());
				}

				function renderQuestion() {
					const q = state.questions[state.current];
					if (!q) return renderFinal();
					const n = state.current + 1;
					let input = '';

					if (q.type === 'single' || q.type === 'multi') {
						const pickedSet = new Set(Array.isArray(state.given) ? state.given : (state.given ? [state.given] : []));
						input = `<div class="options">
							${q.options.map(o => {
								const checked = pickedSet.has(o.id);
								let cls = 'option';
								if (checked) cls += ' is--checked';
								if (state.checked) {
									cls += ' is--locked';
									const isRight = Array.isArray(q.correct) ? q.correct.includes(o.id) : q.correct === o.id;
									if (isRight) cls += ' is--correct';
									else if (checked) cls += ' is--incorrect';
								}
								return `<label class="${cls}" data-id="${o.id}">
									<span class="option__marker">${o.id}</span>
									<span>${o.label}</span>
								</label>`;
							}).join('')}
						</div>`;
					} else if (q.type === 'input') {
						let cls = '';
						if (state.checked) cls = state.correct ? 'is--correct' : 'is--incorrect';
						input = `<div class="answer-input">
							<label for="ans">Ответ</label>
							<input id="ans" type="text" autocomplete="off"
								value="${(state.given || '').toString().replace(/"/g,'&quot;')}"
								placeholder="${q.placeholder || 'введите ответ'}"
								class="${cls}"
								${state.checked ? 'readonly' : ''} />
						</div>`;
					} else if (q.type === 'match') {
						const arr = Array.isArray(state.given) ? state.given : [];
						input = `<div class="match">
							${q.matchLeft.map((l, i) => `
								<div class="match__left"><b>${l.letter})</b> ${l.label}</div>
								<select class="match__select" data-idx="${i}" ${state.checked?'disabled':''}>
									<option value="">—</option>
									${q.matchRight.map(r => `<option value="${r.id}" ${arr[i]===r.id?'selected':''}>${r.id}) ${r.label}</option>`).join('')}
								</select>
							`).join('')}
						</div>`;
					}

					const isLast = state.current === N - 1;
					const actionBtn = !state.checked
						? `<button type="button" class="btn btn--primary" id="btn-check" disabled>Проверить</button>`
						: `<button type="button" class="btn btn--green" id="btn-next">${isLast ? 'Завершить →' : 'Следующий вопрос →'}</button>`;

					const feedback = state.checked ? `
						<div class="feedback ${state.correct ? 'feedback--ok' : 'feedback--wrong'}">
							<div class="feedback__head">${state.correct ? 'Верно!' : 'Неверно'}</div>
							${!state.correct ? `<div class="feedback__correct"><b>Правильный ответ:</b> ${formatCorrect(q)}</div>` : ''}
						</div>
					` : '';

					elStage.innerHTML = `
						<div class="q-card">
							<div class="q-top">
								<span class="q-tag">Вопрос ${n} из ${N}</span>
								<span class="q-tag">${headerTag}</span>
							</div>
							<div class="q-title">${q.title || 'Химия'}</div>
							<div class="q-body">${q.body || ''}</div>
							${input}
							${feedback}
							<div class="q-foot">${actionBtn}</div>
						</div>
					`;

					wire(q);
					renderChips();
				}

				function wire(q) {
					if (q.type === 'single' || q.type === 'multi') {
						elStage.querySelectorAll('.option').forEach(el => {
							el.addEventListener('click', () => {
								if (state.checked) return;
								const id = el.dataset.id;
								if (q.type === 'single') state.given = id;
								else {
									const cur = new Set(Array.isArray(state.given) ? state.given : []);
									if (cur.has(id)) cur.delete(id);
									else {
										if (q.pickCount && cur.size >= q.pickCount) cur.delete(cur.values().next().value);
										cur.add(id);
									}
									state.given = Array.from(cur);
								}
								renderQuestion();
							});
						});
					} else if (q.type === 'input') {
						const inp = document.getElementById('ans');
						if (inp) inp.addEventListener('input', () => { state.given = inp.value.trim(); updateCheckBtn(); });
					} else if (q.type === 'match') {
						elStage.querySelectorAll('.match__select').forEach(sel => {
							sel.addEventListener('change', () => {
								const cur = Array.isArray(state.given) ? [...state.given] : [];
								cur[Number(sel.dataset.idx)] = sel.value;
								state.given = cur;
								updateCheckBtn();
							});
						});
					}

					const btnCheck = document.getElementById('btn-check');
					if (btnCheck) {
						btnCheck.addEventListener('click', () => {
							if (!isGivenNonEmpty(q)) return;
							state.correct = checkAnswer(q, state.given);
							state.checked = true;
							state.results[state.current] = { qid: q.id, ok: state.correct };
							renderQuestion();
						});
						updateCheckBtn();
					}

					const btnNext = document.getElementById('btn-next');
					if (btnNext) {
						btnNext.addEventListener('click', () => {
							state.current++;
							state.given = null;
							state.checked = false;
							state.correct = false;
							if (state.current >= N) renderFinal();
							else renderQuestion();
						});
					}
				}

				if (!state.questions.length) {
					elStage.innerHTML = '<div class="q-card"><p>Банк вопросов по химии не загрузился.</p></div>';
					return;
				}
				renderQuestion();
			})();
		</script>
	</body>
</html>
