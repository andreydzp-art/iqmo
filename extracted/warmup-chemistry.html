				.match__select { width: 100%; min-width: 0; }
				.topbar__title { display: none; }
			}
		</style>

		<script>
			// ============================================================
			// SETUP
			// ============================================================
			const POOL = (window.CHEMISTRY_QUESTIONS || []).filter(q => q.type !== 'open');
			const QS = new URLSearchParams(window.location.search);
			const MODE = (QS.get('mode') || 'batch').toLowerCase(); // batch | infinite
			const REPEAT_WRONG = QS.get('repeatWrong') === '1';
			const CAT_ID_RAW = QS.get('cat');
			const CAT_ID = CAT_ID_RAW ? parseInt(CAT_ID_RAW, 10) : null;
			const N = (function () {
				const raw = QS.get('n');
				const v = raw ? parseInt(raw, 10) : 5;
				if (!Number.isFinite(v)) return 5;
				return Math.max(1, Math.min(40, v)); // safety cap
			})();
			let lastBatchIds = [];
			let batchNo = 1;
			const WARMUP_TOPIC_PARAM = new URLSearchParams(window.location.search).get('topic') || '';

			function startNextBatch() {
				if (MODE === 'infinite') batchNo++;
				state.questions = pickQuestions();
				state.current = 0;
				state.given = null;
				state.checked = false;
				state.correct = false;
				state.results = [];
				try {
					if (window.ChemProgress && typeof ChemProgress.beginAttempt === 'function') {
						ChemProgress.beginAttempt({
							mode: 'warmup',
							label: 'Разминка',
							subject: 'chemistry',
							totalQuestions: N,
							topicSlug: WARMUP_TOPIC_PARAM
						});
					}
				} catch (eA) {}
				renderQuestion();
			}

			function lsGet(key, fallback) {
				try {
					const raw = localStorage.getItem(key);
					if (!raw) return fallback;
					return JSON.parse(raw);
				} catch (e) { return fallback; }
			}
			function lsSet(key, value) {
				try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
			}
			function catWrongKey(catId) { return 'iqmo:chem:catWrong:' + String(catId); }
			function incCatWrong(catId, qid) {
				if (!Number.isFinite(catId)) return;
				const key = catWrongKey(catId);
				const map = lsGet(key, {});
				const k = String(qid);
				map[k] = (map[k] || 0) + 1;
				lsSet(key, map);
			}
			function getCatWrongSet(catId) {
				if (!Number.isFinite(catId)) return new Set();
				const map = lsGet(catWrongKey(catId), {});
				return new Set(Object.keys(map || {}));
			}

			function shuffle(arr) {
				const a = [...arr];
				for (let i = a.length - 1; i > 0; i--) {
					const j = Math.floor(Math.random() * (i + 1));
					[a[i], a[j]] = [a[j], a[i]];
				}
				return a;
			}

			// Pick 5 random questions, prefer tasks 1..10 (easier) but fall back to anything.
			// С ?topic=periodic | atom | bond | classes | reactions | solutions | metals | nonmetals | organic | ecology (см. chemistry-topic-map.js — WARMUP_QIDS_BY_TOPIC) — в приоритете вопросы этой темы.
			function pickQuestions() {
				const topicParam = new URLSearchParams(window.location.search).get('topic');
				const catParam = CAT_ID;

				// Category training: ?cat=1
				if (Number.isFinite(catParam) && Array.isArray(window.CHEMISTRY_CATEGORIES)) {
					const cat = window.CHEMISTRY_CATEGORIES.find(c => c && c.id === catParam);
					if (cat) {
						if (!Array.isArray(cat.qids) || !cat.qids.length) {
							return [];
						}
						const allowed = new Set(cat.qids.map(String));
						let poolCat = POOL.filter(q => allowed.has(String(q.id)));

						// Avoid immediate repeats across batches (best effort)
						if (lastBatchIds.length && poolCat.length > N) {
							const last = new Set(lastBatchIds.map(String));
							const filtered = poolCat.filter(q => !last.has(String(q.id)));
							if (filtered.length >= N) poolCat = filtered;
						}

						// Repeat mistakes more often (per-category), if enabled
						if (REPEAT_WRONG) {
							const wrongSet = getCatWrongSet(catParam);
							const poolWrong = poolCat.filter(q => wrongSet.has(String(q.id)));
							const poolNew = poolCat.filter(q => !wrongSet.has(String(q.id)));
							const targetWrong = Math.min(poolWrong.length, Math.max(0, Math.round(N * 0.4)));
							const chosen = [];
							for (const q of shuffle(poolWrong)) { if (chosen.length < targetWrong) chosen.push(q); }
							for (const q of shuffle(poolNew)) { if (chosen.length < N) chosen.push(q); }
							for (const q of shuffle(poolWrong)) { if (chosen.length < N && !chosen.includes(q)) chosen.push(q); }
							lastBatchIds = chosen.map(q => q.id);
							return chosen.slice(0, N);
						}

						const chosen = [];
						for (const q of shuffle(poolCat)) { if (chosen.length < N) chosen.push(q); }
						lastBatchIds = chosen.map(q => q.id);
						return chosen.slice(0, N);
					}
				}

				if (topicParam && window.ChemTopicMap && typeof ChemTopicMap.warmupQids === 'function') {
					const qids = ChemTopicMap.warmupQids(topicParam);
					if (qids && qids.length) {
						const themed = shuffle(POOL.filter(q => ChemTopicMap.belongsToWarmupTopic(q.id, topicParam)));
						if (themed.length > 0) {
							const chosen = [];
							for (const q of themed) {
								if (chosen.length < N) chosen.push(q);
							}
							if (chosen.length < N) {
								const restPool = shuffle(POOL.filter(q => !chosen.includes(q)));
								for (const q of restPool) {
									if (chosen.length < N) chosen.push(q);
								}
							}
							return chosen.slice(0, N);
						}
					}
				}
				if (topicParam && window.ChemTopicMap) {
					const themed = shuffle(POOL.filter(q => ChemTopicMap.get(q.id).slug === topicParam));
					if (themed.length > 0) {
						const chosen = [];
						for (const q of themed) {
							if (chosen.length < N) chosen.push(q);
						}
						if (chosen.length < N) {
							const restPool = shuffle(POOL.filter(q => !chosen.includes(q)));
							for (const q of restPool) {
								if (chosen.length < N) chosen.push(q);
							}
						}
						return chosen.slice(0, N);
					}
				}
				const easy = POOL.filter(q => q.id <= 10);
				const rest = POOL.filter(q => q.id > 10);
				const chosen = [];
				for (const q of shuffle(easy)) { if (chosen.length < N) chosen.push(q); }
				for (const q of shuffle(rest)) { if (chosen.length < N) chosen.push(q); }
				return chosen.slice(0, N);
			}

			const state = {
				questions: pickQuestions(),
				current: 0,
				given: null,     // current answer draft
				checked: false,  // has user submitted current answer
				correct: false,  // was it right?
				results: []      // [{qid, ok}]
			};
			try {
				if (window.ChemProgress && typeof ChemProgress.beginAttempt === 'function') {
					ChemProgress.beginAttempt({
						mode: 'warmup',
						label: 'Разминка',
						subject: 'chemistry',
						totalQuestions: state.questions.length,
						topicSlug: WARMUP_TOPIC_PARAM
					});
				}
			} catch (eA0) {}

			// ============================================================
			// RENDER
			// ============================================================
			const elStage = document.getElementById('stage');
			const elChips = document.getElementById('chips');

			function renderChips() {
				elChips.innerHTML = '';
				for (let i = 0; i < N; i++) {
					const chip = document.createElement('span');
					chip.className = 'chip';
					const r = state.results[i];
					if (r) chip.classList.add(r.ok ? 'is--ok' : 'is--wrong');
					else if (i === state.current) chip.classList.add('is--current');
					elChips.appendChild(chip);
				}
			}

			function checkAnswer(q, given) {
				if (given === null || given === undefined || given === '' ||
					(Array.isArray(given) && given.filter(x => x).length === 0)) return false;
				const correct = q.correct;
				if (Array.isArray(correct)) {
					if (q.type === 'match') {
						const g = (Array.isArray(given) ? given : []).map(x => x || '').join(',');
						return g === correct.join(',');
					}
					const g = (Array.isArray(given) ? [...given] : []).sort().join(',');
					return g === [...correct].sort().join(',');
				}
				return String(given).trim().toLowerCase() === String(correct).trim().toLowerCase();
			}

			function formatCorrect(q) {
				if (q.type === 'match') {
					return q.matchLeft.map((l, i) => `${l.letter} → ${q.correct[i]}`).join(', ');
				}
				if (Array.isArray(q.correct)) return [...q.correct].sort().join('');
				return String(q.correct);
			}

			function formatBody(html) {
				var S = 'display:flex;flex-direction:column;gap:8px;margin-top:6px;max-width:480px';
				var N = 'color:var(--accent);margin-right:6px';
				return html.replace(/<p>([^<]*?\d\)\s[^<]*?(?:,\s*\d\)\s|·\s*\d\)\s)[^<]*)<\/p>/g, function(m, inner) {
					var items = inner.split(/(?:,\s*|\s*·\s*)(?=\d+\)\s)/);
					if (items.length < 2) return m;
					var prefix = '';
					var first = items[0];
					var numMatch = first.match(/^(.*?)\b(\d+\)\s)/);
					if (numMatch && numMatch[1].trim()) {
						prefix = '<p>' + numMatch[1].trim() + '</p>';
						items[0] = numMatch[2] + first.substring(numMatch[0].length);
					}
					var suffix = '';
					var last = items[items.length - 1];
					var dashIdx = last.search(/\s\u2014\s|\s—\s/);
					if (dashIdx > -1) {
						suffix = '<p>' + last.substring(dashIdx).trim() + '</p>';
						items[items.length - 1] = last.substring(0, dashIdx).trim();
					}
					var divs = items.map(function(it) {
						var pm = it.match(/^(\d+)\)\s*(.*)/);
						if (!pm) return '<div>' + it + '</div>';
						return '<div><b style="' + N + '">' + pm[1] + ')</b> ' + pm[2].replace(/\.\s*$/, '') + '</div>';
					}).join('');
					return prefix + '<div style="' + S + '">' + divs + '</div>' + suffix;
				});
			}

			function renderQuestion() {
				const q = state.questions[state.current];
				if (!q) return renderFinal();

				const n = state.current + 1;
				let input = '';

				if (q.type === 'single' || q.type === 'multi') {
					const pickedSet = new Set(Array.isArray(state.given) ? state.given : (state.given ? [state.given] : []));
					input = `<div class="options" data-role="options">
						${q.options.map(o => {
							const checked = pickedSet.has(o.id);
							let cls = 'option';
							if (checked) cls += ' is--checked';
							if (state.checked) {
								cls += ' is--locked';
								const isRight = Array.isArray(q.correct) ? q.correct.includes(o.id) : q.correct === o.id;
								if (isRight) cls += ' is--correct';
								else if (checked) cls += ' is--incorrect';
							}
							return `<label class="${cls}" data-id="${o.id}">
								<span class="option__marker">${o.id}</span>
								<span>${o.label}</span>
							</label>`;
						}).join('')}
					</div>`;
				}
				else if (q.type === 'input') {
					let cls = '';
					if (state.checked) cls = state.correct ? 'is--correct' : 'is--incorrect';
					input = `<div class="answer-input">
						<label for="ans">Ответ</label>
						<input id="ans" type="text" inputmode="numeric" autocomplete="off"
							value="${(state.given || '').toString().replace(/"/g,'&quot;')}"
							placeholder="${q.placeholder || 'введите число'}"
							class="${cls}"
							${state.checked ? 'readonly' : ''} />
					</div>`;
				}
				else if (q.type === 'match') {
					const arr = Array.isArray(state.given) ? state.given : [];
					input = `<div class="match">
						${q.matchLeft.map((l, i) => `
							<div class="match__left"><b>${l.letter})</b> ${l.label}</div>
							<select class="match__select" data-idx="${i}" ${state.checked?'disabled':''}>
								<option value="">—</option>
								${q.matchRight.map(r => `<option value="${r.id}" ${arr[i]===r.id?'selected':''}>${r.id}) ${r.label}</option>`).join('')}
							</select>
						`).join('')}
					</div>`;
				}

				const isLast = state.current === N - 1;
				let actionBtn = '';
				if (!state.checked) {
					actionBtn = `<button type="button" class="btn btn--primary" id="btn-check" disabled>Проверить</button>`;
				} else {
					var nextLabel = 'Следующий вопрос →';
					if (isLast) {
						nextLabel = MODE === 'infinite' ? ('Следующая пачка (' + N + ') →') : 'Завершить →';
					}
					actionBtn = `<button type="button" class="btn btn--green" id="btn-next">${nextLabel}</button>`;
				}

				const feedback = state.checked ? `
					<div class="feedback is--shown ${state.correct ? 'feedback--ok' : 'feedback--wrong'}">
						<div class="feedback__head">
							${state.correct
								? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Верно!'
								: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Не угадал'}
						</div>
						${!state.correct ? `<div class="feedback__correct"><b>Правильный ответ:</b> ${formatCorrect(q)}</div>` : ''}
						${q.hint ? `<div class="feedback__hint">${q.hint}</div>` : ''}
					</div>
				` : '';

				const tagText = (function () {
					if (MODE !== 'infinite') return `Вопрос ${n} из ${N}`;
					var globalNo = (batchNo - 1) * N + n;
					return `Вопрос ${globalNo}`;
				})();

				elStage.innerHTML = `
					<div class="q-card">
						<div class="q-head">
							<span class="q-tag">${tagText}</span>
						</div>
						<h1 class="q-title">${q.title}</h1>
						<div class="q-body">${formatBody(q.body)}</div>
						${input}
						${feedback}
						<div class="q-foot">${actionBtn}</div>
					</div>
				`;

				wire(q);
				renderChips();
			}

			function wire(q) {
				if (q.type === 'single' || q.type === 'multi') {
					elStage.querySelectorAll('.option').forEach(el => {
						el.addEventListener('click', () => {
							if (state.checked) return;
							const id = el.dataset.id;
							if (q.type === 'single') {
								state.given = id;
							} else {
								const cur = new Set(Array.isArray(state.given) ? state.given : []);
								if (cur.has(id)) cur.delete(id);
								else {
									if (q.pickCount && cur.size >= q.pickCount) {
										cur.delete(cur.values().next().value);
									}
									cur.add(id);
								}
								state.given = Array.from(cur);
							}
							renderQuestion();
						});
					});
				}
				else if (q.type === 'input') {
					const inp = document.getElementById('ans');
					if (inp) {
						inp.addEventListener('input', () => {
							state.given = inp.value.trim();
							updateCheckBtn();
						});
					}
				}
				else if (q.type === 'match') {
					elStage.querySelectorAll('.match__select').forEach(sel => {
						sel.addEventListener('change', () => {
							const cur = Array.isArray(state.given) ? [...state.given] : [];
							cur[Number(sel.dataset.idx)] = sel.value;
							state.given = cur;
							updateCheckBtn();
						});
					});
				}

				const btnCheck = document.getElementById('btn-check');
				if (btnCheck) {
					btnCheck.addEventListener('click', () => {
						if (!isGivenNonEmpty(q)) return;
						state.correct = checkAnswer(q, state.given);
						state.checked = true;
						state.results[state.current] = { qid: q.id, ok: state.correct };
						try {
							if (window.MistakesStore) {
								if (state.correct) window.MistakesStore.remove(q.id);
								else window.MistakesStore.add(q.id, 'warmup');
							}
						} catch(e) {}
						if (!state.correct && Number.isFinite(CAT_ID)) {
							incCatWrong(CAT_ID, q.id);
						}
						renderQuestion();
					});
					updateCheckBtn();
				}

				const btnNext = document.getElementById('btn-next');
				if (btnNext) {
					btnNext.addEventListener('click', () => {
						state.current++;
						state.given = null;
						state.checked = false;
						state.correct = false;
						if (state.current >= N) {
							if (MODE === 'infinite') startNextBatch();
							else renderFinal();
							return;
						}
						else renderQuestion();
					});
				}
			}

			function isGivenNonEmpty(q) {
				const g = state.given;
				if (g === null || g === undefined || g === '') return false;
				if (Array.isArray(g)) {
					if (q.type === 'match') return g.filter(Boolean).length === q.matchLeft.length;
					return g.filter(Boolean).length > 0;
				}
				return true;
			}

			function updateCheckBtn() {
				const btn = document.getElementById('btn-check');
				if (!btn) return;
				const q = state.questions[state.current];
				btn.disabled = !isGivenNonEmpty(q);
			}

			function renderFinal() {
				const ok = state.results.filter(r => r && r.ok).length;
				try {
					if (window.ChemProgress) {
						ChemProgress.recordAttempt({
							mode: 'warmup',
							label: 'Разминка',
							correct: ok,
							total: N,
							percent: N > 0 ? Math.round((ok / N) * 100) : 0,
							items: state.results.filter(Boolean).map(function (r) {
								return { qid: r.qid, ok: !!r.ok };
							})
						});
					}
				} catch (e) {}
				const emoji = ok === N ? '🎉' : ok >= Math.ceil(N * 0.6) ? '💪' : '👍';
				const title = ok === N ? 'Идеально!'
							: ok >= Math.ceil(N * 0.6) ? 'Неплохо размялся!'
							: 'Разминка завершена';
				const note = ok === N ? ('Все ' + N + ' вопросов верно. Отлично!')
							: ok >= Math.ceil(N * 0.6) ? 'Большая часть заданий решена правильно. Продолжай!'
							: 'Не всё получилось — но разминка и не должна быть лёгкой. Потренируйся ещё.';

				const nextLabel = MODE === 'infinite'
					? ('Продолжить (ещё ' + N + ') →')
					: ('Ещё ' + N + ' вопросов →');
				elStage.innerHTML = `
					<div class="final">
						<div class="final__emoji">${emoji}</div>
						<h1 class="final__title">${title}</h1>
						<div class="final__score">${ok}<span> / ${N}</span></div>
						<p class="final__note">${note}</p>
						<div class="final__actions">
							<button type="button" class="btn btn--primary" id="btn-again">${nextLabel}</button>
							<a href="/subject-chemistry/" class="btn btn--ghost">К предмету</a>
						</div>
					</div>
				`;
				elChips.innerHTML = '';
				state.results.forEach(r => {
					const chip = document.createElement('span');
					chip.className = 'chip ' + (r.ok ? 'is--ok' : 'is--wrong');
					elChips.appendChild(chip);
				});

				document.getElementById('btn-again').addEventListener('click', () => {
					startNextBatch();
				});
			}

			// ============================================================
			// INIT
			// ============================================================
			if (state.questions.length === 0) {
				const emptyMsg = Number.isFinite(CAT_ID)
					? `<p style="text-align:center; color: var(--muted); max-width: 520px; margin: 0 auto;">Для выбранной категории в реестре пока нет списка заданий — разминка не запущена. Это соответствует статусу «скоро» на странице предмета.</p><p style="text-align:center; color: var(--muted); font-size: 14px; margin-top: 12px;">Номер категории в интерфейсе не совпадает с номером в имени файла исходника: например, <code>chemistry-cat03-source.js</code> даёт вопросы для <b>категории 02</b> (id 30001–30065).</p>`
					: `<p style="text-align:center; color: var(--muted);">Банк вопросов пуст.</p>`;
				elStage.innerHTML = `<div class="q-card">${emptyMsg}</div>`;
			} else {
				renderQuestion();
			}
		</script>
	</body>
</html>
