<style>
:root{
  --bg:#fafaf7;
  --ink:#0e0e12;
  --ink-2:#3b3d49;
  --muted:#7a7d8a;
  --line:#e9e8e1;
  --primary:#5b3df5;
  --primary-soft:#ece8ff;
  --mint:#23d3a4;
  --mint-soft:#daf6ec;
  --sun:#ffd23a;
  --sun-soft:#fff1c2;
  --coral:#ff6b6b;
  --coral-soft:#ffe2e2;
  --leaf:#3aa66f;
  --leaf-soft:#d8f0e2;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Manrope',system-ui,sans-serif;
  background:
    radial-gradient(circle at 12% 8%, rgba(91,61,245,.10), transparent 38%),
    radial-gradient(circle at 88% 92%, rgba(58,166,111,.12), transparent 38%),
    var(--bg);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
button{font-family:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3,p{margin:0}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px 28px;width:100%;flex:1;display:flex;flex-direction:column}

/* ---------- Top bar ---------- */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;min-height:32px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:15px;letter-spacing:-.02em}
.brand__mark{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--leaf),#5fd09a);
  display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;
  box-shadow:0 4px 12px -4px rgba(58,166,111,.5);
}
.q-counter{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.q-counter b{color:var(--ink)}

/* ---------- Progress ---------- */
.progress{margin-bottom:18px}
.progress__bar{height:8px;border-radius:99px;background:#ebe7df;overflow:hidden;position:relative}
.progress__fill{
  position:absolute;left:0;top:0;bottom:0;
  background:linear-gradient(90deg,var(--leaf),#5fd09a);
  width:0%;border-radius:99px;
  transition:width .55s cubic-bezier(.2,.8,.3,1);
}
.progress__sub{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
.progress__sub b{color:var(--leaf)}

/* ---------- Card ---------- */
.card{
  background:#fff;border:1.5px solid var(--line);border-radius:22px;
  padding:24px 22px 22px;
  box-shadow:0 1px 0 rgba(14,14,18,.04), 0 12px 30px -16px rgba(14,14,18,.18);
  flex:1;display:flex;flex-direction:column;
}

/* ---------- Start screen ---------- */
.start{align-items:center;text-align:center;padding:32px 22px}
.start__art{
  width:140px;height:140px;border-radius:30px;
  background:linear-gradient(160deg,var(--leaf-soft) 0%,#fff1c2 100%);
  display:grid;place-items:center;font-size:72px;
  margin-bottom:18px;
  box-shadow:0 16px 36px -14px rgba(58,166,111,.4);
  position:relative;
}
.start__art::before{
  content:'';position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.5);
}
.start__h{font-size:28px;font-weight:900;letter-spacing:-.02em;line-height:1.05;margin-bottom:10px;text-wrap:balance}
.start__h em{font-style:normal;background:linear-gradient(135deg,var(--leaf),#5fd09a);-webkit-background-clip:text;background-clip:text;color:transparent}
.start__sub{font-size:15px;color:var(--ink-2);max-width:380px;line-height:1.5;margin-bottom:18px;text-wrap:pretty}
.start__chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:22px}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:800;color:var(--ink-2);
  padding:7px 12px;border-radius:99px;background:#f5f3ec;border:1px solid var(--line);
}
.chip__dot{width:6px;height:6px;border-radius:50%;background:var(--leaf)}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:900;font-size:15px;
  padding:15px 24px;border-radius:14px;
  transition:transform .12s ease;
  white-space:nowrap;border:0;cursor:pointer;
  font-family:inherit;
}
.btn--primary{
  background:var(--primary);color:#fff;
  box-shadow:0 4px 0 #3a23c4,0 12px 24px -10px rgba(91,61,245,.5);
}
.btn--primary:hover{transform:translateY(-1px)}
.btn--primary:active{transform:translateY(2px);box-shadow:0 2px 0 #3a23c4}
.btn--leaf{
  background:var(--leaf);color:#fff;
  box-shadow:0 4px 0 #2b8557,0 12px 24px -10px rgba(58,166,111,.5);
}
.btn--leaf:hover{transform:translateY(-1px)}
.btn--leaf:active{transform:translateY(2px);box-shadow:0 2px 0 #2b8557}
.btn--lg{padding:17px 28px;font-size:16px;border-radius:16px;width:100%;max-width:340px}

/* ---------- Question ---------- */
.q{animation:qIn .35s cubic-bezier(.2,.8,.3,1)}
@keyframes qIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.q__topic{
  display:inline-block;font-size:11px;font-weight:900;color:var(--leaf);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;
  padding:5px 10px;border-radius:99px;background:var(--leaf-soft);
}
.q__h{font-size:21px;font-weight:900;letter-spacing:-.01em;line-height:1.2;margin-bottom:18px;text-wrap:pretty}
.q__opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:center;gap:12px;
  padding:15px 16px;border-radius:14px;
  background:#fff;border:1.5px solid var(--line);
  font-weight:700;font-size:15px;color:var(--ink);
  text-align:left;cursor:pointer;
  transition:all .12s ease;
  box-shadow:0 2px 0 var(--line);
  width:100%;
  font-family:inherit;
}
.opt:hover:not(:disabled){border-color:var(--primary);transform:translateY(-1px);box-shadow:0 3px 0 var(--primary-soft)}
.opt__bullet{
  width:26px;height:26px;border-radius:8px;
  background:#f5f3ec;color:var(--ink-2);
  display:grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 auto;
}
.opt__txt{flex:1;line-height:1.3}
.opt__mark{font-size:18px;font-weight:900;width:20px;text-align:right;display:none}

.opt.is-correct{background:var(--mint-soft);border-color:var(--mint);color:#0c5a44;box-shadow:0 3px 0 #b3e8d3;animation:pop .35s cubic-bezier(.2,.8,.3,1.2)}
.opt.is-correct .opt__bullet{background:var(--mint);color:#fff}
.opt.is-correct .opt__mark{display:inline;color:var(--mint)}
.opt.is-wrong{background:var(--coral-soft);border-color:var(--coral);color:#a32626;box-shadow:0 3px 0 #f5cccc;animation:shake .35s ease}
.opt.is-wrong .opt__bullet{background:var(--coral);color:#fff}
.opt.is-wrong .opt__mark{display:inline;color:var(--coral)}
.opt.is-shown-correct{background:var(--mint-soft);border-color:var(--mint);color:#0c5a44}
.opt.is-shown-correct .opt__bullet{background:var(--mint);color:#fff}
.opt.is-shown-correct .opt__mark{display:inline;color:var(--mint)}
.opt:disabled{cursor:default}
.opt.is-dim{opacity:.45}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- Micro-feedback (auto-advance, no button) ---------- */
.micro{
  margin-top:14px;padding:13px 16px;border-radius:13px;
  display:flex;gap:10px;align-items:center;
  animation:slideUp .3s cubic-bezier(.2,.8,.3,1.2);
  position:relative;overflow:hidden;
}
@keyframes slideUp{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
.micro--good{background:var(--mint-soft);border:1.5px solid var(--mint);color:#0c5a44}
.micro--bad{background:var(--coral-soft);border:1.5px solid var(--coral);color:#a32626}
.micro__emoji{font-size:22px;line-height:1;flex:0 0 auto}
.micro__txt{font-size:14px;font-weight:900;line-height:1.3;flex:1}
.micro__bar{
  position:absolute;left:0;bottom:0;height:3px;width:0;
  background:currentColor;opacity:.45;
  animation:microFill var(--dur,800ms) linear forwards;
}
@keyframes microFill{from{width:0}to{width:100%}}

/* ---------- Mid-quiz nudge (after Q5) ---------- */
.nudge{
  margin-top:14px;padding:11px 14px;border-radius:12px;
  background:linear-gradient(95deg, #fff1c2, #d8f0e2);
  font-size:12.5px;font-weight:800;color:var(--ink-2);
  display:flex;align-items:center;gap:8px;
  animation:slideUp .35s cubic-bezier(.2,.8,.3,1.2);
}

/* ---------- Calc / waiting screen ---------- */
.calc{align-items:center;text-align:center;padding:48px 28px;animation:qIn .35s cubic-bezier(.2,.8,.3,1)}
.calc__ring{
  width:84px;height:84px;border-radius:50%;
  border:4px solid var(--leaf-soft);border-top-color:var(--leaf);
  animation:spin 1s linear infinite;margin-bottom:20px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.calc__h{font-size:22px;font-weight:900;letter-spacing:-.01em;line-height:1.15;margin-bottom:8px;text-wrap:balance}
.calc__sub{font-size:14px;color:var(--ink-2);max-width:340px;line-height:1.5}
.calc__steps{display:flex;flex-direction:column;gap:8px;margin-top:22px;width:100%;max-width:300px;text-align:left}
.calc__step{
  display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:700;color:var(--muted);
  padding:8px 12px;border-radius:10px;background:#f5f3ec;
}
.calc__step.is-done{color:var(--ink);background:var(--leaf-soft)}
.calc__step .ic{width:18px;height:18px;border-radius:50%;background:#ebe7df;display:grid;place-items:center;font-size:10px;font-weight:900;color:var(--muted);flex:0 0 auto}
.calc__step.is-done .ic{background:var(--leaf);color:#fff}

/* ---------- Result screen ---------- */
.result{align-items:center;text-align:center;padding:24px 22px 22px}
.result__ring{
  width:120px;height:120px;border-radius:50%;
  display:grid;place-items:center;
  font-size:38px;font-weight:900;color:#fff;letter-spacing:-.02em;
  font-family:'Space Grotesk',sans-serif;
  margin-bottom:12px;
  box-shadow:0 16px 40px -12px rgba(91,61,245,.4);
  position:relative;
  animation:ringIn .55s cubic-bezier(.2,.8,.3,1.2);
}
@keyframes ringIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.result__ring small{font-size:14px;font-weight:700;opacity:.75;display:block;margin-top:-2px}
.result__ring.r-low{background:linear-gradient(135deg,var(--coral),#ff8a65)}
.result__ring.r-mid{background:linear-gradient(135deg,var(--primary),#9277ff)}
.result__ring.r-hi{background:linear-gradient(135deg,var(--leaf),#5fd09a);box-shadow:0 16px 40px -12px rgba(58,166,111,.4)}
.result__grade{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;
  padding:5px 10px;border-radius:99px;margin-bottom:10px;
}
.result__grade.r-low{background:var(--coral-soft);color:#a32626}
.result__grade.r-mid{background:var(--primary-soft);color:var(--primary)}
.result__grade.r-hi{background:var(--leaf-soft);color:var(--leaf)}
.result__h{font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.15;margin-bottom:6px;text-wrap:balance}
.result__sub{font-size:14px;color:var(--ink-2);max-width:420px;line-height:1.5;margin-bottom:14px;text-wrap:pretty}

.weak{
  width:100%;text-align:left;
  background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;
  margin-bottom:12px;
}
.weak__h{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.weak__list{display:flex;flex-direction:column;gap:6px}
.weak__row{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.weak__row .ic{width:22px;height:22px;border-radius:7px;background:var(--coral-soft);color:var(--coral);display:grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 auto}
.weak__none{font-size:14px;color:var(--ink-2);line-height:1.5}
.weak__none b{color:var(--leaf)}

.result__pitch{
  background:linear-gradient(165deg,#0e0e12 0%,#1a1532 100%);
  color:#fff;border-radius:16px;padding:14px 18px;width:100%;
  text-align:left;margin-bottom:14px;position:relative;overflow:hidden;
}
.result__pitch::before{
  content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,210,58,.25),transparent 70%);
}
.result__pitch h4{font-size:16px;font-weight:900;letter-spacing:-.01em;margin-bottom:4px;position:relative}
.result__pitch p{font-size:13px;color:rgba(255,255,255,.78);line-height:1.45;position:relative}
.result__pitch .tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:900;color:var(--sun);text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:6px;position:relative;
}

.result__cta{display:flex;flex-direction:column;gap:10px;width:100%;align-items:center}
.result__retry{font-size:13px;color:var(--muted);font-weight:700;text-decoration:underline;cursor:pointer;background:none;border:0;padding:8px}
.result__retry:hover{color:var(--ink)}
.result__email-tag{
  font-size:11.5px;color:var(--muted);font-weight:700;
  margin-top:4px;display:flex;align-items:center;justify-content:center;gap:6px;
}
.result__email-tag b{color:var(--ink)}

/* hidden helper */
.hidden{display:none !important}

@media (max-width:520px){
  .wrap{padding:14px 14px 22px}
  .card{padding:20px 18px}
  .start{padding:24px 14px}
  .start__h{font-size:24px}
  .start__art{width:120px;height:120px;font-size:60px;border-radius:24px}
  .q__h{font-size:18.5px}
  .result__h{font-size:20px}
  .result__ring{width:108px;height:108px;font-size:34px}
  .calc{padding:36px 18px}
}

/* ---------- Email gate (popup) ---------- */
.gate{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.gate.is-open{display:flex}
.gate__bd{position:absolute;inset:0;background:rgba(14,14,18,.6);backdrop-filter:blur(4px);opacity:0;animation:gfade .25s ease forwards}
@keyframes gfade{to{opacity:1}}
.gate__card{position:relative;width:100%;max-width:420px;background:#fff;border-radius:24px;padding:28px 24px 22px;text-align:center;box-shadow:0 30px 70px -18px rgba(14,14,18,.45);transform:translateY(14px) scale(.94);opacity:0;animation:gpop .4s cubic-bezier(.2,.8,.3,1.2) forwards}
@keyframes gpop{to{transform:translateY(0) scale(1);opacity:1}}
.gate__chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:900;color:var(--leaf);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;padding:5px 12px;border-radius:99px;background:var(--leaf-soft)}
.gate__art{width:72px;height:72px;border-radius:20px;margin:0 auto 14px;display:grid;place-items:center;font-size:36px;background:linear-gradient(160deg,var(--leaf-soft) 0%,var(--sun-soft) 100%);box-shadow:0 12px 30px -10px rgba(58,166,111,.4)}
.gate__h{font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.15;margin-bottom:8px;text-wrap:balance}
.gate__sub{font-size:14.5px;color:var(--ink-2);line-height:1.5;margin-bottom:18px;text-wrap:pretty}
.gate__sub b{color:var(--ink)}
.gate__ask{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:10px}
.gate__field{margin-bottom:8px;text-align:left;display:flex;flex-direction:column;gap:6px}
.gate__field input{font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);padding:14px 16px;border-radius:13px;border:1.5px solid var(--line);background:#fff;outline:none;transition:border-color .15s ease,box-shadow .15s ease;width:100%}
.gate__field input:focus{border-color:var(--leaf);box-shadow:0 0 0 4px rgba(58,166,111,.14)}
.gate__field.has-error input{border-color:var(--coral);background:#fff7f7}
.gate__field input::placeholder{color:#b6b8c0;font-weight:500}
.gate__err{font-size:12px;font-weight:700;color:var(--coral);min-height:14px}
.gate__btn{width:100%;background:var(--leaf);color:#fff;border:0;padding:15px 22px;border-radius:14px;font-weight:900;font-size:15px;box-shadow:0 4px 0 #2b8557,0 12px 24px -10px rgba(58,166,111,.5);cursor:pointer;transition:transform .12s ease,opacity .15s ease;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.gate__btn:hover:not(:disabled){transform:translateY(-1px)}
.gate__btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #2b8557}
.gate__btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:0 4px 0 #2b8557;transform:none}
.gate__note{margin-top:12px;font-size:12px;color:var(--muted);font-weight:600;line-height:1.5;display:flex;align-items:center;justify-content:center;gap:6px}
.gate__trust{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:11px;font-weight:700;color:var(--muted);flex-wrap:wrap}
</style>

<body>

<div class="wrap" data-screen-label="01 Quiz funnel">
  <div class="top">
    <a class="brand" href="/" title="На главную" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:9px"><span class="brand__mark">IQ</span> IQMO · Биология</a>
    <div class="q-counter" id="qCounter" hidden></div>
  </div>

  <div class="progress" id="progressWrap" hidden>
    <div class="progress__bar"><div class="progress__fill" id="progressFill"></div></div>
    <div class="progress__sub">
      <span id="progressLeft">Вопрос 1 из 12</span>
      <span><b id="progressPct">0%</b></span>
    </div>
  </div>

  <main class="card" id="card">
    <!-- screens injected by JS -->
  </main>
</div>

<!-- Email gate popup -->
<div class="gate" id="emailGate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <div class="gate__bd"></div>
  <div class="gate__card">
    <div class="gate__chip">✓ Результат готов</div>
    <div class="gate__art">🎯</div>
    <h3 class="gate__h" id="gate-title">Ты почти прошёл тест 👇</h3>
    <p class="gate__sub">Мы уже посчитали твой результат<br/>и определили твою <b>оценку по ОГЭ</b>.</p>
    <div class="gate__ask">Куда отправить результат и разбор ошибок?</div>
    <form id="gateForm" novalidate>
      <div class="gate__field" id="gateField">
        <input id="gateEmail" type="email" placeholder="ты@example.ru" autocomplete="email" inputmode="email" />
        <span class="gate__err" id="gateErr"></span>
      </div>
      <button type="submit" class="gate__btn" id="gateBtn">Получить результат</button>
    </form>
    <p class="gate__note">🔒 Без спама. Только твой результат.</p>
  </div>
</div>

<script>
const QUIZ_ID = 'biology-v2';
function track(ev, extra){
  try {
    const body = JSON.stringify({
      quiz_id: QUIZ_ID,
      event: ev,
      q_idx: extra && extra.q_idx ? extra.q_idx : undefined,
      payload: extra && extra.payload ? extra.payload : undefined,
    });
    if (navigator.sendBeacon) {
      const blob = new Blob([body], { type: 'application/json' });
      navigator.sendBeacon('/api/quiz/track', blob);
    } else {
      fetch('/api/quiz/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, keepalive: true }).catch(()=>{});
    }
  } catch (e) {}
}

/* ===================== QUIZ DATA — 12 questions ===================== */
const QUIZ = {
  questions: [
    /* ---- 1–3: very easy (warm-up) ---- */
    { topic:"Клетка",
      q:"Из чего состоят все живые организмы?",
      opts:["Из клеток","Из камней","Из воздуха","Из жидкости"], correct:0 },

    { topic:"Анатомия",
      q:"Какой орган качает кровь по всему телу?",
      opts:["Печень","Лёгкие","Сердце","Желудок"], correct:2 },

    { topic:"Растения",
      q:"Что растения берут из воздуха для фотосинтеза?",
      opts:["Кислород","Углекислый газ","Азот","Водород"], correct:1 },

    /* ---- 4–8: engagement (mid) ---- */
    { topic:"Дыхание",
      q:"В каком органе кислород попадает в кровь?",
      opts:["В сердце","В печени","В лёгких","В почках"], correct:2 },

    { topic:"Кровь",
      q:"Какие клетки крови переносят кислород?",
      opts:["Лейкоциты","Эритроциты","Тромбоциты","Лимфоциты"], correct:1 },

    { topic:"Скелет",
      q:"Сколько примерно костей у взрослого человека?",
      opts:["Около 50","Около 100","Около 200","Около 500"], correct:2 },

    { topic:"Пищеварение",
      q:"Где начинается переваривание углеводов?",
      opts:["В желудке","В ротовой полости","В кишечнике","В пищеводе"], correct:1 },

    { topic:"Рефлексы",
      q:"Что отвечает за коленный рефлекс?",
      opts:["Головной мозг","Спинной мозг","Только мышца","Сердце"], correct:1 },

    /* ---- 9–11: diagnostic (harder) ---- */
    { topic:"Клетка",
      q:"Чем клетка растения отличается от клетки животного?",
      opts:["Есть ядро","Есть стенка из целлюлозы","Есть митохондрии","Есть цитоплазма"], correct:1 },

    { topic:"Фотосинтез",
      q:"Что образуется в листе при фотосинтезе?",
      opts:["Белки и жиры","Глюкоза и кислород","Только вода","Углекислый газ"], correct:1 },

    { topic:"Наследственность",
      q:"Где в клетке хранится информация о наследственных признаках?",
      opts:["В рибосомах","В митохондриях","В ядре","В цитоплазме"], correct:2 },

    /* ---- 12: last (gate triggers BEFORE this one shows result) ---- */
    { topic:"Экосистемы",
      q:"Кто такие продуценты в экосистеме?",
      opts:["Хищники","Растения и водоросли","Грибы","Бактерии-разрушители"], correct:1 },
  ]
};

/* Micro-feedback pools */
const FB_GOOD_EARLY = [
  { e:"🔥", t:"Отлично, лёгкий старт!" },
  { e:"✅", t:"Верно, идём дальше" },
  { e:"💪", t:"Точно — поехали!" },
];
const FB_GOOD_MID = [
  { e:"🔥", t:"Отлично!" },
  { e:"✅", t:"Верно, идём дальше" },
  { e:"⚡", t:"В точку!" },
  { e:"💪", t:"Так держать" },
];
const FB_GOOD_HARD = [
  { e:"🔥", t:"Сильно — это уже непросто!" },
  { e:"🎯", t:"В яблочко" },
  { e:"💎", t:"Чисто. Молодец" },
];
const FB_BAD_EARLY = [
  { e:"💡", t:"Ничего страшного, бывает" },
  { e:"💡", t:"Не страшно, такие часто путают" },
];
const FB_BAD_MID = [
  { e:"💡", t:"Почти! Такие часто путают" },
  { e:"💡", t:"Ничего, запомним" },
];
const FB_BAD_HARD = [
  { e:"💡", t:"Ничего страшного, это сложный вопрос" },
  { e:"💡", t:"Тема для разбора — это в копилку" },
];

function pickMicro(ok, idx){
  let pool;
  if(ok){
    pool = idx < 3 ? FB_GOOD_EARLY : (idx < 8 ? FB_GOOD_MID : FB_GOOD_HARD);
  } else {
    pool = idx < 3 ? FB_BAD_EARLY : (idx < 8 ? FB_BAD_MID : FB_BAD_HARD);
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

/* Auto-advance timing per spec: 600–900ms */
const ADVANCE_OK_MS = 700;   // correct → 700ms
const ADVANCE_BAD_MS = 900;  // wrong → 900ms (a hair longer to read)

/* ===================== STATE ===================== */
const state = {
  i: 0,
  correct: 0,
  wrongTopics: [],
  email: '',
};

const card = document.getElementById('card');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressLeft = document.getElementById('progressLeft');
const progressPct = document.getElementById('progressPct');
const qCounter = document.getElementById('qCounter');

/* ===================== SCREENS ===================== */
function renderStart(){
  progressWrap.hidden = true;
  qCounter.hidden = true;
  card.className = 'card start';
  card.innerHTML = `
    <div class="start__art">🧬</div>
    <h1 class="start__h">Сможешь набрать <em>8 из 12</em><br/>по биологии ОГЭ?</h1>
    <p class="start__sub">12 лёгких вопросов за 2 минуты. В конце покажем твой уровень и слабые темы.</p>
    <div class="start__chips">
      <span class="chip"><span class="chip__dot"></span>Без регистрации</span>
      <span class="chip"><span class="chip__dot"></span>Это не контрольная</span>
      <span class="chip"><span class="chip__dot"></span>Результат сразу</span>
    </div>
    <button class="btn btn--leaf btn--lg" id="startBtn">Начать квиз →</button>
    <p style="margin-top:14px;font-size:12px;color:var(--muted);font-weight:700">~2 минуты · 4 варианта на вопрос</p>
  `;
  document.getElementById('startBtn').onclick = ()=>{
    state.i = 0; state.correct = 0; state.wrongTopics = []; state.email = '';
    track('start');
    try { if (window.ym) ym(108770166, 'reachGoal', 'quiz_started', { quiz_id: QUIZ_ID }); } catch (e0) {}
    renderQuestion();
  };
}

function updateProgress(){
  const total = QUIZ.questions.length;
  const done = state.i;            // questions completed
  const pct = (done / total) * 100;
  progressFill.style.width = pct + '%';
  progressLeft.textContent = `Вопрос ${state.i + 1} из ${total}`;
  progressPct.textContent = `${Math.round(pct)}%`;
  qCounter.innerHTML = `<b>${state.i + 1}</b> / ${total}`;
}

function renderQuestion(){
  const q = QUIZ.questions[state.i];
  const total = QUIZ.questions.length;
  track('question', { q_idx: state.i + 1, payload: { topic: q.topic } });
  progressWrap.hidden = false;
  qCounter.hidden = false;
  updateProgress();
  card.className = 'card';
  card.innerHTML = `
    <div class="q">
      <span class="q__topic">${q.topic}</span>
      <h2 class="q__h">${q.q}</h2>
      <div class="q__opts" id="opts">
        ${q.opts.map((o,i)=>`
          <button class="opt" data-i="${i}" type="button">
            <span class="opt__bullet">${String.fromCharCode(65+i)}</span>
            <span class="opt__txt">${o}</span>
            <span class="opt__mark"></span>
          </button>`).join('')}
      </div>
      <div id="fbSlot"></div>
    </div>
  `;
  card.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>handleAnswer(parseInt(btn.dataset.i,10));
  });
}

function handleAnswer(picked){
  const q = QUIZ.questions[state.i];
  const total = QUIZ.questions.length;
  const ok = picked === q.correct;
  const opts = card.querySelectorAll('.opt');

  // Highlight selected + correct
  opts.forEach((btn,idx)=>{
    btn.disabled = true;
    if(idx === picked) btn.classList.add(ok ? 'is-correct' : 'is-wrong');
    if(!ok && idx === q.correct) btn.classList.add('is-shown-correct');
    if(idx !== picked && idx !== q.correct) btn.classList.add('is-dim');
    btn.querySelector('.opt__mark').textContent = (idx===q.correct) ? '✓' : (idx===picked ? '✕' : '');
  });

  // Track score
  if(ok) state.correct++;
  else if(!state.wrongTopics.includes(q.topic)) state.wrongTopics.push(q.topic);

  // Bump progress to reflect this question DONE
  state.i++;
  // Recompute progress visually (without changing the question label)
  const pct = (state.i / total) * 100;
  progressFill.style.width = pct + '%';
  progressPct.textContent = `${Math.round(pct)}%`;

  // Show micro feedback (no Next button — auto-advance)
  const m = pickMicro(ok, state.i - 1);
  const dur = ok ? ADVANCE_OK_MS : ADVANCE_BAD_MS;
  const fbSlot = document.getElementById('fbSlot');
  let nudgeHTML = '';
  // Mid-quiz nudge after Q5 (indexes: just answered idx 4 → state.i is now 5)
  if(state.i === 5){
    nudgeHTML = `<div class="nudge">👀 Уже видно твой уровень. Продолжай — результат почти готов.</div>`;
  } else if(state.i === 10){
    nudgeHTML = `<div class="nudge">⏳ Почти всё. Уже считаем твой результат...</div>`;
  }
  fbSlot.innerHTML = `
    <div class="micro micro--${ok?'good':'bad'}" style="--dur:${dur}ms">
      <span class="micro__emoji">${m.e}</span>
      <span class="micro__txt">${m.t}</span>
      <span class="micro__bar"></span>
    </div>
    ${nudgeHTML}
  `;

  // Auto-advance after dur ms
  setTimeout(()=>{
    // After Q11 (state.i === 11) — show calc screen, then email gate
    if(state.i === total - 1){
      // we just answered Q11 (index 10). Q12 is final.
      // Actually with 12 questions: gate happens AFTER Q11 (index 10), per spec
      // state.i is now 11 → meaning 11 done, 1 left. But spec says gate after Q11.
      // Let's interpret: gate triggers when 11 questions answered → state.i === 11
    }
    // Spec: "После 11 вопроса" → show "Готово!" → popup → result
    // With 12 total questions: after answering question #11 (state.i becomes 11), show calc + gate
    if(state.i >= total){
      renderCalcScreen();
    } else {
      renderQuestion();
    }
  }, dur);
}

function renderCalcScreen(){
  progressFill.style.width = '100%';
  progressPct.textContent = '100%';
  progressLeft.textContent = 'Готово · считаем результат';
  qCounter.innerHTML = `<b>12</b> / 12`;

  card.className = 'card calc';
  card.innerHTML = `
    <div class="calc__ring"></div>
    <h2 class="calc__h">Готово!</h2>
    <p class="calc__sub">Мы уже посчитали твой результат и определили оценку по ОГЭ.</p>
    <div class="calc__steps">
      <div class="calc__step" data-step="0"><span class="ic">1</span><span>Анализируем ответы</span></div>
      <div class="calc__step" data-step="1"><span class="ic">2</span><span>Определяем слабые темы</span></div>
      <div class="calc__step" data-step="2"><span class="ic">3</span><span>Считаем оценку по ОГЭ</span></div>
    </div>
  `;

  // Animate steps becoming "done"
  const steps = card.querySelectorAll('.calc__step');
  setTimeout(()=>{ steps[0].classList.add('is-done'); steps[0].querySelector('.ic').textContent='✓'; }, 350);
  setTimeout(()=>{ steps[1].classList.add('is-done'); steps[1].querySelector('.ic').textContent='✓'; }, 900);
  setTimeout(()=>{ steps[2].classList.add('is-done'); steps[2].querySelector('.ic').textContent='✓'; }, 1450);
  // Then open the email gate
  setTimeout(()=>openEmailGate(), 1750);
}

function renderResult(){
  try { if (window.ym) ym(108770166, 'reachGoal', 'quiz_completed', { quiz_id: QUIZ_ID, score: state.correct }); } catch (e0) {}
  track('complete', { payload: { score: state.correct } });
  const total = QUIZ.questions.length;
  const score = state.correct;
  let tier, ring, gradeLabel, headline, sub, pitch;

  if(score <= 4){
    tier='r-low'; gradeLabel='Оценка по ОГЭ: 2–3';
    headline='Есть пробелы — но это абсолютно нормально';
    sub='ОГЭ ещё впереди. Времени достаточно, чтобы спокойно подтянуть базу — без зубрёжки и без стресса.';
    pitch={
      tag:'⚡ Твой план',
      h:'Поднимем до уверенной 4 за 3–4 недели',
      p:'Начнём с самых частых тем ОГЭ. По 30 минут в день — и через месяц перепройдёшь этот квиз с другими цифрами.',
      cta:'Начать бесплатную диагностику →'
    };
  } else if(score <= 8){
    tier='r-mid'; gradeLabel='Оценка по ОГЭ: 3–4';
    headline='Хороший уровень — есть что добить';
    sub='База у тебя точно есть. Осталось закрыть несколько тем — и пробник на 4–5 перестанет казаться нереальным.';
    pitch={
      tag:'⚡ Твой план',
      h:'До твёрдой 4–5 — около 2 недель',
      p:'Сфокусируемся только на твоих слабых темах. Платформа сама будет возвращать их через 1 и 5 дней.',
      cta:'Получить план подготовки →'
    };
  } else {
    tier='r-hi'; gradeLabel='Оценка по ОГЭ: 5';
    headline='Шикарный результат!';
    sub='Если так пройдёшь на экзамене — это уверенная 5. Осталось довести до автомата сложные темы.';
    pitch={
      tag:'⚡ Твой план',
      h:'Доводим до 100% и пробуем тренажёр пробников',
      p:'У нас есть формат полных пробников ОГЭ под таймер — ровно как на экзамене. Войдёшь в зону комфорта.',
      cta:'Получить план подготовки →'
    };
  }

  const wTopics = state.wrongTopics.slice(0, 3);
  const weakHTML = wTopics.length ? `
    <div class="weak">
      <div class="weak__h">Темы, которые стоит подтянуть</div>
      <div class="weak__list">
        ${wTopics.map(t=>`<div class="weak__row"><span class="ic">!</span>${t}</div>`).join('')}
      </div>
    </div>
  ` : `
    <div class="weak">
      <div class="weak__h">Слабые темы</div>
      <div class="weak__none">Не нашли — <b>ты прошёл все блоки чисто.</b> Можно идти на пробник.</div>
    </div>
  `;

  progressWrap.hidden = true;
  qCounter.hidden = true;
  card.className = 'card result';
  card.innerHTML = `
    <span class="result__grade ${tier}">${gradeLabel}</span>
    <div class="result__ring ${tier}">
      ${score}<small>/ ${total}</small>
    </div>
    <h2 class="result__h">${headline}</h2>
    <p class="result__sub">${sub}</p>

    ${weakHTML}

    <div class="result__pitch">
      <div class="tag">${pitch.tag}</div>
      <h4>${pitch.h}</h4>
      <p>${pitch.p}</p>
    </div>

    <div class="result__cta">
      <a href="/login.html?next=/subject-biology/&amp;register=1" class="btn btn--primary btn--lg">${pitch.cta}</a>
      <button class="result__retry" id="retryBtn">↻ Пройти квиз заново</button>
    </div>

    <p class="result__email-tag">✉ Разбор отправили на <b>${state.email || 'твой email'}</b></p>
  `;
  const cta = card.querySelector('.result__cta a.btn--primary');
  if (cta) cta.addEventListener('click', ()=>{
    track('cta_register');
    try { if (window.ym) ym(108770166, 'reachGoal', 'quiz_register_click', { quiz_id: QUIZ_ID, score: state.correct }); } catch (e0) {}
  });

  document.getElementById('retryBtn').onclick = ()=>{
    state.i = 0; state.correct = 0; state.wrongTopics = []; state.email = '';
    renderStart();
  };
}

/* ===================== EMAIL GATE ===================== */
const gate = document.getElementById('emailGate');
const gateInput = document.getElementById('gateEmail');
const gateBtn = document.getElementById('gateBtn');
const gateField = document.getElementById('gateField');
const gateErr = document.getElementById('gateErr');
const gateForm = document.getElementById('gateForm');
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function openEmailGate(){
  track('gate_shown');
  gateBtn.disabled = false;
  gateBtn.textContent = 'Получить результат';
  gate.classList.add('is-open');
  document.body.style.overflow = 'hidden';
  gateInput.value = '';
  gateField.classList.remove('has-error');
  gateErr.textContent = '';
  setTimeout(()=>gateInput.focus(), 250);
}
function closeEmailGate(){
  gate.classList.remove('is-open');
  document.body.style.overflow = '';
}
gateInput.addEventListener('input', ()=>{
  if(gateField.classList.contains('has-error')){
    gateField.classList.remove('has-error');
    gateErr.textContent = '';
  }
});
gateForm.addEventListener('submit', e=>{
  e.preventDefault();
  const v = gateInput.value.trim();
  if(!v){
    gateField.classList.add('has-error');
    gateErr.textContent = 'Введите email, чтобы увидеть результат';
    gateInput.focus();
    return;
  }
  if(!EMAIL_RE.test(v)){
    gateField.classList.add('has-error');
    gateErr.textContent = 'Похоже, email с опечаткой';
    gateInput.focus();
    return;
  }
  state.email = v;
  track('gate_submit', { payload: { has_email: true, score: state.correct } });
  try {
    fetch('/api/lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: v,
        quiz_id: QUIZ_ID,
        score: state.correct,
        total: QUIZ.questions.length,
        wrong_topics: state.wrongTopics,
      }),
    }).catch(()=>{});
  } catch (eLead) {}
  try {
    if (window.ym) ym(108770166, 'reachGoal', 'quiz_email_captured');
    if (window.dataLayer) dataLayer.push({ event: 'quiz_email_captured', quiz: 'biology', variant: 'v2pkg', score: state.correct });
  } catch (eYm) {}

  // Tiny "sending" beat for trust, then show result
  gateBtn.disabled = true;
  gateBtn.innerHTML = '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite"></span> Отправляем...';
  setTimeout(()=>{
    closeEmailGate();
    // Last question (#12) is treated as "answered" with the gate having held it back —
    // jump directly to result per spec ("результат уже посчитан").
    state.i = QUIZ.questions.length;
    renderResult();
  }, 700);
});

renderStart();
</script>
