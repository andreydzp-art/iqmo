<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Тряска колбы · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="shake-card.css"/>
<style>
  html,body{margin:0;height:100%;}
  body{
    display:grid; place-items:center; min-height:100vh;
    background:
      radial-gradient(900px 600px at 50% -10%, rgba(124,58,237,.10), transparent 70%),
      #f3f4fb;
    font-family:'Inter',system-ui,sans-serif;
  }
  .hint{position:fixed; top:18px; left:50%; transform:translateX(-50%); font:600 13px/1 'Inter',sans-serif; color:#7c3aed; opacity:.7;}
</style>
</head>
<body>
  <div class="hint">наведи курсор на карточку</div>
<article class="shake-card">
  <div class="scene"></div>
  <span class="rarity">Эпическая</span>

  <div class="orb-stage">
    <!-- floating hexagons -->
    <div class="hex h1"><svg viewBox="0 0 30 34" fill="none" stroke="#a78bfa" stroke-width="1.2"><polygon points="15,2 28,9 28,25 15,32 2,25 2,9"/></svg></div>
    <div class="hex h2"><svg viewBox="0 0 30 34" fill="none" stroke="#a78bfa" stroke-width="1.2"><polygon points="15,2 28,9 28,25 15,32 2,25 2,9"/></svg></div>
    <div class="hex h3"><svg viewBox="0 0 30 34" fill="none" stroke="#a78bfa" stroke-width="1.2"><polygon points="15,2 28,9 28,25 15,32 2,25 2,9"/></svg></div>

    <!-- neon orb + flask -->
    <div class="orb">
      <svg class="flask" viewBox="0 0 64 64">
        <defs>
          <linearGradient id="shGlassFill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%"  stop-color="#c4b5fd" stop-opacity=".25"/>
            <stop offset="55%" stop-color="#a78bfa" stop-opacity=".9"/>
            <stop offset="100%" stop-color="#7c3aed"/>
          </linearGradient>
          <linearGradient id="shGlassEdge" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#c4b5fd"/>
          </linearGradient>
        </defs>
        <rect x="26" y="6" width="12" height="14" rx="2" fill="none" stroke="url(#shGlassEdge)" stroke-width="2.2"/>
        <rect x="24" y="4" width="16" height="3" rx="1.5" fill="#fff" opacity=".9"/>
        <path d="M26 18 L26 26 L12 52 Q10 58 16 58 L48 58 Q54 58 52 52 L38 26 L38 18 Z"
              fill="url(#shGlassFill)" stroke="url(#shGlassEdge)" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M18 44 Q32 40 46 44" fill="none" stroke="#ffffff" stroke-width="1.5" opacity=".6"/>
        <circle cx="22" cy="50" r="1.8" fill="#ffffff" opacity=".9"/>
        <circle cx="30" cy="52" r="1.2" fill="#ffffff" opacity=".75"/>
        <circle cx="38" cy="49" r="1.5" fill="#ffffff" opacity=".85"/>
        <circle cx="42" cy="54" r="1" fill="#ffffff" opacity=".7"/>
        <path d="M30 22 L20 48" stroke="#ffffff" stroke-width="1.2" opacity=".55" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- check badge -->
    <svg class="check" viewBox="0 0 64 64">
      <defs>
        <linearGradient id="shHexFill" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%"  stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#ede9fe"/>
        </linearGradient>
      </defs>
      <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="url(#shHexFill)" stroke="#c4b5fd" stroke-width="2"/>
      <path d="M20 32 L29 41 L46 24" fill="none" stroke="#7c3aed" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <!-- floating orbs -->
    <span class="ball b1"></span>
    <span class="ball b2"></span>
    <span class="ball b3"></span>
    <span class="ball b4"></span>
  </div>

  <div class="title-block">
    <h4 class="title">Первый этап<br/>по химии</h4>
    <div class="subtitle">Успешно пройди 1 этап по химии</div>
  </div>

  <div class="divider"><span></span></div>

  <div class="prog">
    <div class="prog-row">
      <span class="label">Прогресс</span>
      <span class="count"><b>1</b><span class="sep">/</span>1</span>
    </div>
    <div class="prog-bar"><i style="width:100%"></i></div>
  </div>

  <div class="reward">
    <div class="reward-item">
      <div class="reward-ico">
        <svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 11-13h-7z"/></svg>
      </div>
      <div class="reward-text">
        <span class="reward-val">+250 XP</span>
        <span class="reward-lbl">Награда</span>
      </div>
    </div>
  </div>
</article>
</body>
</html>
