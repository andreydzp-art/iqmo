		<style>


			/* ---- top bar ---- */
			.topbar {
				background: #fff; border-bottom: 1px solid var(--line);
				padding: 14px 0; position: sticky; top: 0; z-index: 20;
			}
			.topbar__row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
			.topbar__left { display: flex; align-items: center; gap: 16px; min-width: 0; }
			.logo { font-weight: 800; font-size: 18px; letter-spacing: .02em; }
			.topbar__subject {
				font-size: 13px; color: var(--muted); padding-left: 14px;
				border-left: 1px solid var(--line);
				overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
			}
			.topbar__subject b { color: var(--ink); font-weight: 700; }
			.topbar__center { display: flex; align-items: center; gap: 14px; }
			.timer {
				display: inline-flex; align-items: center; gap: 8px;
				background: var(--accent-weak); color: var(--accent);
				padding: 8px 14px; border-radius: 999px;
				font-weight: 700; font-size: 14px;
				font-variant-numeric: tabular-nums;
			}
			.timer.is--warning { background: #fbf0d9; color: #c28216; }
			.timer.is--danger { background: #fbe2e2; color: #b23e3e; }
			.timer__dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
			@keyframes pulse { 50% { opacity: .35; transform: scale(.85); } }

			.btn {
				display: inline-flex; align-items: center; justify-content: center;
				gap: 8px; font-weight: 600; font-size: 14px;
				padding: 10px 18px; border-radius: 999px;
				border: 1.5px solid transparent; cursor: pointer;
				transition: background .15s, color .15s, border-color .15s, transform .08s;
				white-space: nowrap;
			}
			.btn:active { transform: translateY(1px); }
			.btn--primary { background: linear-gradient(180deg, #44c77d, #2fa965); color: #fff; box-shadow: 0 8px 20px -8px rgba(62,195,122,.55); }
			.btn--primary:hover { filter: brightness(1.05); }
			.btn--ghost { background: #fff; border-color: var(--line); color: var(--ink); }
			.btn--ghost:hover { border-color: var(--ink); }
			.btn--dark { background: var(--dark); color: #fff; }
			.btn--dark:hover { background: #111520; }
			.btn--blue { background: var(--accent); color: #fff; }
			.btn--blue:hover { background: #3e64b6; }
			.btn[disabled] { opacity: .4; cursor: not-allowed; }
			[hidden] { display: none !important; }
			.topbar__right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

			/* ---- progress bar ---- */
			.progressbar {
				height: 3px; background: var(--line); overflow: hidden;
			}
			.progressbar__fill {
				height: 100%; background: linear-gradient(90deg, var(--accent), var(--green));
				transition: width .3s ease; width: 0%;
			}

			/* ---- layout ---- */
			.page__main { flex: 1 0 auto; padding: 24px 0 48px; }
			.grid {
				display: grid;
				grid-template-columns: minmax(0, 240px) minmax(0, 1fr);
				gap: 24px;
				align-items: start;
			}
			.grid__aside { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 16px; }

			/* ---- nav tasks ---- */
			.nav-tasks { padding: 18px; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); }
			.nav-tasks__head {
				display: flex; align-items: center; justify-content: space-between;
				margin-bottom: 14px;
			}
			.nav-tasks__title { font-size: 14px; font-weight: 700; }
			.nav-tasks__counter { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
			.nav-tasks__grid {
				display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
			}
			.nav-task {
				aspect-ratio: 1 / 1;
				border-radius: 9px;
				background: #eef1f6; color: var(--ink-2);
				font-weight: 700; font-size: 13px;
				display: inline-flex; align-items: center; justify-content: center;
				cursor: pointer;
				transition: background .15s, color .15s, box-shadow .15s;
				font-variant-numeric: tabular-nums;
				position: relative;
				border: 1.5px solid transparent;
			}
			.nav-task:hover { background: #e2e7f0; }
			.nav-task.is--answered { background: #e7f6ec; color: #2fa968; }
			.nav-task.is--flagged::after {
				content: ""; position: absolute; top: 3px; right: 3px;
				width: 6px; height: 6px; border-radius: 50%; background: var(--amber);
			}
			.nav-task.is--current { border-color: var(--accent); background: var(--accent); color: #fff; box-shadow: 0 4px 10px -2px rgba(79,123,214,.5); }

			.nav-legend { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
			.nav-legend__row { display: flex; align-items: center; gap: 8px; }
			.nav-legend__dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }

			.quit {
				background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
				padding: 16px; display: flex; flex-direction: column; gap: 10px;
			}
			.quit__hint { font-size: 12px; color: var(--muted); line-height: 1.5; }

			/* ---- question card ---- */
			.q-card {
				background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
				padding: 28px 32px; display: flex; flex-direction: column; gap: 22px;
				min-height: 520px;
			}
			.q-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
			.q-head__left { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
			.q-tag {
				display: inline-flex; align-items: center; gap: 8px;
				font-size: 12px; font-weight: 700; letter-spacing: .06em;
				text-transform: uppercase; color: var(--muted);
			}
			.q-tag b { color: var(--accent); font-weight: 700; }
			.q-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
			.q-flag {
				display: inline-flex; align-items: center; gap: 6px;
				font-size: 13px; color: var(--muted); font-weight: 600;
				padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
				background: #fff; cursor: pointer;
				transition: border-color .15s, color .15s, background .15s;
			}
			.q-flag:hover { border-color: var(--amber); color: var(--amber); }
			.q-flag.is--on { background: #fbf0d9; color: #c28216; border-color: #f0d59a; }

			.q-body { font-size: 16px; color: var(--ink); line-height: 1.65; }
			.q-body p { margin: 0 0 10px; }
			.q-body p:last-child { margin-bottom: 0; }
			.q-body b, .q-body strong { font-weight: 700; }
			.q-body .chem { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; }
			.q-body sub { font-size: 0.75em; }
			.q-body sup { font-size: 0.75em; }

			/* options */
			.options { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
			.option {
				display: flex; align-items: flex-start; gap: 12px;
				padding: 12px 14px;
				border: 1.5px solid var(--line); border-radius: 12px;
				background: #fff; cursor: pointer;
				transition: border-color .15s, background .15s;
				font-size: 15px; color: var(--ink); line-height: 1.5;
			}
			.option:hover { border-color: #c7cfdc; }
			.option__marker {
				width: 22px; height: 22px; border-radius: 6px;
				background: #eef1f6; color: var(--ink-2);
				display: inline-flex; align-items: center; justify-content: center;
				font-weight: 700; font-size: 13px; flex: 0 0 auto;
				transition: background .15s, color .15s;
			}
			.option.is--checked { border-color: var(--accent); background: var(--accent-weak); }
			.option.is--checked .option__marker { background: var(--accent); color: #fff; }
			.option input { display: none; }
			.option__label { min-width: 0; }

			.hint {
				font-size: 13px; color: var(--muted);
				padding: 10px 14px; background: #f3f5f8; border-radius: 10px;
				display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
			}
			.hint svg { flex: 0 0 auto; color: var(--accent); }

			/* answer input */
			.answer-input {
				display: flex; align-items: center; gap: 12px;
				padding: 10px; border: 1.5px solid var(--line); border-radius: 12px;
				background: #fff; max-width: 400px;
			}
			.answer-input:focus-within { border-color: var(--accent); background: var(--accent-weak); }
			.answer-input label { font-size: 13px; font-weight: 600; color: var(--muted); padding-left: 6px; }
			.answer-input input {
				flex: 1; border: 0; outline: 0; background: transparent;
				font-family: 'JetBrains Mono', monospace; font-size: 16px;
				font-weight: 600; color: var(--ink); padding: 6px 8px;
			}

			/* match table */
			.match {
				display: grid; grid-template-columns: 1fr 120px;
				gap: 10px 16px; max-width: 480px; margin-top: 6px;
			}
			.match__left { font-size: 15px; color: var(--ink); padding-top: 8px; }
			.match__left b { color: var(--accent); margin-right: 6px; }
			.match__select {
				width: 100%; padding: 8px 10px;
				border: 1.5px solid var(--line); border-radius: 10px;
				font-family: inherit; font-size: 14px; font-weight: 600;
				background: #fff; color: var(--ink); cursor: pointer;
			}
			.match__select:focus { outline: 0; border-color: var(--accent); }

			/* open answer */
			.open-answer {
				padding: 14px 16px; border-radius: 12px;
				background: #f3f5f8; border: 1px dashed #c7cfdc;
				font-size: 13px; color: var(--muted); line-height: 1.55;
			}
			.open-answer b { color: var(--ink); font-weight: 700; }

			/* footer nav */
			.q-foot {
				margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line);
				display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
			}
			.q-foot__left, .q-foot__right { display: flex; gap: 10px; align-items: center; }

			/* result page */
			.result-wrap { max-width: 720px; margin: 0 auto; }
			.result-card {
				background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
				padding: 40px 32px; text-align: center;
			}
			.result-score {
				font-size: 64px; font-weight: 800; letter-spacing: -0.02em;
				line-height: 1;
				background: linear-gradient(180deg, var(--accent), #3e64b6);
				-webkit-background-clip: text; background-clip: text; color: transparent;
				margin-bottom: 4px;
			}
			.result-max { color: var(--muted); font-size: 18px; font-weight: 600; }
			.result-grade {
				display: inline-block; margin-top: 16px;
				padding: 8px 20px; border-radius: 999px;
				background: var(--accent-weak); color: var(--accent);
				font-weight: 700;
			}
			.result-breakdown {
				margin-top: 28px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
			}
			.rb-item {
				padding: 14px; border-radius: 12px; background: #f3f5f8;
			}
			.rb-num { font-size: 22px; font-weight: 800; color: var(--ink); }
			.rb-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
			.result-hint { margin-top: 20px; font-size: 13px; color: var(--muted); text-align: left; }

			/* ---- review page ---- */
			.review-head {
				background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
				box-shadow: var(--shadow);
				padding: 22px 24px; margin-bottom: 18px;
				display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
			}
			.review-head__score { display: flex; align-items: baseline; gap: 10px; }
			.review-head__score b { font-size: 36px; font-weight: 800; color: var(--ink); }
			.review-head__score span { font-size: 16px; color: var(--muted); }
			.review-head__meta { font-size: 14px; color: var(--muted); }
			.review-head__meta b { color: var(--ink); }
			.review-filter { display: flex; gap: 8px; }
			.review-filter button {
				padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
				background: #fff; font-size: 13px; font-weight: 600; color: var(--ink-2);
			}
			.review-filter button.is--on { background: var(--ink); color: #fff; border-color: var(--ink); }
			.review-actions { display: flex; gap: 10px; flex-wrap: wrap; }

			.review-list { display: flex; flex-direction: column; gap: 14px; }
			.review-item {
				background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line);
				border-radius: var(--radius); box-shadow: var(--shadow);
				padding: 22px 24px;
			}
			.review-item.is--ok     { border-left-color: var(--green); }
			.review-item.is--wrong  { border-left-color: var(--red); }
			.review-item.is--skip   { border-left-color: var(--muted); }
			.review-item__head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
			.review-item__num {
				display: inline-flex; align-items: center; justify-content: center;
				width: 28px; height: 28px; border-radius: 8px;
				background: #eef1f6; color: var(--ink); font-weight: 700; font-size: 14px;
			}
			.review-item__title { font-size: 16px; font-weight: 700; color: var(--ink); }
			.review-item__badge {
				margin-left: auto; font-size: 12px; font-weight: 600;
				padding: 4px 10px; border-radius: 999px;
			}
			.review-item.is--ok    .review-item__badge { background: #e7f6ec; color: #2a8f52; }
			.review-item.is--wrong .review-item__badge { background: #fbe8e8; color: #b04545; }
			.review-item.is--skip  .review-item__badge { background: #eef1f6; color: var(--muted); }
			.review-item__body { font-size: 15px; line-height: 1.55; color: var(--ink-2); margin-bottom: 12px; }
			.review-item__body p { margin: 0 0 8px; }

			.review-answers { display: grid; gap: 10px; margin: 10px 0 14px; }
			.review-answer {
				display: grid; grid-template-columns: 140px 1fr; gap: 12px;
				padding: 10px 14px; border-radius: 10px; background: #f7f9fc; font-size: 14px;
			}
			.review-answer__label { color: var(--muted); font-weight: 600; }
			.review-answer__value { color: var(--ink); font-weight: 600; }
			.review-answer.is--correct { background: #eef8f1; }
			.review-answer.is--correct .review-answer__value { color: #2a8f52; }
			.review-answer.is--wrong { background: #fdf0f0; }
			.review-answer.is--wrong .review-answer__value { color: #b04545; }
			.review-answer.is--muted .review-answer__value { color: var(--muted); font-style: italic; font-weight: 500; }

			.review-hint {
				display: flex; gap: 10px; align-items: flex-start;
				background: #eef4fe; color: #2b4a86; border-radius: 10px;
				padding: 12px 14px; font-size: 14px; line-height: 1.55;
			}
			.review-hint svg { flex-shrink: 0; margin-top: 3px; }
			.review-hint b { color: #1f3d76; }

			@media (max-width: 600px) {
				.review-head { padding: 18px; }
				.review-answer { grid-template-columns: 1fr; gap: 4px; padding: 10px 12px; }
			}

			/* ---- responsive ---- */
			@media (max-width: 1024px) {
				.grid { grid-template-columns: 1fr; }
				.grid__aside { position: static; flex-direction: row; flex-wrap: wrap; }
				.nav-tasks, .quit { flex: 1 1 280px; }
				.nav-tasks__grid { grid-template-columns: repeat(10, 1fr); }
				.q-card { padding: 22px 20px; }
			}
			@media (max-width: 600px) {
				.topbar__subject { display: none; }
				.q-title { font-size: 19px; }
				.nav-tasks__grid { grid-template-columns: repeat(8, 1fr); }
				.result-breakdown { grid-template-columns: 1fr; }
				.q-card { padding: 20px 16px; }
			}
		</style>
	</head>

	<body data-exam-subject="chemistry">
		<!-- Top -->
		<header class="topbar">
			<div class="container topbar__row">
				<div class="topbar__left">
					<div class="logo">IQMO</div>
					<div class="topbar__subject"><b>Химия · ОГЭ 2026</b> — Пробный вариант</div>
				</div>
				<div class="topbar__center">
					<div class="timer" id="timer">

						<span id="timer-val">25:00</span>
					</div>
				</div>
				<div class="topbar__right">

		<main class="page__main">
			<div class="container">
				<div class="grid">
					<!-- aside -->
					<aside class="grid__aside">
						<nav class="nav-tasks" aria-label="Навигация по заданиям">
							<div class="nav-tasks__head">
								<span class="nav-tasks__title">Прогресс</span>
								<span class="nav-tasks__counter"><span id="answered-count">0</span> / <span id="total-count">10</span></span>
							</div>
							<div class="nav-tasks__grid" id="nav-grid"></div>
							<div class="nav-legend">
								<div class="nav-legend__row"><span class="nav-legend__dot" style="background: var(--accent);"></span>текущий вопрос</div>

		<script>
			// ============================================================
			// QUESTION BANK (loaded from chemistry-bank.js)
			// Structure per question:
			//   id: task number (1..23)
			//   type: 'single' | 'multi' | 'input' | 'match' | 'open'
			//   title: short title for header
			//   body: HTML string (the task statement)
			//   options: [{id, label}]          — for single/multi
			//   correct: string | string[]      — expected answer (for auto-check)
			//     - single: "2"
			//     - multi:  ["1","5"]           (order-independent)
			//     - input:  "24" | "7"          (string compare)
			//     - match:  ["1","2","3"] in order A,Б,В
			//   matchLeft, matchRight: for 'match' type
			//   hint: optional string
			// ============================================================
			const ALL_QUESTIONS = window.CHEMISTRY_QUESTIONS || [];
			const TRIAL_COUNT = 10;

			// Выбираем 10 случайных заданий с id ≤ 15, исключая 'open'.
			function pickTrialQuestions() {
				const pool = ALL_QUESTIONS.filter(q => q.id <= 15 && q.type !== 'open');
				const a = [...pool];
				for (let i = a.length - 1; i > 0; i--) {
					const j = Math.floor(Math.random() * (i + 1));
					[a[i], a[j]] = [a[j], a[i]];
				}
				return a.slice(0, TRIAL_COUNT);
			}

			let QUESTIONS = [];

			// ============================================================
			// STATE
			// ============================================================
			const LS_KEY = 'iqmo-chem-trial-v1';
			const EXAM_SUBJECT = (document.body && document.body.dataset.examSubject) || 'chemistry';
			const TRIAL_MIN = window.getExamTimerMinutes ? getExamTimerMinutes(EXAM_SUBJECT, 'trial') : 25;
			const TEST_SECONDS = TRIAL_MIN * 60;
			const state = loadState();
			(function () {
				var qh = document.getElementById('trial-quit-hint');
				if (qh) {
					qh.textContent =
						'Это короткая версия ОГЭ: 10 заданий за ' +
						TRIAL_MIN +
						' минут. Возврат к предыдущим вопросам невозможен — отвечайте последовательно.';
				}
			})();
			QUESTIONS = hydrateQuestions(state.qids);

			(function trialAnalyticsStart() {
				if (state.finished || state.startEventSent || !QUESTIONS.length) return;
				try {
					if (window.ChemProgress && typeof ChemProgress.beginAttempt === 'function') {
						ChemProgress.beginAttempt({
							mode: 'trial',
							subject: EXAM_SUBJECT,
							label: 'Пробный вариант · ' + TRIAL_MIN + ' мин',
							totalQuestions: QUESTIONS.length,
							attemptId: state.attemptId
						});
					}
					state.startEventSent = true;
					saveState();
				} catch (e) {}
			})();

			function hydrateQuestions(qids) {
				if (!Array.isArray(qids) || qids.length === 0) return [];
				const map = new Map(ALL_QUESTIONS.map(q => [q.id, q]));
				return qids.map(id => map.get(id)).filter(Boolean);
			}

			function loadState() {
				try {
					const raw = localStorage.getItem(LS_KEY);
					if (raw) {
						const s = JSON.parse(raw);
						if (s && typeof s === 'object' && Array.isArray(s.qids)) {
							if (!s.attemptId) {
								s.attemptId =
									(typeof crypto !== 'undefined' && crypto.randomUUID && crypto.randomUUID()) ||
									'at-' + Date.now().toString(36);
							}
							if (s.startEventSent == null) s.startEventSent = false;
							return s;
						}
					}
				} catch(e) {}
				const picked = pickTrialQuestions();
				return {
					qids: picked.map(q => q.id),
					current: 0,
					answers: {},
					startedAt: Date.now(),
					finished: false,
					attemptId:
						(typeof crypto !== 'undefined' && crypto.randomUUID && crypto.randomUUID()) ||
						'at-' + Date.now().toString(36),
					startEventSent: false
				};
			}
			function saveState() {
				try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
			}

			// ============================================================
			// RENDER
			// ============================================================
			const elCard = document.getElementById('q-card');
			const elNavGrid = document.getElementById('nav-grid');
			const elPb = document.getElementById('pb-fill');
			const elAnsweredCount = document.getElementById('answered-count');
			const elTotalCount = document.getElementById('total-count');
			elTotalCount.textContent = String(TRIAL_COUNT);

			function isAnswered(id) {
				const a = state.answers[id];
				if (Array.isArray(a)) return a.length > 0;
				return a !== undefined && a !== '';
			}

			function renderNav() {
				elNavGrid.innerHTML = '';
				const total = TRIAL_COUNT;
				for (let i = 0; i < total; i++) {
					const q = QUESTIONS[i];
					const btn = document.createElement('button');
					btn.className = 'nav-task';
					btn.textContent = i + 1;
					if (i === state.current) btn.classList.add('is--current');
					if (q && isAnswered(q.id)) btn.classList.add('is--answered');
					// в пробном варианте возврат запрещён — клетки не кликабельны
					btn.disabled = true;
					btn.style.cursor = 'default';
					elNavGrid.appendChild(btn);
				}
				const answered = QUESTIONS.filter(q => isAnswered(q.id)).length;
				elAnsweredCount.textContent = answered;
				elPb.style.width = (answered / total * 100) + '%';
			}

			function renderQuestion() {
				const q = QUESTIONS[state.current];
				if (!q) {
					elCard.innerHTML = `
						<div class="q-head">
							<div class="q-head__left">
								<div class="q-tag">Задание ${state.current + 1} / ${TRIAL_COUNT}</div>
								<h1 class="q-title">Вопрос не загружен</h1>
							</div>
						</div>
					`;
					return;
				}

				let inputHtml = '';

				if (q.type === 'single' || q.type === 'multi') {
					const picked = state.answers[q.id];
					const pickedSet = new Set(Array.isArray(picked) ? picked : (picked ? [picked] : []));
					inputHtml = `<div class="options" data-role="options" data-multi="${q.type === 'multi' ? '1' : '0'}">
						${q.options.map(o => `
							<label class="option ${pickedSet.has(o.id) ? 'is--checked' : ''}" data-id="${o.id}">
								<span class="option__marker">${o.id}</span>
								<span class="option__label">${o.label}</span>
							</label>
						`).join('')}
					</div>`;
					// подсказка (q.hint) скрыта во время теста и будет показана на странице результатов
				}
				else if (q.type === 'input') {
					const v = state.answers[q.id] || '';
					inputHtml = `<div class="answer-input" data-role="input">
						<label for="ans-input">Ответ:</label>
						<input id="ans-input" type="text" inputmode="numeric" autocomplete="off" value="${escapeAttr(v)}" placeholder="${q.placeholder || 'введите число'}" />
					</div>`;
					// подсказка (q.hint) скрыта во время теста и будет показана на странице результатов
				}
				else if (q.type === 'match') {
					const picked = Array.isArray(state.answers[q.id]) ? state.answers[q.id] : [];
					inputHtml = `<div class="match" data-role="match">
						${q.matchLeft.map((l, i) => `
							<div class="match__left"><b>${l.letter})</b> ${l.label}</div>
							<select class="match__select" data-idx="${i}">
								<option value="">—</option>
								${q.matchRight.map(r => `<option value="${r.id}" ${picked[i]===r.id?'selected':''}>${r.id}) ${r.label}</option>`).join('')}
							</select>
						`).join('')}
					</div>`;
				}
				else if (q.type === 'open') {
					inputHtml = `<div class="open-answer"><b>Развёрнутый ответ.</b> Решение проверяется вручную — запишите его на бумаге. После завершения теста экран предложит ввести, считаете ли вы задачу решённой.</div>`;
				}

				elCard.innerHTML = `
					<div class="q-head">
						<div class="q-head__left">
							<div class="q-tag">Вопрос <b>${state.current + 1}</b> / ${TRIAL_COUNT} · ${taskTypeLabel(q)}</div>
							<h1 class="q-title">${q.title}</h1>
						</div>
					</div>
					<div class="q-body">${q.body}</div>
					${inputHtml}
					<div class="q-foot">
						<div class="q-foot__left">
							<span style="font-size: 13px; color: var(--muted);">После перехода дальше вернуться к этому вопросу нельзя.</span>
						</div>
						<div class="q-foot__right">
							<button type="button" class="btn btn--blue" id="btn-next">${state.current === TRIAL_COUNT - 1 ? 'Завершить тест →' : 'Дальше →'}</button>
						</div>
					</div>
				`;
				wireQuestion(q);
			}

			function taskTypeLabel(q) {
				switch(q.type) {
					case 'single': return 'один ответ';
					case 'multi': return q.pickCount ? `выбор ${q.pickCount}-х` : 'несколько ответов';
					case 'input': return 'число';
					case 'match': return 'соответствие';
					case 'open': return 'развёрнутый ответ';
				}
				return '';
			}

			function wireQuestion(q) {
				const btnNext = document.getElementById('btn-next');
				function updateNext() {
					btnNext.disabled = !isAnswered(q.id);
				}
				updateNext();
				btnNext.addEventListener('click', () => {
					if (!isAnswered(q.id)) return;
					if (state.current < TRIAL_COUNT - 1) {
						state.current++;
						saveState();
						renderAll();
					} else {
						finishTest();
					}
				});

				// options
				if (q.type === 'single' || q.type === 'multi') {
					const isMulti = q.type === 'multi';
					elCard.querySelectorAll('.option').forEach(el => {
						el.addEventListener('click', () => {
							const id = el.dataset.id;
							if (!isMulti) {
								state.answers[q.id] = id;
							} else {
								const cur = new Set(Array.isArray(state.answers[q.id]) ? state.answers[q.id] : []);
								if (cur.has(id)) cur.delete(id);
								else {
									if (q.pickCount && cur.size >= q.pickCount) {
										// swap oldest
										const first = cur.values().next().value;
										cur.delete(first);
									}
									cur.add(id);
								}
								state.answers[q.id] = Array.from(cur);
							}
							saveState();
							// обновим визуал выбора вручную, без full re-render
							const picked = state.answers[q.id];
							const pickedSet = new Set(Array.isArray(picked) ? picked : (picked ? [picked] : []));
							elCard.querySelectorAll('.option').forEach(o => {
								o.classList.toggle('is--checked', pickedSet.has(o.dataset.id));
							});
							renderNav();
							updateNext();
						});
					});
				}
				else if (q.type === 'input') {
					const input = document.getElementById('ans-input');
					input.addEventListener('input', () => {
						state.answers[q.id] = input.value.trim();
						saveState();
						renderNav();
						updateNext();
					});
				}
				else if (q.type === 'match') {
					elCard.querySelectorAll('.match__select').forEach(sel => {
						sel.addEventListener('change', () => {
							const cur = Array.isArray(state.answers[q.id]) ? [...state.answers[q.id]] : [];
							const idx = Number(sel.dataset.idx);
							cur[idx] = sel.value;
							state.answers[q.id] = cur;
							saveState();
							renderNav();
							updateNext();
						});
					});
				}
			}

			function escapeAttr(s) { return String(s).replace(/"/g,'&quot;'); }

			// ============================================================
			// TIMER
			// ============================================================
			const elTimer = document.getElementById('timer');
			const elTimerVal = document.getElementById('timer-val');
			if (elTimerVal) {
				elTimerVal.textContent = String(TRIAL_MIN).padStart(2, '0') + ':00';
			}
			function tickTimer() {
				if (state.finished) return;
				const elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
				const left = Math.max(0, TEST_SECONDS - elapsed);
				const m = Math.floor(left / 60);
				const s = left % 60;
				elTimerVal.textContent = [m, s].map(x => String(x).padStart(2,'0')).join(':');
				elTimer.classList.toggle('is--warning', left < 10*60 && left >= 3*60);
				elTimer.classList.toggle('is--danger', left < 3*60);
				if (left === 0) finishTest();
			}
			setInterval(tickTimer, 1000);
			tickTimer();

			// ============================================================
			// FINISH & RESULT
			// ============================================================
			function finishTest() {
				state.finished = true;
				saveState();
				try {
					if (window.MistakesStore) {
						const items = QUESTIONS.map(q => ({ qid: q.id, ok: checkAnswer(q).status === 'ok' }));
						window.MistakesStore.commitTestResults({ source: 'trial', items });
					}
				} catch(e) {}
				try {
					if (window.ChemProgress) {
						const s = computeScoring();
						ChemProgress.recordAttempt({
							mode: 'trial',
							label: 'Пробный вариант · ' + TRIAL_MIN + ' мин',
							correct: s.autoPoints,
							total: s.total,
							percent: s.percent,
							items: QUESTIONS.map(function (q) {
								return { qid: q.id, ok: checkAnswer(q).status === 'ok' };
							})
						});
					}
				} catch (e2) {}
				renderResult();
			}

			function renderResult() {
				const elTimerEl = document.getElementById('timer');
				if (elTimerEl) elTimerEl.style.display = 'none';
				const scoring = computeScoring();
				const { autoPoints, autoDone, percent, total } = scoring;

				// Прогноз оценки ОГЭ по проценту (официальные границы Химия ОГЭ 2024)
				// 0–9: "2", 10–20: "3", 21–30: "4", 31–40: "5" → в процентах: 25/50/75
				let grade, gradeLabel, gradeHint, gradeColor;
				if (percent >= 75) { grade = 5; gradeLabel = 'Отлично'; gradeHint = 'Уровень «5» по шкале ОГЭ. Можно смело идти на экзамен.'; gradeColor = '#2fa968'; }
				else if (percent >= 50) { grade = 4; gradeLabel = 'Хорошо'; gradeHint = 'Уровень «4». Твёрдые знания, есть куда расти.'; gradeColor = '#4f7bd6'; }
				else if (percent >= 25) { grade = 3; gradeLabel = 'Удовлетворительно'; gradeHint = 'Уровень «3». Порог сдан, но нужна ещё тренировка.'; gradeColor = '#e39b2a'; }
				else { grade = 2; gradeLabel = 'Неудовлетворительно'; gradeHint = 'Уровень «2». Вернись к разминке и теории по темам.'; gradeColor = '#d65a5a'; }

				document.querySelector('.page__main').innerHTML = `
					<div class="container">
						<div class="result-wrap">
							<div class="result-card">
								<div class="q-tag" style="justify-content:center;">Пробный вариант завершён</div>

								<div style="font-size: 88px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; margin: 18px 0 6px; color: ${gradeColor};">${grade}</div>
								<p style="font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 6px;">${gradeLabel}</p>
								<p style="color:var(--muted); font-size:14px; max-width: 380px; margin: 0 auto;">${gradeHint}</p>

								<div class="result-breakdown">
									<div class="rb-item"><div class="rb-num">${autoPoints}<span style="color:var(--muted); font-size:14px; font-weight:600;"> / ${total}</span></div><div class="rb-label">правильных</div></div>
									<div class="rb-item"><div class="rb-num">${percent}<span style="color:var(--muted); font-size:14px; font-weight:600;">%</span></div><div class="rb-label">выполнение</div></div>
									<div class="rb-item"><div class="rb-num">${grade}</div><div class="rb-label">прогноз ОГЭ</div></div>
								</div>

								<p class="result-hint" style="text-align:center;">Прогноз рассчитан по официальной шкале ОГЭ по химии · <b>${autoDone}</b> из ${total} заданий решено</p>

								<div style="margin-top:24px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
									<button type="button" class="btn btn--blue" id="btn-review">Посмотреть разбор</button>
									<button type="button" class="btn btn--ghost" id="btn-restart">Пройти ещё раз</button>
									<a href="/subject-chemistry/" class="btn btn--ghost">К предмету</a>
								</div>
							</div>
						</div>
					</div>
				`;

				document.getElementById('btn-review').addEventListener('click', () => renderReview('all'));
				document.getElementById('btn-restart').addEventListener('click', () => {
					if (confirm('Пройти заново? Будет выбрана новая случайная подборка заданий.')) {
						try { localStorage.removeItem(LS_KEY); } catch(e){}
						location.reload();
					}
				});
			}

			function computeScoring() {
				let autoPoints = 0, autoDone = 0;
				QUESTIONS.forEach(q => {
					const res = checkAnswer(q);
					if (res.status !== 'skip') autoDone++;
					if (res.status === 'ok') autoPoints++;
				});
				const total = QUESTIONS.length;
				const percent = total > 0 ? Math.round(autoPoints / total * 100) : 0;
				return { autoPoints, autoDone, percent, total };
			}

			function checkAnswer(q) {
				const given = state.answers[q.id];
				const correct = q.correct;
				const isEmpty = given === undefined || given === '' ||
					(Array.isArray(given) && given.filter(x => x).length === 0);
				if (isEmpty) return { status: 'skip', given, correct };
				let ok = false;
				if (Array.isArray(correct)) {
					if (q.type === 'match') {
						const g = Array.isArray(given) ? given.map(x => x || '').join(',') : '';
						const c = correct.join(',');
						ok = g === c;
					} else {
						const g = (Array.isArray(given) ? [...given] : []).sort().join(',');
						const c = [...correct].sort().join(',');
						ok = g === c;
					}
				} else {
					ok = String(given).trim().toLowerCase() === String(correct).trim().toLowerCase();
				}
				return { status: ok ? 'ok' : 'wrong', given, correct };
			}

			function formatAnswer(q, val) {
				if (val === undefined || val === '' || (Array.isArray(val) && val.filter(x => x).length === 0)) {
					return '<span>нет ответа</span>';
				}
				if (q.type === 'match') {
					const arr = Array.isArray(val) ? val : [];
					return q.matchLeft.map((l, i) => `${l.letter}→${arr[i] || '—'}`).join(', ');
				}
				if (q.type === 'multi') {
					const arr = Array.isArray(val) ? [...val].sort() : [];
					return arr.join('');
				}
				return String(val);
			}

			function renderReview(filter) {
				const elTimerEl = document.getElementById('timer');
				if (elTimerEl) elTimerEl.style.display = 'none';
				const scoring = computeScoring();
				const { autoPoints, total, percent, autoDone } = scoring;

				const items = QUESTIONS.map((q, idx) => ({ q, idx, res: checkAnswer(q) }));
				const filtered = items.filter(it => {
					if (filter === 'wrong')  return it.res.status === 'wrong' || it.res.status === 'skip';
					if (filter === 'ok')     return it.res.status === 'ok';
					return true;
				});

				const cls = { ok: 'is--ok', wrong: 'is--wrong', skip: 'is--skip' };
				const lbl = { ok: 'Правильно', wrong: 'Ошибка', skip: 'Пропущено' };

				const listHtml = filtered.length === 0
					? `<div class="review-item"><div class="review-item__body" style="text-align:center; color:var(--muted);">В этой категории заданий нет.</div></div>`
					: filtered.map(({ q, idx, res }) => {
						const yourVal = formatAnswer(q, res.given);
						const corrVal = formatAnswer(q, res.correct);
						const yourCls = res.status === 'ok' ? 'is--correct'
										: res.status === 'skip' ? 'is--muted' : 'is--wrong';
						return `
							<article class="review-item ${cls[res.status]}">
								<div class="review-item__head">
									<span class="review-item__num">${idx + 1}</span>
									<span class="review-item__title">${q.title}</span>
									<span class="review-item__badge">${lbl[res.status]}</span>
								</div>
								<div class="review-item__body">${q.body}</div>
								<div class="review-answers">
									<div class="review-answer ${yourCls}">
										<span class="review-answer__label">Ваш ответ</span>
										<span class="review-answer__value">${yourVal}</span>
									</div>
									<div class="review-answer is--correct">
										<span class="review-answer__label">Правильный ответ</span>
										<span class="review-answer__value">${corrVal}</span>
									</div>
								</div>
								${q.hint ? `
									<div class="review-hint">
										<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
										<div><b>Разбор.</b> ${q.hint}</div>
									</div>
								` : ''}
							</article>
						`;
					}).join('');

				const wrongCount = items.filter(i => i.res.status !== 'ok').length;
				const okCount = items.filter(i => i.res.status === 'ok').length;

				document.querySelector('.page__main').innerHTML = `
					<div class="container" style="padding-top: 18px; padding-bottom: 48px;">
						<div class="review-head">
							<div>
								<div class="review-head__score"><b>${autoPoints}</b><span>/ ${total} · ${percent}%</span></div>
								<div class="review-head__meta">Отвечено <b>${autoDone}</b> из <b>${total}</b> · Правильно <b>${okCount}</b> · Ошибок и пропусков <b>${wrongCount}</b></div>
							</div>
							<div class="review-filter">
								<button type="button" data-f="all"   class="${filter==='all'?'is--on':''}">Все · ${total}</button>
								<button type="button" data-f="wrong" class="${filter==='wrong'?'is--on':''}">Ошибки · ${wrongCount}</button>
								<button type="button" data-f="ok"    class="${filter==='ok'?'is--on':''}">Правильно · ${okCount}</button>
							</div>
							<div class="review-actions">
								<button type="button" class="btn btn--ghost" id="btn-back-summary">← К сводке</button>
								<button type="button" class="btn btn--blue" id="btn-restart-2">Пройти заново</button>
							</div>
						</div>
						<div class="review-list">${listHtml}</div>
					</div>
				`;

				document.querySelectorAll('.review-filter button').forEach(b => {
					b.addEventListener('click', () => renderReview(b.dataset.f));
				});
				document.getElementById('btn-back-summary').addEventListener('click', renderResult);
				document.getElementById('btn-restart-2').addEventListener('click', () => {
					if (confirm('Начать заново? Все ответы будут удалены.')) {
						try { localStorage.removeItem(LS_KEY); } catch(e){}
						location.reload();
					}
				});
			}

			// quit
			document.getElementById('btn-quit').addEventListener('click', () => {
				if (confirm('Выйти из теста? Прогресс сохранится, вы сможете вернуться и продолжить.')) {
					window.location.href = '/subject-chemistry/';
				}
			});
			document.getElementById('btn-finish').addEventListener('click', () => {
				const answered = QUESTIONS.filter(q => isAnswered(q.id)).length;
				const msg = answered < QUESTIONS.length
					? `Вы ответили на ${answered} из ${QUESTIONS.length} вопросов. Пропущенные будут засчитаны как неверные. Завершить досрочно?`
					: 'Завершить пробный вариант?';
				if (confirm(msg)) finishTest();
			});

			// init
			function renderAll() { renderNav(); renderQuestion(); }
			if (state.finished) renderResult();
			else renderAll();
		</script>
	</body>
</html>
