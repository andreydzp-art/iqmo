<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Первый этап по биологии · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="bio-card.css"/>
<style>
  html,body{margin:0;height:100%;}
  body{
    display:grid; place-items:center; min-height:100vh;
    background:
      radial-gradient(900px 600px at 50% -10%, rgba(37,99,235,.10), transparent 70%),
      #eef3fb;
    font-family:'Inter',system-ui,sans-serif;
  }
  .hint{position:fixed; top:18px; left:50%; transform:translateX(-50%); font:600 13px/1 'Inter',sans-serif; color:#2563eb; opacity:.7;}
</style>
</head>
<body>
  <div class="hint">наведи курсор на карточку</div>
<article class="bio-card">
  <div class="scene"></div>
  <span class="rarity">Редкая</span>

  <div class="orb-stage">
    <!-- floating hexagons -->
    <div class="hex h1"><svg viewBox="0 0 30 34" fill="none" stroke="#60a5fa" stroke-width="1.2"><polygon points="15,2 28,9 28,25 15,32 2,25 2,9"/></svg></div>
    <div class="hex h2"><svg viewBox="0 0 30 34" fill="none" stroke="#60a5fa" stroke-width="1.2"><polygon points="15,2 28,9 28,25 15,32 2,25 2,9"/></svg></div>
    <div class="hex h3"><svg viewBox="0 0 30 34" fill="none" stroke="#60a5fa" stroke-width="1.2"><polygon points="15,2 28,9 28,25 15,32 2,25 2,9"/></svg></div>

    <!-- blue orb + leaf -->
    <div class="orb">
      <svg class="leaf" viewBox="0 0 64 64">
        <defs>
          <linearGradient id="bioLeaf" x1="20" y1="8" x2="44" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0%"  stop-color="#bbf7d0"/>
            <stop offset="50%" stop-color="#4ade80"/>
            <stop offset="100%" stop-color="#16a34a"/>
          </linearGradient>
        </defs>
        <path d="M32 7 C19 19 17 41 32 57 C47 41 45 19 32 7 Z" fill="url(#bioLeaf)" stroke="#15803d" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M32 12 L32 54" stroke="#15803d" stroke-width="2" opacity=".55" stroke-linecap="round"/>
        <path d="M32 24 L23 19 M32 24 L41 19 M32 34 L22 30 M32 34 L42 30 M32 43 L25 40 M32 43 L39 40" stroke="#15803d" stroke-width="1.2" opacity=".4" stroke-linecap="round"/>
        <path d="M27 16 C22 24 21 34 24 44" stroke="#ffffff" stroke-width="1.5" opacity=".45" stroke-linecap="round" fill="none"/>
      </svg>
      <span class="drop d1"></span>
      <span class="drop d2"></span>
      <span class="drop d3"></span>
    </div>

    <!-- blue check badge -->
    <svg class="check" viewBox="0 0 64 64">
      <defs>
        <linearGradient id="bioHexFill" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%"  stop-color="#60a5fa"/>
          <stop offset="100%" stop-color="#2563eb"/>
        </linearGradient>
      </defs>
      <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="url(#bioHexFill)" stroke="#93c5fd" stroke-width="2"/>
      <path d="M20 32 L29 41 L46 24" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <!-- floating orbs -->
    <span class="ball b1"></span>
    <span class="ball b2"></span>
    <span class="ball b3"></span>
    <span class="ball b4"></span>
  </div>

  <div class="title-block">
    <h4 class="title">Первый этап<br/>по биологии</h4>
    <div class="subtitle">Успешно пройди 1 этап по биологии</div>
  </div>

  <div class="divider"><span></span></div>

  <div class="prog">
    <div class="prog-row">
      <span class="label">Прогресс</span>
      <span class="count"><b>1</b><span class="sep">/</span>1</span>
    </div>
    <div class="prog-bar"><i style="width:100%"></i></div>
  </div>

  <div class="reward">
    <div class="reward-item">
      <div class="reward-ico">
        <svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 11-13h-7z"/></svg>
      </div>
      <div class="reward-text">
        <span class="reward-val">+150 XP</span>
        <span class="reward-lbl">Награда</span>
      </div>
    </div>
  </div>
</article>
</body>
</html>
